<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 559" width="480" height="559" role="img" data-kind="xsection" data-theme="light">
<title>Two cross-sections of the wafer, one above the other. Before the polish, a thick fill oxide buries the lined trench and the nitride-covered active areas. After the polish, the oxide is left only in the trench, level with the nitride on the active areas.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the polish, a thick fill oxide buries the lined trench and the nitride-covered active areas. After the polish, the oxide is left only in the trench, level with the nitride on the active areas.</desc>
<style>
