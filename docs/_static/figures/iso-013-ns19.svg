<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 603" width="480" height="603" role="img" data-kind="xsection" data-theme="auto">
<title>Two cross-sections of the wafer, one above the other. Before the strip the polished surface is a mosaic of nitride islands and oxide-filled trenches. After it the nitride is gone, the active areas are covered only by the thin pad oxide, and the oxide-filled trench stands proud of them.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the strip the polished surface is a mosaic of nitride islands and oxide-filled trenches. After it the nitride is gone, the active areas are covered only by the thin pad oxide, and the oxide-filled trench stands proud of them.</desc>
