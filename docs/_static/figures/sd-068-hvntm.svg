<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 517" width="480" height="517" role="img" data-kind="xsection" data-theme="auto">
<title>Two cross-sections of the wafer, one above the other. Before the step the left-hand active area is bare oxide, a wide capped stack stands on the oxide-filled trench and a narrow capped gate on the right-hand active area, with doped layers beside it. After it a thin resist film follows the surface over the trench, both stacks and the right-hand area, and leaves the left-hand area open.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step the left-hand active area is bare oxide, a wide capped stack stands on the oxide-filled trench and a narrow capped gate on the right-hand active area, with doped layers beside it. After it a thin resist film follows the surface over the trench, both stacks and the right-hand area, and leaves the left-hand area open.</desc>
