<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 592" width="480" height="592" role="img" data-kind="xsection" data-theme="dark">
<title>Two cross-sections of the wafer, one above the other. Before the step a narrow capped gate stack stands on the thin oxide of the left-hand active area and a wider capped stack on the oxide-filled trench. After it a thin new oxide lines both sides of the gate stack and lies on top of the old thin oxide over both active areas; the tops of the stacks are unchanged.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step a narrow capped gate stack stands on the thin oxide of the left-hand active area and a wider capped stack on the oxide-filled trench. After it a thin new oxide lines both sides of the gate stack and lies on top of the old thin oxide over both active areas; the tops of the stacks are unchanged.</desc>
