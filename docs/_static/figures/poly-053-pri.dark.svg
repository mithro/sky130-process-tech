<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 697" width="480" height="697" role="img" data-kind="xsection" data-theme="dark">
<title>Two cross-sections of the wafer, one above the other. Before the step resist covers a film everywhere except one window over the middle of the oxide-filled trench; the film under the resist is already drawn in the colour of one doping type and the film in the window is not. After it arrows come down on the whole slice, and the film in the window is drawn in a second colour through its whole thickness.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step resist covers a film everywhere except one window over the middle of the oxide-filled trench; the film under the resist is already drawn in the colour of one doping type and the film in the window is not. After it arrows come down on the whole slice, and the film in the window is drawn in a second colour through its whole thickness.</desc>
