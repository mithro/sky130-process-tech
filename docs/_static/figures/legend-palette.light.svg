<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 855" width="480" height="855" role="img" data-kind="legend" data-theme="light">
<title>Figure palette</title>
<desc>A key to the colours used in every cross-section on this site: one swatch per material, with the material&#x27;s name beside it and the pattern that is printed over the colour, so that colour is never the only thing that tells two materials apart.</desc>
<style>
:root{--bg:#ffffff;--ink:#1b1f24;--ink-muted:#545d68;--rule:#c4cad1;--halo:#ffffff;--accent:#0a58b0;--inferred:#9a5b00;--m-si-sub:#c6cbd1;--m-well-n:#a3cdf5;--m-well-p:#f7b3cd;--m-well-dn:#7fb0e0;--m-sd-n:#2f7fd1;--m-sd-p:#c43d83;--m-oxide-thermal:#e3b92e;--m-oxide-dep:#f7e9a8;--m-psg:#f7e9a8;--m-nitride:#74c7a5;--m-ono:#2d3e6e;--m-poly:#d9662b;--m-resist:#b49ce0;--m-silicide:#1f6f6c;--m-barrier:#3d2f5b;--m-tungsten:#5b6673;--m-aluminium:#b3c0cc;--m-mim-diel:#e3b92e;--m-polyimide:#dcb98f;--ph-feol:#9cc4ea;--pht-feol:#e7f1fa;--ph-mol:#f0c060;--pht-mol:#fbf1dc;--ph-beol:#86cdb4;--pht-beol:#e4f4ee;}
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif;fill:var(--ink)}
.t-panel-title{font-size:14px;font-weight:700}
.t-label-title{font-size:14px;font-weight:600}
.t-label-note{font-size:13px;font-weight:400}
.t-mono{font-size:12.5px;font-weight:400}
.t-mono{font-family:'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace}
.muted{fill:var(--ink-muted)}.tag{fill:var(--inferred);font-style:italic}.acc{fill:var(--accent)}
.ground{fill:var(--bg)}.mat{stroke:var(--ink);stroke-width:1.0;stroke-linejoin:round}
.pat{stroke:var(--ink);stroke-width:0.7;opacity:0.38;fill:none}.patdot{fill:var(--ink);opacity:0.38}
.leader{stroke:var(--ink-muted);stroke-width:0.9;fill:none}.halo{stroke:var(--halo);stroke-width:2.6;fill:none;opacity:0.85}.dot{fill:var(--ink)}
.dim{stroke:var(--ink);stroke-width:0.9;fill:none}.dimhead{fill:var(--ink)}.witness{stroke:var(--ink-muted);stroke-width:0.75;stroke-dasharray:3 2.5;fill:none}
.rule{stroke:var(--rule);stroke-width:0.75;fill:none}.hl{stroke:var(--accent);stroke-width:2.4;fill:none;stroke-linejoin:round;stroke-linecap:round}.parrow{stroke:var(--accent);stroke-width:2.0;fill:none}.pahead{fill:var(--accent)}
.ion{stroke:var(--accent);stroke-width:1.4;fill:none}.ionhead{fill:var(--accent)}
.cbox{fill:var(--bg);stroke:var(--ink);stroke-width:1.0;stroke-linejoin:round}.carrow{stroke:var(--ink-muted);stroke-width:1.6;fill:none}.cahead{fill:var(--ink-muted)}
.m-si-sub{fill:var(--m-si-sub)}.m-well-n{fill:var(--m-well-n)}.m-well-p{fill:var(--m-well-p)}.m-well-dn{fill:var(--m-well-dn)}.m-sd-n{fill:var(--m-sd-n)}.m-sd-p{fill:var(--m-sd-p)}.m-oxide-thermal{fill:var(--m-oxide-thermal)}.m-oxide-dep{fill:var(--m-oxide-dep)}.m-psg{fill:var(--m-psg)}.m-nitride{fill:var(--m-nitride)}.m-ono{fill:var(--m-ono)}.m-poly{fill:var(--m-poly)}.m-resist{fill:var(--m-resist)}.m-silicide{fill:var(--m-silicide)}.m-barrier{fill:var(--m-barrier)}.m-tungsten{fill:var(--m-tungsten)}.m-aluminium{fill:var(--m-aluminium)}.m-mim-diel{fill:var(--m-mim-diel)}.m-polyimide{fill:var(--m-polyimide)}.ph-feol{fill:var(--ph-feol)}.pht-feol{fill:var(--pht-feol)}.ph-mol{fill:var(--ph-mol)}.pht-mol{fill:var(--pht-mol)}.ph-beol{fill:var(--ph-beol)}.pht-beol{fill:var(--pht-beol)}
</style>
<defs><pattern id="p-dots" width="7" height="7" patternUnits="userSpaceOnUse"><circle class="patdot" cx="1.75" cy="1.75" r="0.9"/><circle class="patdot" cx="5.25" cy="5.25" r="0.9"/></pattern><pattern id="p-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="pat" x1="0" y1="0" x2="0" y2="6"/></pattern><pattern id="p-hatch-back" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line class="pat" x1="0" y1="0" x2="0" y2="7"/></pattern><pattern id="p-hlines" width="6" height="5" patternUnits="userSpaceOnUse"><line class="pat" x1="0" y1="2.5" x2="6" y2="2.5"/></pattern><pattern id="p-plus" width="12" height="12" patternUnits="userSpaceOnUse"><path class="pat" d="M3 1V5M1 3H5M9 7V11M7 9H11"/></pattern><pattern id="p-vlines" width="4" height="6" patternUnits="userSpaceOnUse"><line class="pat" x1="2" y1="0" x2="2" y2="6"/></pattern><pattern id="p-xhatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path class="pat" d="M0 0V6M0 0H6"/></pattern></defs>
<rect class="ground" x="0" y="0" width="480" height="855"/>
<text x="12.0" y="26.0" class="t-panel-title">The palette</text>
<polygon class="mat m-si-sub" data-layer="si-sub" points="12.0,45.0 58.0,45.0 58.0,64.0 12.0,64.0"/>
<text x="68.0" y="49.9" class="t-label-title">Silicon substrate (p-type)</text>
<text x="68.0" y="66.9" class="t-label-note muted">no pattern</text>
<polygon class="mat m-well-n" data-layer="well-n" points="12.0,86.0 58.0,86.0 58.0,105.0 12.0,105.0"/>
<text x="68.0" y="90.9" class="t-label-title">N-well</text>
<text x="68.0" y="107.9" class="t-label-note muted">no pattern</text>
<polygon class="mat m-well-p" data-layer="well-p" points="12.0,127.0 58.0,127.0 58.0,146.0 12.0,146.0"/>
<polygon fill="url(#p-plus)" points="12.0,127.0 58.0,127.0 58.0,146.0 12.0,146.0"/>
<text x="68.0" y="131.9" class="t-label-title">P-well</text>
<text x="68.0" y="148.9" class="t-label-note muted">plus pattern over the colour</text>
<polygon class="mat m-well-dn" data-layer="well-dn" points="12.0,168.0 58.0,168.0 58.0,187.0 12.0,187.0"/>
<polygon fill="url(#p-hlines)" points="12.0,168.0 58.0,168.0 58.0,187.0 12.0,187.0"/>
<text x="68.0" y="172.9" class="t-label-title">Deep N-well</text>
<text x="68.0" y="189.9" class="t-label-note muted">hlines pattern over the colour</text>
<polygon class="mat m-sd-n" data-layer="sd-n" points="12.0,209.0 58.0,209.0 58.0,228.0 12.0,228.0"/>
<text x="68.0" y="213.9" class="t-label-title">N+ source/drain, n-tip</text>
<text x="68.0" y="230.9" class="t-label-note muted">no pattern</text>
<polygon class="mat m-sd-p" data-layer="sd-p" points="12.0,250.0 58.0,250.0 58.0,269.0 12.0,269.0"/>
<polygon fill="url(#p-plus)" points="12.0,250.0 58.0,250.0 58.0,269.0 12.0,269.0"/>
<text x="68.0" y="254.9" class="t-label-title">P+ source/drain</text>
<text x="68.0" y="271.9" class="t-label-note muted">plus pattern over the colour</text>
<polygon class="mat m-oxide-thermal" data-layer="oxide-thermal" points="12.0,291.0 58.0,291.0 58.0,310.0 12.0,310.0"/>
<text x="68.0" y="295.9" class="t-label-title">Thermal oxide (pad, liner, gate, screen)</text>
<text x="68.0" y="312.9" class="t-label-note muted">no pattern</text>
<polygon class="mat m-oxide-dep" data-layer="oxide-dep" points="12.0,340.5 58.0,340.5 58.0,359.5 12.0,359.5"/>
<text x="68.0" y="336.9" class="t-label-title">Deposited oxide (field oxide, inter-level</text>
<text x="68.0" y="353.9" class="t-label-title">dielectric, cap oxide, TOPOX)</text>
<text x="68.0" y="370.9" class="t-label-note muted">no pattern</text>
<polygon class="mat m-psg" data-layer="psg" points="12.0,390.0 58.0,390.0 58.0,409.0 12.0,409.0"/>
<polygon fill="url(#p-dots)" points="12.0,390.0 58.0,390.0 58.0,409.0 12.0,409.0"/>
<text x="68.0" y="394.9" class="t-label-title">Phosphosilicate glass (PSG)</text>
<text x="68.0" y="411.9" class="t-label-note muted">dots pattern over the colour</text>
<polygon class="mat m-nitride" data-layer="nitride" points="12.0,431.0 58.0,431.0 58.0,450.0 12.0,450.0"/>
<polygon fill="url(#p-hatch)" points="12.0,431.0 58.0,431.0 58.0,450.0 12.0,450.0"/>
<text x="68.0" y="435.9" class="t-label-title">Silicon nitride (hard mask, spacer, LINT, TOPNIT)</text>
<text x="68.0" y="452.9" class="t-label-note muted">hatch pattern over the colour</text>
<polygon class="mat m-ono" data-layer="ono" points="12.0,472.0 58.0,472.0 58.0,491.0 12.0,491.0"/>
<polygon fill="url(#p-hlines)" points="12.0,472.0 58.0,472.0 58.0,491.0 12.0,491.0"/>
<text x="68.0" y="476.9" class="t-label-title">ONO charge-trap stack</text>
<text x="68.0" y="493.9" class="t-label-note muted">hlines pattern over the colour</text>
<polygon class="mat m-poly" data-layer="poly" points="12.0,513.0 58.0,513.0 58.0,532.0 12.0,532.0"/>
<text x="68.0" y="517.9" class="t-label-title">Polysilicon</text>
<text x="68.0" y="534.9" class="t-label-note muted">no pattern</text>
<polygon class="mat m-resist" data-layer="resist" points="12.0,554.0 58.0,554.0 58.0,573.0 12.0,573.0"/>
<polygon fill="url(#p-dots)" points="12.0,554.0 58.0,554.0 58.0,573.0 12.0,573.0"/>
<text x="68.0" y="558.9" class="t-label-title">Photoresist</text>
<text x="68.0" y="575.9" class="t-label-note muted">dots pattern over the colour</text>
<polygon class="mat m-silicide" data-layer="silicide" points="12.0,595.0 58.0,595.0 58.0,614.0 12.0,614.0"/>
<text x="68.0" y="599.9" class="t-label-title">Titanium silicide</text>
<text x="68.0" y="616.9" class="t-label-note muted">no pattern</text>
<polygon class="mat m-barrier" data-layer="barrier" points="12.0,644.5 58.0,644.5 58.0,663.5 12.0,663.5"/>
<text x="68.0" y="640.9" class="t-label-title">Ti / TiN / TiW (liner, barrier, cap,</text>
<text x="68.0" y="657.9" class="t-label-title">local interconnect, MiM plate)</text>
<text x="68.0" y="674.9" class="t-label-note muted">no pattern</text>
<polygon class="mat m-tungsten" data-layer="tungsten" points="12.0,694.0 58.0,694.0 58.0,713.0 12.0,713.0"/>
<polygon fill="url(#p-xhatch)" points="12.0,694.0 58.0,694.0 58.0,713.0 12.0,713.0"/>
<text x="68.0" y="698.9" class="t-label-title">Tungsten plug</text>
<text x="68.0" y="715.9" class="t-label-note muted">xhatch pattern over the colour</text>
<polygon class="mat m-aluminium" data-layer="aluminium" points="12.0,735.0 58.0,735.0 58.0,754.0 12.0,754.0"/>
<polygon fill="url(#p-hatch-back)" points="12.0,735.0 58.0,735.0 58.0,754.0 12.0,754.0"/>
<text x="68.0" y="739.9" class="t-label-title">Aluminium-copper metal</text>
<text x="68.0" y="756.9" class="t-label-note muted">hatch-back pattern over the colour</text>
<polygon class="mat m-mim-diel" data-layer="mim-diel" points="12.0,776.0 58.0,776.0 58.0,795.0 12.0,795.0"/>
<polygon fill="url(#p-vlines)" points="12.0,776.0 58.0,776.0 58.0,795.0 12.0,795.0"/>
<text x="68.0" y="780.9" class="t-label-title">MiM capacitor dielectric</text>
<text x="68.0" y="797.9" class="t-label-note muted">vlines pattern over the colour</text>
<polygon class="mat m-polyimide" data-layer="polyimide" points="12.0,817.0 58.0,817.0 58.0,836.0 12.0,836.0"/>
<polygon fill="url(#p-hlines)" points="12.0,817.0 58.0,817.0 58.0,836.0 12.0,836.0"/>
<text x="68.0" y="821.9" class="t-label-title">Polyimide</text>
<text x="68.0" y="838.9" class="t-label-note muted">hlines pattern over the colour</text>
</svg>
