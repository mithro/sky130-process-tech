<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 511" width="480" height="511" role="img" data-kind="xsection" data-theme="dark">
<title>Two cross-sections of the wafer, one above the other. Before the step the surface is flat apart from the filled trench, whose oxide stands slightly proud of the thin pad oxide over the two active areas. After it a block of photoresist covers the right-hand active area and the right half of the trench, and the left-hand active area lies in an open window.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step the surface is flat apart from the filled trench, whose oxide stands slightly proud of the thin pad oxide over the two active areas. After it a block of photoresist covers the right-hand active area and the right half of the trench, and the left-hand active area lies in an open window.</desc>
