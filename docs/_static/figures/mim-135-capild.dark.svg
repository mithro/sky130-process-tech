<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 576" width="480" height="576" role="img" data-kind="xsection" data-theme="dark">
<title>Two enlarged cross-sections of the upper films, cut off at the bottom. Before the step a flat pale oxide carries a blanket of three metal films, a thick silver one between two thin purple ones. After it a very thin film with fine vertical stripes covers the top purple film across the whole width.</title>
<desc>Two enlarged cross-sections of the upper films, cut off at the bottom. Before the step a flat pale oxide carries a blanket of three metal films, a thick silver one between two thin purple ones. After it a very thin film with fine vertical stripes covers the top purple film across the whole width.</desc>
