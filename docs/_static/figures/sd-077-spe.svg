<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 671" width="480" height="671" role="img" data-kind="xsection" data-theme="auto">
<title>Two enlarged cross-sections of one transistor edge, one above the other. Before the step a film of even thickness covers a capped gate and the oxide beside it. After it the film is gone from the top of the gate and from the flat oxide, and remains only as a block against each sidewall of the gate, as tall as the gate.</title>
<desc>Two enlarged cross-sections of one transistor edge, one above the other. Before the step a film of even thickness covers a capped gate and the oxide beside it. After it the film is gone from the top of the gate and from the flat oxide, and remains only as a block against each sidewall of the gate, as tall as the gate.</desc>
