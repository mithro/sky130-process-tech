<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 416" width="480" height="416" role="img" data-kind="xsection" data-theme="auto">
<title>One cross-section of the wafer. Thick resist covers the whole slice, over a P-well on the left and an N-well on the right; arrows come down across the whole slice and stop on the resist. The drawing is the same as the state before the step.</title>
