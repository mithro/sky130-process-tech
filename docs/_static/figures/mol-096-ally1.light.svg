<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 266" width="480" height="266" role="img" data-kind="xsection" data-theme="light">
<title>One cross-section of the wafer. Three holes with sloping walls go down through a thin flat oxide and a dotted glass: two to the silicon of the active areas and a shallower one in the middle to the top of the wide stack. Nothing is in the holes. The drawing is the same as the state before the step.</title>
<desc>One cross-section of the wafer. Three holes with sloping walls go down through a thin flat oxide and a dotted glass: two to the silicon of the active areas and a shallower one in the middle to the top of the wide stack. Nothing is in the holes. The drawing is the same as the state before the step.</desc>
