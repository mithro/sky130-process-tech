<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 785" width="480" height="785" role="img" data-kind="xsection" data-theme="dark">
<title>Two cross-sections of the wafer, one above the other. Before the step the N-well lies under the open window beside the thick resist. After it a second set of arrows comes down on the same window; the drawing of the well is unchanged.</title>
