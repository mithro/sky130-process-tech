<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 751" width="480" height="751" role="img" data-kind="xsection" data-theme="dark">
<title>Two cross-sections of the wafer, one above the other. Before the step thick resist covers the N-well on the right. After it arrows come down on the open left-hand part of the drawing, and a P-type region reaches from the silicon surface to a flat bottom, shallower than the N-well, under the left-hand active area and the left half of the trench; it meets the N-well in the middle of the trench.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step thick resist covers the N-well on the right. After it arrows come down on the open left-hand part of the drawing, and a P-type region reaches from the silicon surface to a flat bottom, shallower than the N-well, under the left-hand active area and the left half of the trench; it meets the N-well in the middle of the trench.</desc>
