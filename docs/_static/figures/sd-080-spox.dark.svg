<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 643" width="480" height="643" role="img" data-kind="xsection" data-theme="dark">
<title>Two enlarged cross-sections of one transistor edge, one above the other. Before the step a capped gate stands with a nitride block against each sidewall, on a thin oxide over doped silicon. After it a thin new film of even thickness covers everything: the flat oxide, the outer face and top of the nitride block and the top of the gate.</title>
<desc>Two enlarged cross-sections of one transistor edge, one above the other. Before the step a capped gate stands with a nitride block against each sidewall, on a thin oxide over doped silicon. After it a thin new film of even thickness covers everything: the flat oxide, the outer face and top of the nitride block and the top of the gate.</desc>
