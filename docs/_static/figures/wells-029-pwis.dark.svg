<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 648" width="480" height="648" role="img" data-kind="xsection" data-theme="dark">
<title>Two cross-sections of the wafer, one above the other. Before the step thick implanted resist covers the N-well on the right. After it the resist is gone and the oxide surface is bare across the slice, over a P-well on the left and an N-well on the right that meet under the middle of the trench.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step thick implanted resist covers the N-well on the right. After it the resist is gone and the oxide surface is bare across the slice, over a P-well on the left and an N-well on the right that meet under the middle of the trench.</desc>
