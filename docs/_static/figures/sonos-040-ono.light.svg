<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 591" width="480" height="591" role="img" data-kind="xsection" data-theme="light">
<title>Two cross-sections of the wafer, one above the other. Before the step thin oxide covers both active areas except for a window over the right-hand one, where the silicon is bare. After it a thin oxide fills the window flush with the oxide around it, and two more thin films, a nitride and an oxide above it, run unbroken over the whole surface, active areas and filled trench alike.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step thin oxide covers both active areas except for a window over the right-hand one, where the silicon is bare. After it a thin oxide fills the window flush with the oxide around it, and two more thin films, a nitride and an oxide above it, run unbroken over the whole surface, active areas and filled trench alike.</desc>
