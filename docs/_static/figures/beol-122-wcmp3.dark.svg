<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 619" width="480" height="619" role="img" data-kind="xsection" data-theme="dark">
<title>Two enlarged cross-sections of a filled hole in a flat pale oxide over a metal line. Before the step a thick grey tungsten film over a thin purple liner covers the whole top and fills the hole. After it the top is flat oxide again, with the tungsten and its liner left only inside the hole, their tops level with the oxide.</title>
<desc>Two enlarged cross-sections of a filled hole in a flat pale oxide over a metal line. Before the step a thick grey tungsten film over a thin purple liner covers the whole top and fills the hole. After it the top is flat oxide again, with the tungsten and its liner left only inside the hole, their tops level with the oxide.</desc>
