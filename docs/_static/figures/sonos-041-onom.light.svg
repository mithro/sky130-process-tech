<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 578" width="480" height="578" role="img" data-kind="xsection" data-theme="light">
<title>Two cross-sections of the wafer, one above the other. Before the step three thin films, oxide, nitride and oxide, cover the whole surface. After it a block of photoresist sits on them over the right-hand active area only, starting a little to the left of the window in the oxide and running on to the right-hand edge; the films elsewhere are exposed.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step three thin films, oxide, nitride and oxide, cover the whole surface. After it a block of photoresist sits on them over the right-hand active area only, starting a little to the left of the window in the oxide and running on to the right-hand edge; the films elsewhere are exposed.</desc>
