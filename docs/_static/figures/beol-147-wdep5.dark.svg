<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 703" width="480" height="703" role="img" data-kind="xsection" data-theme="dark">
<title>Two enlarged cross-sections of a shallow lined hole going down through a flat pale oxide to a purple plate on a very thin striped film over a metal line. Before the step a thin purple liner covers the oxide and the walls and floor of the hole. After it a thick grey cross-hatched tungsten film covers the liner everywhere and fills the hole completely, with a slight dip in its top surface over the hole.</title>
<desc>Two enlarged cross-sections of a shallow lined hole going down through a flat pale oxide to a purple plate on a very thin striped film over a metal line. Before the step a thin purple liner covers the oxide and the walls and floor of the hole. After it a thick grey cross-hatched tungsten film covers the liner everywhere and fills the hole completely, with a slight dip in its top surface over the hole.</desc>
