<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 628" width="480" height="628" role="img" data-kind="xsection" data-theme="light">
<title>Two cross-sections of the wafer, one above the other. Before the step the lined trench is still open. After it a thick blanket of deposited oxide covers everything: it fills the trench and buries the nitride-covered active areas under a flat top surface.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step the lined trench is still open. After it a thick blanket of deposited oxide covers everything: it fills the trench and buries the nitride-covered active areas under a flat top surface.</desc>
