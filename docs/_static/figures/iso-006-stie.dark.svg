<text x="304.0" y="322.9" class="t-label-title" data-owner="sub">Silicon wafer</text>
<text x="304.0" y="338.9" class="t-label-note muted" data-owner="sub">p-type bulk substrate</text>
<text x="304.0" y="354.9" class="t-label-note muted" data-owner="sub">(SMAT, step 001)</text>
<path class="leader" data-owner="sub" d="M272.0 226.0H283.0L300.0 318.0"/>
<circle class="dot" cx="272.0" cy="226.0" r="1.9"/>
<text x="304.0" y="250.9" class="t-label-title" data-owner="padox">Pad oxide</text>
<text x="304.0" y="266.9" class="t-label-note muted" data-owner="padox">thermal silicon dioxide</text>
<text x="304.0" y="282.9" class="t-label-note muted" data-owner="padox">grown over the whole</text>
<text x="304.0" y="298.9" class="t-label-note muted" data-owner="padox">surface at BOX, step 002</text>
<path class="leader" data-owner="padox" d="M272.0 147.5H283.0L300.0 246.0"/>
<circle class="dot" cx="272.0" cy="147.5" r="1.9"/>
<text x="304.0" y="178.9" class="t-label-title" data-owner="isonit">Nitride hard mask</text>
<text x="304.0" y="194.9" class="t-label-note muted" data-owner="isonit">blanket LPCVD silicon</text>
<text x="304.0" y="210.9" class="t-label-note muted" data-owner="isonit">nitride deposited at</text>
<text x="304.0" y="226.9" class="t-label-note muted" data-owner="isonit">ISONIT, step 003</text>
<path class="leader" data-owner="isonit" d="M272.0 141.5H283.0L300.0 174.0"/>
<circle class="dot" cx="272.0" cy="141.5" r="1.9"/>
<text x="304.0" y="90.9" class="t-label-title" data-owner="resist">Photoresist</text>
<text x="304.0" y="106.9" class="t-label-note muted" data-owner="resist">developed through the</text>
<text x="304.0" y="122.9" class="t-label-note muted" data-owner="resist">field oxide mask at FOM,</text>
<text x="304.0" y="138.9" class="t-label-note muted" data-owner="resist">step 004; it stays over</text>
<text x="304.0" y="154.9" class="t-label-note muted" data-owner="resist">the future active areas</text>
<path class="leader" data-owner="resist" d="M272.0 86.5H283.0L300.0 86.0"/>
<circle class="dot" cx="272.0" cy="86.5" r="1.9"/>
<text x="155.0" y="49.9" class="t-label-title" data-owner="callout0">Bare silicon</text>
<text x="155.0" y="65.9" class="t-label-note muted" data-owner="callout0">the future field region</text>
<path class="leader" data-owner="callout0" d="M146.0 150.0V45.0H151.0"/>
<circle class="dot" cx="146.0" cy="150.0" r="1.9"/>
<path class="parrow" d="M34 379.0V417.0"/>
<path class="pahead" d="M34 425.0l-5.5 -9h11.0z"/>
<text x="50.0" y="390.0" class="t-label-title acc">STIE, step 006</text>
<text x="50.0" y="405.0" class="t-label-note muted">A halogen plasma etches the open</text>
<text x="50.0" y="420.0" class="t-label-note muted">field; the resist is then stripped.</text>
<text x="12.0" y="453.0" class="t-panel-title">After: trench etched, resist stripped</text>
