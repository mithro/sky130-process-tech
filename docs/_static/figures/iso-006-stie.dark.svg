<text x="135.0" y="492.9" class="t-label-note muted" text-anchor="end" data-owner="dim0">not public; about</text>
<text x="135.0" y="508.9" class="t-label-note muted" text-anchor="end" data-owner="dim0">0.33 µm is this</text>
<text x="135.0" y="524.9" class="t-label-note muted" text-anchor="end" data-owner="dim0">page&#x27;s reading</text>
<text x="135.0" y="540.9" class="t-label-note tag" text-anchor="end" data-owner="dim0">our reading</text>
<path class="leader" data-owner="dim0" d="M132.0 615.0H144.0V472.0H139.0"/>
<text x="197.0" y="476.9" class="t-label-title" data-owner="callout0">Tapered wall,</text>
<text x="197.0" y="492.9" class="t-label-title" data-owner="callout0">rounded corners</text>
<text x="197.0" y="508.9" class="t-label-note muted" data-owner="callout0">so that the liner oxide and the</text>
<text x="197.0" y="524.9" class="t-label-note muted" data-owner="callout0">fill can follow (steps 010, 011)</text>
<text x="197.0" y="540.9" class="t-label-note tag" data-owner="callout0">typical practice</text>
<path class="leader" data-owner="callout0" d="M188.0 641.8V472.0H193.0"/>
