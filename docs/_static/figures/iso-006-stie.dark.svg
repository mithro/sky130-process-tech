<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 675" width="480" height="675" role="img" data-kind="xsection" data-theme="dark">
<title>Two cross-sections of the wafer, one above the other. Before the step, photoresist, the nitride hard mask and the pad oxide cover two active areas and the silicon between them is bare. After the step a trench with slightly tapered walls and rounded bottom corners has been etched into that bare silicon, and the resist is gone.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step, photoresist, the nitride hard mask and the pad oxide cover two active areas and the silicon between them is bare. After the step a trench with slightly tapered walls and rounded bottom corners has been etched into that bare silicon, and the resist is gone.</desc>
<style>
