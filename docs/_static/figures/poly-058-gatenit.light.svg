<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 458" width="480" height="458" role="img" data-kind="xsection" data-theme="light">
<title>Two cross-sections of the wafer, one above the other. Before the step a continuous film covers the whole slice. After it a second, hatched film lies on top of the first across the whole slice, following the same small steps.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step a continuous film covers the whole slice. After it a second, hatched film lies on top of the first across the whole slice, following the same small steps.</desc>
