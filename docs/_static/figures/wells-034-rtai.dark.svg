<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 610" width="480" height="610" role="img" data-kind="xsection" data-theme="dark">
<title>Two cross-sections of the wafer, one above the other and identical: pad oxide over a P-well on the left and an N-well on the right, which meet under the middle of an oxide-filled trench, with a thin implanted band at the surface of each active area.</title>
<desc>Two cross-sections of the wafer, one above the other and identical: pad oxide over a P-well on the left and an N-well on the right, which meet under the middle of an oxide-filled trench, with a thin implanted band at the surface of each active area.</desc>
