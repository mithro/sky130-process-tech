<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 775" width="480" height="775" role="img" data-kind="xsection" data-theme="dark">
<title>Two cross-sections of the wafer, one above the other. Before the step the N-well lies under the open window beside the thick resist. After it arrows come down on the window again, and a thin band just under the surface of the right-hand active silicon, inside the N-well, marks the implanted channel dose.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step the N-well lies under the open window beside the thick resist. After it arrows come down on the window again, and a thin band just under the surface of the right-hand active silicon, inside the N-well, marks the implanted channel dose.</desc>
