<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 702" width="480" height="702" role="img" data-kind="xsection" data-theme="auto">
<title>Two cross-sections of the wafer, one above the other. Before the step photoresist covers the surface except for a window over the right-hand active area, whose bottom is thin oxide. After it arrows come straight down into the window, and a hatched band lies a short way below the silicon surface under the window only; the silicon under the resist is untouched.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step photoresist covers the surface except for a window over the right-hand active area, whose bottom is thin oxide. After it arrows come straight down into the window, and a hatched band lies a short way below the silicon surface under the window only; the silicon under the resist is untouched.</desc>
