<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 559" width="480" height="559" role="img" data-kind="xsection" data-theme="dark">
<title>Two cross-sections of the wafer, one above the other. Before the step two active areas lie either side of an oxide-filled trench whose top stands proud of them; the left-hand area is covered by a thicker oxide than the right-hand one. After it one continuous film covers the whole slice, following the steps at each edge of the trench.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step two active areas lie either side of an oxide-filled trench whose top stands proud of them; the left-hand area is covered by a thicker oxide than the right-hand one. After it one continuous film covers the whole slice, following the steps at each edge of the trench.</desc>
