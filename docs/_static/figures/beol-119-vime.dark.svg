<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 770" width="480" height="770" role="img" data-kind="xsection" data-theme="dark">
<title>Two enlarged cross-sections of one metal line, a thick silver film between two thin purple ones, buried in a flat pale oxide. Before the step a violet resist with a narrow window lies on the oxide above the line. After it the resist is gone and under the window a hole with vertical walls goes down through the oxide to the thin purple film on top of the line.</title>
<desc>Two enlarged cross-sections of one metal line, a thick silver film between two thin purple ones, buried in a flat pale oxide. Before the step a violet resist with a narrow window lies on the oxide above the line. After it the resist is gone and under the window a hole with vertical walls goes down through the oxide to the thin purple film on top of the line.</desc>
