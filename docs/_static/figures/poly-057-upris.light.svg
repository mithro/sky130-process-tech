<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 587" width="480" height="587" role="img" data-kind="xsection" data-theme="light">
<title>Two cross-sections of the wafer, one above the other. Before the step resist covers the whole slice. After it the resist is gone and a continuous film is bare across the whole slice.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step resist covers the whole slice. After it the resist is gone and a continuous film is bare across the whole slice.</desc>
