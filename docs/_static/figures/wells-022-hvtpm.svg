<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 721" width="480" height="721" role="img" data-kind="xsection" data-theme="auto">
<title>Two cross-sections of the wafer, one above the other. Before the step the oxide surface is bare over an N-well on the right. After it a block of photoresist covers the left-hand part of the drawing up to the middle of the trench, and the right-hand active area, with its implanted surface band, lies in an open window.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step the oxide surface is bare over an N-well on the right. After it a block of photoresist covers the left-hand part of the drawing up to the middle of the trench, and the right-hand active area, with its implanted surface band, lies in an open window.</desc>
