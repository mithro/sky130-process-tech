<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 292" width="480" height="292" role="img" data-kind="xsection" data-theme="dark">
<title>One cross-section of the upper films, cut off at the bottom: two thick metal shapes under a thin pale film and a thick green film, which are cut away over the middle of the left-hand shape, leaving its top bare. The drawing is the same as the state before the step.</title>
<desc>One cross-section of the upper films, cut off at the bottom: two thick metal shapes under a thin pale film and a thick green film, which are cut away over the middle of the left-hand shape, leaving its top bare. The drawing is the same as the state before the step.</desc>
