<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 637" width="480" height="637" role="img" data-kind="xsection" data-theme="dark">
<title>Two cross-sections of the wafer, one above the other. Before the step photoresist covers the surface except for a window over the right-hand active area, and a thin anti-reflective film runs under the resist and across the bottom of the window. After it the film is gone from the bottom of the window, leaving the thin pad oxide bare there, and is unchanged under the resist.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step photoresist covers the surface except for a window over the right-hand active area, and a thin anti-reflective film runs under the resist and across the bottom of the window. After it the film is gone from the bottom of the window, leaving the thin pad oxide bare there, and is unchanged under the resist.</desc>
