<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 735" width="480" height="735" role="img" data-kind="xsection" data-theme="auto">
<title>Two enlarged cross-sections of the upper films, cut off at the bottom. Before the step a violet resist block stands on a purple film over the right-hand part of the width. After it the resist is gone and the purple film remains only where the resist was, as a raised plate with a vertical edge; to its left the very thin striped film is bare on the blanket metal stack.</title>
<desc>Two enlarged cross-sections of the upper films, cut off at the bottom. Before the step a violet resist block stands on a purple film over the right-hand part of the width. After it the resist is gone and the purple film remains only where the resist was, as a raised plate with a vertical edge; to its left the very thin striped film is bare on the blanket metal stack.</desc>
