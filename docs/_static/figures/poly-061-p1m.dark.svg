<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 653" width="480" height="653" role="img" data-kind="xsection" data-theme="dark">
<title>Two cross-sections of the wafer, one above the other. Before the step three stacked films cover the whole slice. After it two narrow resist lines stand on the stack: a narrow one over the left-hand active area and a wider one over the middle of the oxide-filled trench.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step three stacked films cover the whole slice. After it two narrow resist lines stand on the stack: a narrow one over the left-hand active area and a wider one over the middle of the oxide-filled trench.</desc>
