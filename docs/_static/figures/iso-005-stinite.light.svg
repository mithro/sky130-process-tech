<polygon class="mat m-oxide-thermal" data-layer="padox" points="9.00,517.00 91.75,517.00 91.75,522.00 9.00,522.00"/>
<polygon class="mat m-oxide-thermal" data-layer="padox" points="200.25,517.00 283.00,517.00 283.00,522.00 200.25,522.00"/>
<polygon class="mat m-nitride" data-layer="isonit" points="9.00,493.00 91.75,493.00 91.75,517.00 9.00,517.00"/>
<polygon fill="url(#p-hatch)" points="9.00,493.00 91.75,493.00 91.75,517.00 9.00,517.00"/>
<polygon class="mat m-nitride" data-layer="isonit" points="200.25,493.00 283.00,493.00 283.00,517.00 200.25,517.00"/>
<polygon fill="url(#p-hatch)" points="200.25,493.00 283.00,493.00 283.00,517.00 200.25,517.00"/>
<polygon class="mat m-resist" data-layer="resist" points="9.00,455.00 91.75,455.00 91.75,493.00 9.00,493.00"/>
<polygon fill="url(#p-dots)" points="9.00,455.00 91.75,455.00 91.75,493.00 9.00,493.00"/>
<polygon class="mat m-resist" data-layer="resist" points="200.25,455.00 283.00,455.00 283.00,493.00 200.25,493.00"/>
<polygon fill="url(#p-dots)" points="200.25,455.00 283.00,455.00 283.00,493.00 200.25,493.00"/>
<polyline class="hl" points="92.00,519.00 200.00,519.00"/>
</g>
<text x="328.0" y="556.9" class="t-label-title" data-owner="sub">Silicon wafer</text>
<path class="leader" data-owner="sub" d="M276.0 552.0H285.0H324.0"/>
<circle class="dot" data-owner="sub" cx="276.0" cy="552.0" r="1.9"/>
<text x="328.0" y="532.9" class="t-label-title" data-owner="padox">Pad oxide</text>
<path class="leader" data-owner="padox" d="M276.0 519.5H291.0V528.0H324.0"/>
<circle class="dot" data-owner="padox" cx="276.0" cy="519.5" r="1.9"/>
<text x="328.0" y="492.9" class="t-label-title" data-owner="isonit">Nitride</text>
<text x="328.0" y="508.9" class="t-label-title" data-owner="isonit">hard mask</text>
<path class="leader" data-owner="isonit" d="M276.0 496.5H297.0V488.0H324.0"/>
<circle class="dot" data-owner="isonit" cx="276.0" cy="496.5" r="1.9"/>
<text x="328.0" y="465.5" class="t-label-title" data-owner="resist">Photoresist</text>
<path class="leader" data-owner="resist" d="M276.0 460.6H303.0H324.0"/>
<circle class="dot" data-owner="resist" cx="276.0" cy="460.6" r="1.9"/>
<text x="155.0" y="421.9" class="t-label-title" data-owner="callout0">Bare silicon</text>
<text x="155.0" y="437.9" class="t-label-note muted" data-owner="callout0">the future field region</text>
<path class="leader" data-owner="callout0" d="M146.0 522.0V417.0H151.0"/>
<circle class="dot" data-owner="callout0" cx="146.0" cy="522.0" r="1.9"/>
<text x="12.0" y="630.0" class="t-label-note muted">Not to scale. Thin films are drawn thicker than they are.</text>
</svg>
