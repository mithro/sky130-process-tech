<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 642" width="480" height="642" role="img" data-kind="xsection" data-theme="light">
<title>Two cross-sections of the wafer, one above the other. Before the step the nitride and pad oxide run unbroken under the two blocks of resist and across the gap between them. After it the nitride and pad oxide have been cut away in that gap, so the silicon in the middle of the drawing is bare while the sides are still covered by resist, nitride and pad oxide.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step the nitride and pad oxide run unbroken under the two blocks of resist and across the gap between them. After it the nitride and pad oxide have been cut away in that gap, so the silicon in the middle of the drawing is bare while the sides are still covered by resist, nitride and pad oxide.</desc>
<style>
:root{--bg:#ffffff;--ink:#1b1f24;--ink-muted:#545d68;--rule:#c4cad1;--halo:#ffffff;--accent:#0a58b0;--inferred:#9a5b00;--m-si-sub:#c6cbd1;--m-well-n:#a3cdf5;--m-well-p:#f7b3cd;--m-well-dn:#7fb0e0;--m-sd-n:#2f7fd1;--m-sd-p:#c43d83;--m-implant:#1b1f24;--m-oxide-thermal:#e3b92e;--m-oxide-dep:#f7e9a8;--m-psg:#efe0b4;--m-nitride:#74c7a5;--m-ono:#2d3e6e;--m-poly:#d9662b;--m-resist:#b49ce0;--m-arc:#8a6a50;--m-silicide:#1f6f6c;--m-barrier:#3d2f5b;--m-tungsten:#5b6673;--m-aluminium:#b3c0cc;--m-mim-diel:#c69a55;--m-polyimide:#dcb98f;--ph-feol:#9cc4ea;--pht-feol:#e7f1fa;--ph-mol:#f0c060;--pht-mol:#fbf1dc;--ph-beol:#86cdb4;--pht-beol:#e4f4ee;}
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif;fill:var(--ink)}
.t-panel-title{font-size:14px;font-weight:700}
.t-label-title{font-size:14px;font-weight:600}
.t-label-note{font-size:13px;font-weight:400}
.t-mono{font-size:12.5px;font-weight:400}
.t-mono{font-family:'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace}
.muted{fill:var(--ink-muted)}.tag{fill:var(--inferred);font-style:italic}.acc{fill:var(--accent)}
.ground{fill:var(--bg)}.mat{stroke:var(--ink);stroke-width:1.0;stroke-linejoin:round}
.pat{stroke:var(--ink);stroke-width:0.7;opacity:0.38;fill:none}.patdot{fill:var(--ink);opacity:0.38}
.leader{stroke:var(--ink-muted);stroke-width:0.9;fill:none}.halo{stroke:var(--halo);stroke-width:2.6;fill:none;opacity:0.85}.dot{fill:var(--ink)}.mat.faded{fill:none;stroke:var(--ink-muted);stroke-dasharray:3 2}
.patink{stroke:var(--ink);stroke-width:0.8;opacity:0.8;fill:none}
.dim{stroke:var(--ink);stroke-width:0.9;fill:none}.dimhead{fill:var(--ink)}.witness{stroke:var(--ink-muted);stroke-width:0.75;stroke-dasharray:3 2.5;fill:none}
.rule{stroke:var(--rule);stroke-width:0.75;fill:none}.hl{stroke:var(--accent);stroke-width:2.4;fill:none;stroke-linejoin:round;stroke-linecap:round}.parrow{stroke:var(--accent);stroke-width:2.0;fill:none}.pahead{fill:var(--accent)}
.ion{stroke:var(--accent);stroke-width:1.8;fill:none}.ionhead{fill:var(--accent)}
.cbox{fill:var(--bg);stroke:var(--ink);stroke-width:1.0;stroke-linejoin:round}.carrow{stroke:var(--ink-muted);stroke-width:1.6;fill:none}.cahead{fill:var(--ink-muted)}
.m-si-sub{fill:var(--m-si-sub)}.m-well-n{fill:var(--m-well-n)}.m-well-p{fill:var(--m-well-p)}.m-well-dn{fill:var(--m-well-dn)}.m-sd-n{fill:var(--m-sd-n)}.m-sd-p{fill:var(--m-sd-p)}.m-implant{fill:none}.m-oxide-thermal{fill:var(--m-oxide-thermal)}.m-oxide-dep{fill:var(--m-oxide-dep)}.m-psg{fill:var(--m-psg)}.m-nitride{fill:var(--m-nitride)}.m-ono{fill:var(--m-ono)}.m-poly{fill:var(--m-poly)}.m-resist{fill:var(--m-resist)}.m-arc{fill:var(--m-arc)}.m-silicide{fill:var(--m-silicide)}.m-barrier{fill:var(--m-barrier)}.m-tungsten{fill:var(--m-tungsten)}.m-aluminium{fill:var(--m-aluminium)}.m-mim-diel{fill:var(--m-mim-diel)}.m-polyimide{fill:var(--m-polyimide)}.ph-feol{fill:var(--ph-feol)}.pht-feol{fill:var(--pht-feol)}.ph-mol{fill:var(--ph-mol)}.pht-mol{fill:var(--pht-mol)}.ph-beol{fill:var(--ph-beol)}.pht-beol{fill:var(--pht-beol)}
</style>
<defs><pattern id="p-dots" width="7" height="7" patternUnits="userSpaceOnUse"><circle class="patdot" cx="1.75" cy="1.75" r="0.9"/><circle class="patdot" cx="5.25" cy="5.25" r="0.9"/></pattern><pattern id="p-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="pat" x1="0" y1="0" x2="0" y2="6"/></pattern></defs>
<rect class="ground" x="0" y="0" width="480" height="642"/>
<text x="12.0" y="26.0" class="t-panel-title">Before: the resist pattern from FOM (step 004)</text>
<clipPath id="clip1"><rect x="12" y="38.0" width="268" height="189.7"/></clipPath>
<g class="drawing" data-rect="12,38.0,268,189.7" clip-path="url(#clip1)">
<polygon class="mat m-si-sub" data-layer="sub" points="9.00,109.00 283.00,109.00 283.00,333.00 9.00,333.00"/>
<polygon class="mat m-oxide-thermal" data-layer="padox" points="9.00,104.00 283.00,104.00 283.00,109.00 9.00,109.00"/>
<polygon class="mat m-nitride" data-layer="isonit" points="9.00,80.00 283.00,80.00 283.00,104.00 9.00,104.00"/>
<polygon fill="url(#p-hatch)" points="9.00,80.00 283.00,80.00 283.00,104.00 9.00,104.00"/>
<polygon class="mat m-resist" data-layer="resist" points="9.00,42.00 91.75,42.00 91.75,80.00 9.00,80.00"/>
<polygon fill="url(#p-dots)" points="9.00,42.00 91.75,42.00 91.75,80.00 9.00,80.00"/>
<polygon class="mat m-resist" data-layer="resist" points="200.25,42.00 283.00,42.00 283.00,80.00 200.25,80.00"/>
<polygon fill="url(#p-dots)" points="200.25,42.00 283.00,42.00 283.00,80.00 200.25,80.00"/>
</g>
<text x="328.0" y="249.9" class="t-label-title" data-owner="sub">Silicon wafer</text>
<text x="328.0" y="265.9" class="t-label-note muted" data-owner="sub">the starting wafer</text>
<text x="328.0" y="281.9" class="t-label-note muted" data-owner="sub">(SMAT, step 001)</text>
<path class="leader" data-owner="sub" d="M276.0 185.0H285.0V245.0H324.0"/>
<circle class="dot" data-owner="sub" cx="276.0" cy="185.0" r="1.9"/>
<text x="328.0" y="161.9" class="t-label-title" data-owner="padox">Pad oxide</text>
<text x="328.0" y="177.9" class="t-label-note muted" data-owner="padox">thermal silicon</text>
<text x="328.0" y="193.9" class="t-label-note muted" data-owner="padox">dioxide grown over</text>
<text x="328.0" y="209.9" class="t-label-note muted" data-owner="padox">the whole surface</text>
<text x="328.0" y="225.9" class="t-label-note muted" data-owner="padox">at BOX, step 002</text>
<path class="leader" data-owner="padox" d="M267.0 106.5H291.0V157.0H324.0"/>
<circle class="dot" data-owner="padox" cx="267.0" cy="106.5" r="1.9"/>
<text x="328.0" y="121.9" class="t-label-title" data-owner="isonit">Nitride</text>
<text x="328.0" y="137.9" class="t-label-title" data-owner="isonit">hard mask</text>
<path class="leader" data-owner="isonit" d="M276.0 100.5H297.0V117.0H324.0"/>
<circle class="dot" data-owner="isonit" cx="276.0" cy="100.5" r="1.9"/>
<text x="328.0" y="49.9" class="t-label-title" data-owner="resist">Photoresist</text>
<text x="328.0" y="65.9" class="t-label-note muted" data-owner="resist">developed through</text>
<text x="328.0" y="81.9" class="t-label-note muted" data-owner="resist">the field oxide mask</text>
<text x="328.0" y="97.9" class="t-label-note muted" data-owner="resist">at FOM, step 004</text>
<path class="leader" data-owner="resist" d="M276.0 45.5H303.0V45.0H324.0"/>
<circle class="dot" data-owner="resist" cx="276.0" cy="45.5" r="1.9"/>
<path class="parrow" d="M34 306.0V344.0"/>
<path class="pahead" d="M34 352.0l-5.5 -9h11.0z"/>
<text x="50.0" y="317.0" class="t-label-title acc">STINITE, step 005</text>
<text x="50.0" y="332.0" class="t-label-note muted">A plasma etch cuts through the nitride and the</text>
<text x="50.0" y="347.0" class="t-label-note muted">pad oxide in the open field, stopping on silicon.</text>
<text x="12.0" y="380.0" class="t-panel-title">After: bare silicon in the field,</text>
<text x="12.0" y="398.0" class="t-panel-title">the active areas still covered</text>
<clipPath id="clip2"><rect x="12" y="451.0" width="268" height="155.0"/></clipPath>
<g class="drawing" data-rect="12,451.0,268,155.0" clip-path="url(#clip2)">
