<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 338" width="480" height="338" role="img" data-kind="xsection" data-theme="light">
<title>One cross-section of the wafer. A flat-topped block of resist covers the whole slice, over two capped stacks and doped layers in the silicon, and arrows come down on the resist everywhere. The drawing is the same as the state before the step.</title>
