<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 598" width="480" height="598" role="img" data-kind="xsection" data-theme="auto">
<title>Two cross-sections of the wafer, one above the other. Before the step the nitride-on-oxide stack covers the whole wafer. After it two blocks of photoresist stand on that stack, one at each side of the drawing, with the middle of the wafer left uncovered between them.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step the nitride-on-oxide stack covers the whole wafer. After it two blocks of photoresist stand on that stack, one at each side of the drawing, with the middle of the wafer left uncovered between them.</desc>
<style>
:root{--bg:#ffffff;--ink:#1b1f24;--ink-muted:#545d68;--rule:#c4cad1;--halo:#ffffff;--accent:#0a58b0;--inferred:#9a5b00;--m-si-sub:#c6cbd1;--m-well-n:#a3cdf5;--m-well-p:#f7b3cd;--m-well-dn:#7fb0e0;--m-sd-n:#2f7fd1;--m-tip-n:#8cc3f2;--m-sd-p:#c43d83;--m-implant:#1b1f24;--m-oxide-thermal:#e3b92e;--m-oxide-dep:#f7e9a8;--m-psg:#efe0b4;--m-nitride:#74c7a5;--m-ono:#2d3e6e;--m-poly:#d9662b;--m-resist:#b49ce0;--m-arc:#8a6a50;--m-silicide:#1f6f6c;--m-barrier:#3d2f5b;--m-tungsten:#5b6673;--m-aluminium:#b3c0cc;--m-mim-diel:#c69a55;--m-polyimide:#dcb98f;--ph-feol:#9cc4ea;--pht-feol:#e7f1fa;--ph-mol:#f0c060;--pht-mol:#fbf1dc;--ph-beol:#86cdb4;--pht-beol:#e4f4ee;}
@media (prefers-color-scheme: dark){:root{--bg:#131416;--ink:#e4e6e9;--ink-muted:#a9b1ba;--rule:#3a3f46;--halo:#131416;--accent:#6ab0ff;--inferred:#e0a84a;--m-si-sub:#454b54;--m-well-n:#2b6196;--m-well-p:#8f4468;--m-well-dn:#1f4d7a;--m-sd-n:#5aa5ee;--m-tip-n:#3b78b8;--m-sd-p:#e57db4;--m-implant:#e4e6e9;--m-oxide-thermal:#ecd05a;--m-oxide-dep:#9a8c52;--m-psg:#bdb391;--m-nitride:#2f8f6f;--m-ono:#aab9ea;--m-poly:#d2571f;--m-resist:#7d63bd;--m-arc:#8f6a55;--m-silicide:#46c4ba;--m-barrier:#d8cdf7;--m-tungsten:#98a3af;--m-aluminium:#6c7b8a;--m-mim-diel:#d4ae5c;--m-polyimide:#7a5f40;--ph-feol:#2f5f8d;--pht-feol:#1b2a38;--ph-mol:#8a6a1f;--pht-mol:#2e2717;--ph-beol:#2c7d65;--pht-beol:#182b25;}}
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif;fill:var(--ink)}
.t-panel-title{font-size:14px;font-weight:700}
.t-label-title{font-size:14px;font-weight:600}
.t-label-note{font-size:13px;font-weight:400}
.t-mono{font-size:12.5px;font-weight:400}
.t-mono{font-family:'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace}
.muted{fill:var(--ink-muted)}.tag{fill:var(--inferred);font-style:italic}.acc{fill:var(--accent)}
.ground{fill:var(--bg)}.mat{stroke:var(--ink);stroke-width:1.0;stroke-linejoin:round}
.pat{stroke:var(--ink);stroke-width:0.7;opacity:0.38;fill:none}.patdot{fill:var(--ink);opacity:0.38}
.leader{stroke:var(--ink-muted);stroke-width:0.9;fill:none}.halo{stroke:var(--halo);stroke-width:2.6;fill:none;opacity:0.85}.dot{fill:var(--ink)}.mat.faded{fill:none;stroke:var(--ink-muted);stroke-dasharray:3 2}
.patink{stroke:var(--ink);stroke-width:0.8;opacity:0.8;fill:none}
.dim{stroke:var(--ink);stroke-width:0.9;fill:none}.dimhead{fill:var(--ink)}.witness{stroke:var(--ink-muted);stroke-width:0.75;stroke-dasharray:3 2.5;fill:none}
.rule{stroke:var(--rule);stroke-width:0.75;fill:none}.hl{stroke:var(--accent);stroke-width:2.4;fill:none;stroke-linejoin:round;stroke-linecap:round}.parrow{stroke:var(--accent);stroke-width:2.0;fill:none}.pahead{fill:var(--accent)}
.ion{stroke:var(--accent);stroke-width:1.8;fill:none}.ionhead{fill:var(--accent)}
.cbox{fill:var(--bg);stroke:var(--ink);stroke-width:1.0;stroke-linejoin:round}.carrow{stroke:var(--ink-muted);stroke-width:1.6;fill:none}.cahead{fill:var(--ink-muted)}
.m-si-sub{fill:var(--m-si-sub)}.m-well-n{fill:var(--m-well-n)}.m-well-p{fill:var(--m-well-p)}.m-well-dn{fill:var(--m-well-dn)}.m-sd-n{fill:var(--m-sd-n)}.m-tip-n{fill:var(--m-tip-n)}.m-sd-p{fill:var(--m-sd-p)}.m-implant{fill:none}.m-oxide-thermal{fill:var(--m-oxide-thermal)}.m-oxide-dep{fill:var(--m-oxide-dep)}.m-psg{fill:var(--m-psg)}.m-nitride{fill:var(--m-nitride)}.m-ono{fill:var(--m-ono)}.m-poly{fill:var(--m-poly)}.m-resist{fill:var(--m-resist)}.m-arc{fill:var(--m-arc)}.m-silicide{fill:var(--m-silicide)}.m-barrier{fill:var(--m-barrier)}.m-tungsten{fill:var(--m-tungsten)}.m-aluminium{fill:var(--m-aluminium)}.m-mim-diel{fill:var(--m-mim-diel)}.m-polyimide{fill:var(--m-polyimide)}.ph-feol{fill:var(--ph-feol)}.pht-feol{fill:var(--pht-feol)}.ph-mol{fill:var(--ph-mol)}.pht-mol{fill:var(--pht-mol)}.ph-beol{fill:var(--ph-beol)}.pht-beol{fill:var(--pht-beol)}
</style>
<defs><pattern id="p-dots" width="7" height="7" patternUnits="userSpaceOnUse"><circle class="patdot" cx="1.75" cy="1.75" r="0.9"/><circle class="patdot" cx="5.25" cy="5.25" r="0.9"/></pattern><pattern id="p-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="pat" x1="0" y1="0" x2="0" y2="6"/></pattern></defs>
<rect class="ground" x="0" y="0" width="480" height="598"/>
<text x="12.0" y="26.0" class="t-panel-title">Before: the blanket nitride/pad-oxide stack</text>
<clipPath id="clip1"><rect x="12" y="38.0" width="268" height="181.7"/></clipPath>
<g class="drawing" data-rect="12,38.0,268,181.7" clip-path="url(#clip1)">
<polygon class="mat m-si-sub" data-layer="sub" points="9.00,71.00 283.00,71.00 283.00,295.00 9.00,295.00"/>
<polygon class="mat m-oxide-thermal" data-layer="padox" points="9.00,66.00 283.00,66.00 283.00,71.00 9.00,71.00"/>
<polygon class="mat m-nitride" data-layer="isonit" points="9.00,42.00 283.00,42.00 283.00,66.00 9.00,66.00"/>
<polygon fill="url(#p-hatch)" points="9.00,42.00 283.00,42.00 283.00,66.00 9.00,66.00"/>
</g>
<text x="328.0" y="241.9" class="t-label-title" data-owner="sub">Silicon wafer</text>
<text x="328.0" y="257.9" class="t-label-note muted" data-owner="sub">the starting wafer</text>
<text x="328.0" y="273.9" class="t-label-note muted" data-owner="sub">(SMAT, step 001)</text>
<path class="leader" data-owner="sub" d="M276.0 119.0H285.0V237.0H324.0"/>
<circle class="dot" data-owner="sub" cx="276.0" cy="119.0" r="1.9"/>
<text x="328.0" y="153.9" class="t-label-title" data-owner="padox">Pad oxide</text>
<text x="328.0" y="169.9" class="t-label-note muted" data-owner="padox">thermal silicon</text>
<text x="328.0" y="185.9" class="t-label-note muted" data-owner="padox">dioxide grown over</text>
<text x="328.0" y="201.9" class="t-label-note muted" data-owner="padox">the whole surface</text>
<text x="328.0" y="217.9" class="t-label-note muted" data-owner="padox">at BOX, step 002</text>
<path class="leader" data-owner="padox" d="M276.0 68.5H291.0V149.0H324.0"/>
<circle class="dot" data-owner="padox" cx="276.0" cy="68.5" r="1.9"/>
<text x="328.0" y="49.9" class="t-label-title" data-owner="isonit">Nitride</text>
<text x="328.0" y="65.9" class="t-label-title" data-owner="isonit">hard mask</text>
<text x="328.0" y="81.9" class="t-label-note muted" data-owner="isonit">blanket LPCVD</text>
<text x="328.0" y="97.9" class="t-label-note muted" data-owner="isonit">silicon nitride</text>
<text x="328.0" y="113.9" class="t-label-note muted" data-owner="isonit">deposited at</text>
<text x="328.0" y="129.9" class="t-label-note muted" data-owner="isonit">ISONIT, step 003</text>
<path class="leader" data-owner="isonit" d="M276.0 45.5H297.0V45.0H324.0"/>
<circle class="dot" data-owner="isonit" cx="276.0" cy="45.5" r="1.9"/>
<path class="parrow" d="M34 298.0V336.0"/>
<path class="pahead" d="M34 344.0l-5.5 -9h11.0z"/>
<text x="50.0" y="309.0" class="t-label-title acc">FOM, step 004</text>
<text x="50.0" y="324.0" class="t-label-note muted">The wafer is coated with resist, exposed</text>
<text x="50.0" y="339.0" class="t-label-note muted">through the field oxide mask and developed.</text>
<text x="12.0" y="372.0" class="t-panel-title">After: resist over the future active</text>
<text x="12.0" y="390.0" class="t-panel-title">areas, open over the future field</text>
<clipPath id="clip2"><rect x="12" y="402.0" width="268" height="127.0"/></clipPath>
<g class="drawing" data-rect="12,402.0,268,127.0" clip-path="url(#clip2)">
<polygon class="mat m-si-sub" data-layer="sub" points="9.00,473.00 283.00,473.00 283.00,697.00 9.00,697.00"/>
<polygon class="mat m-oxide-thermal" data-layer="padox" points="9.00,468.00 283.00,468.00 283.00,473.00 9.00,473.00"/>
<polygon class="mat m-nitride" data-layer="isonit" points="9.00,444.00 283.00,444.00 283.00,468.00 9.00,468.00"/>
<polygon fill="url(#p-hatch)" points="9.00,444.00 283.00,444.00 283.00,468.00 9.00,468.00"/>
<polygon class="mat m-resist" data-layer="resist" points="9.00,406.00 91.75,406.00 91.75,444.00 9.00,444.00"/>
<polygon fill="url(#p-dots)" points="9.00,406.00 91.75,406.00 91.75,444.00 9.00,444.00"/>
<polygon class="mat m-resist" data-layer="resist" points="200.25,406.00 283.00,406.00 283.00,444.00 200.25,444.00"/>
<polygon fill="url(#p-dots)" points="200.25,406.00 283.00,406.00 283.00,444.00 200.25,444.00"/>
<polyline class="hl" points="12.00,403.00 91.50,403.00 92.00,441.00 200.00,441.00 200.50,403.00 280.00,403.00"/>
</g>
<text x="328.0" y="549.9" class="t-label-title" data-owner="sub">Silicon wafer</text>
<path class="leader" data-owner="sub" d="M276.0 521.0H285.0V545.0H324.0"/>
<circle class="dot" data-owner="sub" cx="276.0" cy="521.0" r="1.9"/>
<text x="328.0" y="525.9" class="t-label-title" data-owner="padox">Pad oxide</text>
<path class="leader" data-owner="padox" d="M267.0 470.5H291.0V521.0H324.0"/>
<circle class="dot" data-owner="padox" cx="267.0" cy="470.5" r="1.9"/>
<text x="328.0" y="485.9" class="t-label-title" data-owner="isonit">Nitride</text>
<text x="328.0" y="501.9" class="t-label-title" data-owner="isonit">hard mask</text>
<path class="leader" data-owner="isonit" d="M276.0 464.5H297.0V481.0H324.0"/>
<circle class="dot" data-owner="isonit" cx="276.0" cy="464.5" r="1.9"/>
<text x="328.0" y="413.9" class="t-label-title" data-owner="resist">Photoresist</text>
<text x="328.0" y="429.9" class="t-label-note muted" data-owner="resist">developed through</text>
<text x="328.0" y="445.9" class="t-label-note muted" data-owner="resist">the field oxide mask</text>
<text x="328.0" y="461.9" class="t-label-note muted" data-owner="resist">at FOM, step 004</text>
<path class="leader" data-owner="resist" d="M276.0 409.5H303.0V409.0H324.0"/>
<circle class="dot" data-owner="resist" cx="276.0" cy="409.5" r="1.9"/>
<text x="12.0" y="586.0" class="t-label-note muted">Not to scale. Thin films are drawn thicker than they are.</text>
</svg>
