<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 721" width="480" height="721" role="img" data-kind="xsection" data-theme="dark">
<title>Two enlarged cross-sections of one transistor edge, one above the other. Before the step a shallow doped layer lies in the silicon beside a capped gate. After it arrows come down on both sides of the gate, and a second, hatched region lies under the shallow layer and reaches a short way under the edge of the gate, where it comes up to the silicon surface.</title>
<desc>Two enlarged cross-sections of one transistor edge, one above the other. Before the step a shallow doped layer lies in the silicon beside a capped gate. After it arrows come down on both sides of the gate, and a second, hatched region lies under the shallow layer and reaches a short way under the edge of the gate, where it comes up to the silicon surface.</desc>
