<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 567" width="480" height="567" role="img" data-kind="xsection" data-theme="auto">
<title>Two cross-sections of the wafer, one above the other. Before the step a resist island sits on the three-film stack over the right-hand active area, and the stack is bare elsewhere. After it the resist is gone and the three films survive only as an island under where the resist was; outside it the stack and the thin oxide under it are gone, and the silicon is bare on the left-hand active area and left of the island.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step a resist island sits on the three-film stack over the right-hand active area, and the stack is bare elsewhere. After it the resist is gone and the three films survive only as an island under where the resist was; outside it the stack and the thin oxide under it are gone, and the silicon is bare on the left-hand active area and left of the island.</desc>
