<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 710" width="480" height="710" role="img" data-kind="xsection" data-theme="auto">
<title>Two cross-sections of the wafer, one above the other. Before the step a continuous film covers the whole slice. After it resist covers that film everywhere except one window over the middle of the oxide-filled trench, where the film is bare.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step a continuous film covers the whole slice. After it resist covers that film everywhere except one window over the middle of the oxide-filled trench, where the film is bare.</desc>
