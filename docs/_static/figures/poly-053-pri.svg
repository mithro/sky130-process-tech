<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 371" width="480" height="371" role="img" data-kind="xsection" data-theme="auto">
<title>One cross-section of the wafer. Resist covers a continuous film everywhere except one window over the middle of the oxide-filled trench. Arrows come down on the whole slice; only those in the window reach the film. The drawing is the same as the state before the step.</title>
<desc>One cross-section of the wafer. Resist covers a continuous film everywhere except one window over the middle of the oxide-filled trench. Arrows come down on the whole slice; only those in the window reach the film. The drawing is the same as the state before the step.</desc>
