<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 630" width="480" height="630" role="img" data-kind="xsection" data-theme="auto">
<title>Two cross-sections of the wafer, one above the other. Before the step implanted photoresist covers the right-hand part of the drawing and a thin hatched band lies under the left-hand active surface. After it the resist is gone, the pad oxide and the trench oxide are bare across the whole slice, and the band is unchanged.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step implanted photoresist covers the right-hand part of the drawing and a thin hatched band lies under the left-hand active surface. After it the resist is gone, the pad oxide and the trench oxide are bare across the whole slice, and the band is unchanged.</desc>
