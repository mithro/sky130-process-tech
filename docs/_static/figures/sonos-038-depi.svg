<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 725" width="480" height="725" role="img" data-kind="xsection" data-theme="auto">
<title>Two cross-sections of the wafer, one above the other. Before the step photoresist covers the surface except for a window over the right-hand active area, and a hatched band lies a short way below the silicon surface in the window. After it arrows come straight down into the window and a second, thinner hatched band lies at the silicon surface, above the first.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step photoresist covers the surface except for a window over the right-hand active area, and a hatched band lies a short way below the silicon surface in the window. After it arrows come straight down into the window and a second, thinner hatched band lies at the silicon surface, above the first.</desc>
