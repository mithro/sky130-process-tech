<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 622" width="480" height="622" role="img" data-kind="xsection" data-theme="auto">
<title>Two cross-sections of the wafer, one above the other. Before the step resist covers a continuous film everywhere except one window over the middle of the oxide-filled trench. After it the resist is gone and the film is bare across the whole slice.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step resist covers a continuous film everywhere except one window over the middle of the oxide-filled trench. After it the resist is gone and the film is bare across the whole slice.</desc>
