<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 487" width="480" height="487" role="img" data-kind="xsection" data-theme="light">
<title>Two cross-sections of the wafer, one above the other. Before the step two active areas, each covered by a thin oxide, lie either side of an oxide-filled trench whose top stands a little above them. After it one continuous film covers the whole slice, following the small step at each edge of the trench.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step two active areas, each covered by a thin oxide, lie either side of an oxide-filled trench whose top stands a little above them. After it one continuous film covers the whole slice, following the small step at each edge of the trench.</desc>
