<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 591" width="480" height="591" role="img" data-kind="xsection" data-theme="dark">
<title>Two cross-sections of the wafer, one above the other. Before the step a continuous film covers the whole slice. After it resist covers the whole slice without any opening.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step a continuous film covers the whole slice. After it resist covers the whole slice without any opening.</desc>
