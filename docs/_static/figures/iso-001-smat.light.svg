<text x="328.0" y="56.9" class="t-label-title" data-owner="sub">Silicon wafer</text>
<text x="328.0" y="72.9" class="t-label-note muted" data-owner="sub">p-type bulk</text>
<text x="328.0" y="88.9" class="t-label-note muted" data-owner="sub">substrate (SMAT,</text>
<text x="328.0" y="104.9" class="t-label-note muted" data-owner="sub">step 001)</text>
<path class="leader" data-owner="sub" d="M276.0 52.0H285.0H324.0"/>
