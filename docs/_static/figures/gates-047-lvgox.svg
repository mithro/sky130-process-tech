<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 599" width="480" height="599" role="img" data-kind="xsection" data-theme="auto">
<title>Two cross-sections of the wafer, one above the other. Before the step a thick oxide film covers the left-hand active area and the right-hand active silicon is bare. After it a thin oxide film covers the right-hand active area, drawn thinner than the film on the left, which is drawn unchanged.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step a thick oxide film covers the left-hand active area and the right-hand active silicon is bare. After it a thin oxide film covers the right-hand active area, drawn thinner than the film on the left, which is drawn unchanged.</desc>
