<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 599" width="480" height="599" role="img" data-kind="xsection" data-theme="dark">
<title>Two cross-sections of the wafer, one above the other. Before the step the oxide surface is bare. After it a thick block of photoresist covers the left-hand part of the drawing up to the middle of the trench, and the right-hand active area and the right half of the trench lie in an open window.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step the oxide surface is bare. After it a thick block of photoresist covers the left-hand part of the drawing up to the middle of the trench, and the right-hand active area and the right half of the trench lie in an open window.</desc>
