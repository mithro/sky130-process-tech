<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 663" width="480" height="663" role="img" data-kind="xsection" data-theme="dark">
<title>Two cross-sections of the wafer, one above the other. Before the step a continuous film covers the whole slice, with one block of resist on it over the middle of the oxide-filled trench. After it arrows come down everywhere except on the resist, and the film outside the resist is drawn in a new colour through its whole thickness; the film under the resist keeps its original colour.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step a continuous film covers the whole slice, with one block of resist on it over the middle of the oxide-filled trench. After it arrows come down everywhere except on the resist, and the film outside the resist is drawn in a new colour through its whole thickness; the film under the resist keeps its original colour.</desc>
