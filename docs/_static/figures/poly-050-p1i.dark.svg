<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 371" width="480" height="371" role="img" data-kind="xsection" data-theme="dark">
<title>One cross-section of the wafer. A continuous film covers the whole slice, with one block of resist on it over the middle of the oxide-filled trench. Arrows come down everywhere except on the resist. The drawing is the same as the state before the step.</title>
