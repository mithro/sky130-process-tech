<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 622" width="480" height="622" role="img" data-kind="xsection" data-theme="auto">
<title>Two enlarged cross-sections of the upper films, cut off at the bottom. Before the step a blanket of three metal films, a thick silver one between two thin purple ones, carries a very thin film with fine vertical stripes. After it a purple film, thicker than the thin purple films of the metal stack, covers that striped film across the whole width.</title>
<desc>Two enlarged cross-sections of the upper films, cut off at the bottom. Before the step a blanket of three metal films, a thick silver one between two thin purple ones, carries a very thin film with fine vertical stripes. After it a purple film, thicker than the thin purple films of the metal stack, covers that striped film across the whole width.</desc>
