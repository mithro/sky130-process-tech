<text x="50.0" y="437.0" class="t-label-title acc">CMPNIT, step 012</text>
<text x="50.0" y="452.0" class="t-label-note muted">The wafer is polished face-down until the oxide over the</text>
<text x="50.0" y="467.0" class="t-label-note muted">active areas is gone and the polish lands on the nitride.</text>
<text x="12.0" y="500.0" class="t-panel-title">After: oxide only in the trench, level with the nitride</text>
