<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 603" width="480" height="603" role="img" data-kind="xsection" data-theme="light">
<title>Two cross-sections of the wafer, one above the other. Before the step a flat-topped block of resist covers the whole slice. After it the resist is gone, uncovering a wide capped stack on the oxide-filled trench, a narrow capped gate on the right-hand active area and doped layers in the silicon of both active areas.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step a flat-topped block of resist covers the whole slice. After it the resist is gone, uncovering a wide capped stack on the oxide-filled trench, a narrow capped gate on the right-hand active area and doped layers in the silicon of both active areas.</desc>
