<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 390" width="480" height="390" role="img" data-kind="xsection" data-theme="light">
<title>One enlarged cross-section of one transistor edge. A capped gate with a nitride block and a thin oxide on its sidewall stands on a thin oxide. In the silicon a deep doped region runs from the left edge of the view to the outer foot of the sidewall films, and a shallow doped layer and a hatched region continue under them to the gate edge. The drawing is the same as the state before the step.</title>
<desc>One enlarged cross-section of one transistor edge. A capped gate with a nitride block and a thin oxide on its sidewall stands on a thin oxide. In the silicon a deep doped region runs from the left edge of the view to the outer foot of the sidewall films, and a shallow doped layer and a hatched region continue under them to the gate edge. The drawing is the same as the state before the step.</desc>
