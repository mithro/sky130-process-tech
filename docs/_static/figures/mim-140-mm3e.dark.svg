<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 754" width="480" height="754" role="img" data-kind="xsection" data-theme="dark">
<title>Two enlarged cross-sections of the upper films, cut off at the bottom. Before the step violet resist covers a raised purple plate and a narrower block at the left edge of a blanket metal stack. After it the resist is gone and the metal stack remains only under where it was: a line end at the left and a wide bottom plate at the right, carrying the plate on the thin striped film, with bare pale oxide between them.</title>
<desc>Two enlarged cross-sections of the upper films, cut off at the bottom. Before the step violet resist covers a raised purple plate and a narrower block at the left edge of a blanket metal stack. After it the resist is gone and the metal stack remains only under where it was: a line end at the left and a wide bottom plate at the right, carrying the plate on the thin striped film, with bare pale oxide between them.</desc>
