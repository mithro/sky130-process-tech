<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 234" width="480" height="234" role="img" data-kind="xsection" data-theme="dark">
<title>One cross-section of the wafer. A thin flat oxide lies on a dotted glass with a flat top, which buries two active areas with doped regions in the silicon, an oxide-filled trench with a wide stack on it and a narrow capped gate. The drawing is the same as the state before the step.</title>
<desc>One cross-section of the wafer. A thin flat oxide lies on a dotted glass with a flat top, which buries two active areas with doped regions in the silicon, an oxide-filled trench with a wide stack on it and a narrow capped gate. The drawing is the same as the state before the step.</desc>
