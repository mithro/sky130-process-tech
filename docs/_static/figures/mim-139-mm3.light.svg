<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 762" width="480" height="762" role="img" data-kind="xsection" data-theme="light">
<title>Two enlarged cross-sections of the upper films, cut off at the bottom. Before the step a raised purple plate on a very thin striped film covers the right-hand part of a blanket metal stack. After it violet resist covers the plate and reaches some way to its left, and a second, narrower resist block stands at the left edge; between the two the striped film is bare.</title>
<desc>Two enlarged cross-sections of the upper films, cut off at the bottom. Before the step a raised purple plate on a very thin striped film covers the right-hand part of a blanket metal stack. After it violet resist covers the plate and reaches some way to its left, and a second, narrower resist block stands at the left edge; between the two the striped film is bare.</desc>
