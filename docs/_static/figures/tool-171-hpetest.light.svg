<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 458" width="480" height="458" role="img" data-kind="chain" data-theme="light">
<title>Four boxes one above the other joined by downward arrows: the finished wafer, the wafer prober, the parametric tester, and the results and disposition. Three side boxes point into the last three: a probe card into the prober, the HP 4062UX into the tester, and the PDK&#x27;s e-test specifications into the results.</title>
<desc>Four boxes one above the other joined by downward arrows: the finished wafer, the wafer prober, the parametric tester, and the results and disposition. Three side boxes point into the last three: a probe card into the prober, the HP 4062UX into the tester, and the PDK&#x27;s e-test specifications into the results.</desc>
<style>
:root{--bg:#ffffff;--ink:#1b1f24;--ink-muted:#545d68;--rule:#c4cad1;--halo:#ffffff;--accent:#0a58b0;--inferred:#9a5b00;--m-si-sub:#c6cbd1;--m-well-n:#a3cdf5;--m-well-p:#f7b3cd;--m-well-dn:#7fb0e0;--m-sd-n:#2f7fd1;--m-tip-n:#8cc3f2;--m-sd-p:#c43d83;--m-implant:#1b1f24;--m-oxide-thermal:#e3b92e;--m-oxide-dep:#f7e9a8;--m-psg:#efe0b4;--m-nitride:#74c7a5;--m-ono:#2d3e6e;--m-poly:#d9662b;--m-resist:#b49ce0;--m-arc:#8a6a50;--m-silicide:#1f6f6c;--m-barrier:#3d2f5b;--m-tungsten:#5b6673;--m-aluminium:#b3c0cc;--m-mim-diel:#c69a55;--m-polyimide:#dcb98f;--ph-feol:#9cc4ea;--pht-feol:#e7f1fa;--ph-mol:#f0c060;--pht-mol:#fbf1dc;--ph-beol:#86cdb4;--pht-beol:#e4f4ee;}
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif;fill:var(--ink)}
.t-panel-title{font-size:14px;font-weight:700}
.t-label-title{font-size:14px;font-weight:600}
.t-label-note{font-size:13px;font-weight:400}
.t-mono{font-size:12.5px;font-weight:400}
.t-mono{font-family:'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace}
.muted{fill:var(--ink-muted)}.tag{fill:var(--inferred);font-style:italic}.acc{fill:var(--accent)}
.ground{fill:var(--bg)}.mat{stroke:var(--ink);stroke-width:1.0;stroke-linejoin:round}
.pat{stroke:var(--ink);stroke-width:0.7;opacity:0.38;fill:none}.patdot{fill:var(--ink);opacity:0.38}
.leader{stroke:var(--ink-muted);stroke-width:0.9;fill:none}.halo{stroke:var(--halo);stroke-width:2.6;fill:none;opacity:0.85}.dot{fill:var(--ink)}.mat.faded{fill:none;stroke:var(--ink-muted);stroke-dasharray:3 2}
.patink{stroke:var(--ink);stroke-width:0.8;opacity:0.8;fill:none}
.dim{stroke:var(--ink);stroke-width:0.9;fill:none}.dimhead{fill:var(--ink)}.witness{stroke:var(--ink-muted);stroke-width:0.75;stroke-dasharray:3 2.5;fill:none}
.rule{stroke:var(--rule);stroke-width:0.75;fill:none}.hl{stroke:var(--accent);stroke-width:2.4;fill:none;stroke-linejoin:round;stroke-linecap:round}.parrow{stroke:var(--accent);stroke-width:2.0;fill:none}.pahead{fill:var(--accent)}
.ion{stroke:var(--accent);stroke-width:1.8;fill:none}.ionhead{fill:var(--accent)}
.cbox{fill:var(--bg);stroke:var(--ink);stroke-width:1.0;stroke-linejoin:round}.carrow{stroke:var(--ink-muted);stroke-width:1.6;fill:none}.cahead{fill:var(--ink-muted)}
.m-si-sub{fill:var(--m-si-sub)}.m-well-n{fill:var(--m-well-n)}.m-well-p{fill:var(--m-well-p)}.m-well-dn{fill:var(--m-well-dn)}.m-sd-n{fill:var(--m-sd-n)}.m-tip-n{fill:var(--m-tip-n)}.m-sd-p{fill:var(--m-sd-p)}.m-implant{fill:none}.m-oxide-thermal{fill:var(--m-oxide-thermal)}.m-oxide-dep{fill:var(--m-oxide-dep)}.m-psg{fill:var(--m-psg)}.m-nitride{fill:var(--m-nitride)}.m-ono{fill:var(--m-ono)}.m-poly{fill:var(--m-poly)}.m-resist{fill:var(--m-resist)}.m-arc{fill:var(--m-arc)}.m-silicide{fill:var(--m-silicide)}.m-barrier{fill:var(--m-barrier)}.m-tungsten{fill:var(--m-tungsten)}.m-aluminium{fill:var(--m-aluminium)}.m-mim-diel{fill:var(--m-mim-diel)}.m-polyimide{fill:var(--m-polyimide)}.ph-feol{fill:var(--ph-feol)}.pht-feol{fill:var(--pht-feol)}.ph-mol{fill:var(--ph-mol)}.pht-mol{fill:var(--pht-mol)}.ph-beol{fill:var(--ph-beol)}.pht-beol{fill:var(--pht-beol)}
</style>
<defs></defs>
<rect class="ground" x="0" y="0" width="480" height="458"/>
<text x="12.0" y="26.0" class="t-panel-title">The parametric test at the end of the flow</text>
<rect class="cbox" x="12.0" y="38.0" width="277.8" height="63.0" rx="3"/>
<text x="19.0" y="56.9" class="t-label-title">Finished wafer</text>
<text x="19.0" y="73.9" class="t-label-note muted">annealed at ALLY (step 170), its</text>
<text x="19.0" y="89.9" class="t-label-note muted">pads opened at PDME (step 169)</text>
<path class="carrow" d="M150.9 103.0V111.0"/>
<path class="cahead" d="M150.9 117.0l-3.8 -7h7.6z"/>
<rect class="cbox" x="12.0" y="117.0" width="277.8" height="79.0" rx="3"/>
<text x="19.0" y="135.9" class="t-label-title">Wafer prober</text>
<text x="19.0" y="152.9" class="t-label-note muted">needles are lowered onto the</text>
<text x="19.0" y="168.9" class="t-label-note muted">pads of the test structures</text>
<text x="19.0" y="184.9" class="t-label-note tag">typical practice</text>
<rect class="cbox" x="303.8" y="117.0" width="164.2" height="79.0" rx="3"/>
<text x="310.8" y="135.9" class="t-label-title">Probe card</text>
<text x="310.8" y="152.9" class="t-label-note muted">laid out to the</text>
<text x="310.8" y="168.9" class="t-label-note muted">e-test pad pitch</text>
<text x="310.8" y="184.9" class="t-label-note tag">typical practice</text>
<path class="carrow" d="M301.8 156.5H294.8"/>
<path class="cahead" d="M289.8 156.5l6 -3.4v6.8z"/>
<path class="carrow" d="M150.9 198.0V206.0"/>
<path class="cahead" d="M150.9 212.0l-3.8 -7h7.6z"/>
<rect class="cbox" x="12.0" y="212.0" width="277.8" height="95.0" rx="3"/>
<text x="19.0" y="230.9" class="t-label-title">Parametric tester</text>
<text x="19.0" y="247.9" class="t-label-note muted">measures transistors,</text>
<text x="19.0" y="263.9" class="t-label-note muted">resistors, capacitors, diodes,</text>
<text x="19.0" y="279.9" class="t-label-note muted">contact and via chains</text>
<text x="19.0" y="295.9" class="t-label-note tag">typical practice</text>
<rect class="cbox" x="303.8" y="212.0" width="164.2" height="95.0" rx="3"/>
<text x="310.8" y="230.9" class="t-label-title">HP 4062UX</text>
<text x="310.8" y="247.9" class="t-label-note muted">listed by SkyWater;</text>
<text x="310.8" y="263.9" class="t-label-note muted">its use here is our</text>
<text x="310.8" y="279.9" class="t-label-note muted">inference</text>
<text x="310.8" y="295.9" class="t-label-note tag">inferred</text>
<path class="carrow" d="M301.8 259.5H294.8"/>
<path class="cahead" d="M289.8 259.5l6 -3.4v6.8z"/>
<path class="carrow" d="M150.9 309.0V317.0"/>
<path class="cahead" d="M150.9 323.0l-3.8 -7h7.6z"/>
<rect class="cbox" x="12.0" y="323.0" width="277.8" height="79.0" rx="3"/>
<text x="19.0" y="341.9" class="t-label-title">Results and disposition</text>
<text x="19.0" y="358.9" class="t-label-note muted">compared with the limits; the wafer</text>
<text x="19.0" y="374.9" class="t-label-note muted">is accepted, held or scrapped</text>
<text x="19.0" y="390.9" class="t-label-note tag">typical practice</text>
<rect class="cbox" x="303.8" y="323.0" width="164.2" height="63.0" rx="3"/>
<text x="310.8" y="341.9" class="t-label-title">PDK e-test specs</text>
<text x="310.8" y="358.9" class="t-label-note muted">NOM, LSL and USL</text>
<text x="310.8" y="374.9" class="t-label-note muted">per parameter</text>
<path class="carrow" d="M301.8 354.5H294.8"/>
<path class="cahead" d="M289.8 354.5l6 -3.4v6.8z"/>
<text x="12.0" y="414.0" class="t-label-note muted">Only the blocks this page names, in the order of</text>
<text x="12.0" y="430.0" class="t-label-note muted">its opening paragraph. SkyWater&#x27;s test plan is</text>
<text x="12.0" y="446.0" class="t-label-note muted">not public beyond the PDK&#x27;s parameter tables.</text>
</svg>
