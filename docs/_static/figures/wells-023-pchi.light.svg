<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 760" width="480" height="760" role="img" data-kind="xsection" data-theme="light">
<title>Two cross-sections of the wafer, one above the other. Before the step resist covers the left-hand part of the drawing and the PMOS active area lies in a window. After it arrows come down on the window; the drawing is otherwise unchanged, the thin surface band of the PMOS area now standing for both of the channel implants it has received.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step resist covers the left-hand part of the drawing and the PMOS active area lies in a window. After it arrows come down on the window; the drawing is otherwise unchanged, the thin surface band of the PMOS area now standing for both of the channel implants it has received.</desc>
