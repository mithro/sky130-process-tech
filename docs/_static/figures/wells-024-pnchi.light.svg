<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 766" width="480" height="766" role="img" data-kind="xsection" data-theme="light">
<title>Two cross-sections of the wafer, one above the other. Before the step resist covers the left-hand part of the drawing and the PMOS active area lies in a window. After it a second set of arrows comes down on the same window; the thin surface band of the PMOS area is drawn unchanged.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step resist covers the left-hand part of the drawing and the PMOS active area lies in a window. After it a second set of arrows comes down on the same window; the thin surface band of the PMOS area is drawn unchanged.</desc>
