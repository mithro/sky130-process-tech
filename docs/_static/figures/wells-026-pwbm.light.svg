<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 586" width="480" height="586" role="img" data-kind="xsection" data-theme="light">
<title>Two cross-sections of the wafer, one above the other. Before the step the oxide surface is bare, with an N-well on the right. After it a thick block of photoresist covers the right-hand part of the drawing over the N-well, and the left-hand active area and the left half of the trench lie in an open window.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step the oxide surface is bare, with an N-well on the right. After it a thick block of photoresist covers the right-hand part of the drawing over the N-well, and the left-hand active area and the left half of the trench lie in an open window.</desc>
