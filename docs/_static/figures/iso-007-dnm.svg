<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 566" width="480" height="566" role="img" data-kind="xsection" data-theme="auto">
<title>Two cross-sections of the wafer, one above the other. Before the step the etched trench is open and the wafer carries no resist. After it a thick block of photoresist covers the right-hand part of the drawing, filling nothing on the left, so that the trench and the active area on the left lie in an open window and the active area on the right is masked.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step the etched trench is open and the wafer carries no resist. After it a thick block of photoresist covers the right-hand part of the drawing, filling nothing on the left, so that the trench and the active area on the left lie in an open window and the active area on the right is masked.</desc>
<style>
