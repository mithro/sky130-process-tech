<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 680" width="480" height="680" role="img" data-kind="xsection" data-theme="auto">
<title>Two cross-sections of the wafer, one above the other. Before the step the oxide surface is bare over a P-well on the left and an N-well on the right. After it a thick block of photoresist covers the whole slice: the windows of this mask lie over other devices, not over this pair.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step the oxide surface is bare over a P-well on the left and an N-well on the right. After it a thick block of photoresist covers the whole slice: the windows of this mask lie over other devices, not over this pair.</desc>
