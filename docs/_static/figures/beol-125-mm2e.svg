<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 606" width="480" height="606" role="img" data-kind="xsection" data-theme="auto">
<title>Two enlarged cross-sections over a small tungsten plug set in a pale oxide. Before the step a violet resist line stands on a flat blanket of three films, a thick silver one between two thin purple ones. After it the resist is gone and the three films remain only under where it was: a line with vertical edges standing on the oxide over the plug, with bare oxide on both sides.</title>
<desc>Two enlarged cross-sections over a small tungsten plug set in a pale oxide. Before the step a violet resist line stands on a flat blanket of three films, a thick silver one between two thin purple ones. After it the resist is gone and the three films remain only under where it was: a line with vertical edges standing on the oxide over the plug, with bare oxide on both sides.</desc>
