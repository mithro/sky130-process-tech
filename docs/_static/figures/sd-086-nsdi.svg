<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 791" width="480" height="791" role="img" data-kind="xsection" data-theme="auto">
<title>Two enlarged cross-sections of one transistor edge, one above the other. Before the step a capped gate with a nitride block and a thin oxide on its sidewall stands over a shallow doped layer and a hatched region. After it vertical arrows come down, and a deeper doped region lies in the silicon from the left edge of the view up to the outer foot of the sidewall films; the shallow layer remains under the sidewall films.</title>
<desc>Two enlarged cross-sections of one transistor edge, one above the other. Before the step a capped gate with a nitride block and a thin oxide on its sidewall stands over a shallow doped layer and a hatched region. After it vertical arrows come down, and a deeper doped region lies in the silicon from the left edge of the view up to the outer foot of the sidewall films; the shallow layer remains under the sidewall films.</desc>
