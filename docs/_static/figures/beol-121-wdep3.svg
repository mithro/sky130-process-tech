<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 647" width="480" height="647" role="img" data-kind="xsection" data-theme="auto">
<title>Two enlarged cross-sections of a lined hole going down through a flat pale oxide to a metal line. Before the step a thin purple liner covers the oxide and the walls and floor of the hole. After it a thick grey cross-hatched tungsten film covers the liner everywhere and fills the hole completely, with a dip in its top surface over the hole.</title>
<desc>Two enlarged cross-sections of a lined hole going down through a flat pale oxide to a metal line. Before the step a thin purple liner covers the oxide and the walls and floor of the hole. After it a thick grey cross-hatched tungsten film covers the liner everywhere and fills the hole completely, with a dip in its top surface over the hole.</desc>
