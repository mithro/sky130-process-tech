<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 639" width="480" height="639" role="img" data-kind="xsection" data-theme="auto">
<title>Two cross-sections of the wafer, one above the other. Before the step photoresist covers the right-hand part of the drawing and the left-hand active area lies in a window. After it arrows come straight down into the window, and a hatched band just under the surface of the left-hand active silicon marks the implanted dopant; the silicon under the resist is untouched.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step photoresist covers the right-hand part of the drawing and the left-hand active area lies in a window. After it arrows come straight down into the window, and a hatched band just under the surface of the left-hand active silicon marks the implanted dopant; the silicon under the resist is untouched.</desc>
