<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 718" width="480" height="718" role="img" data-kind="xsection" data-theme="light">
<title>Two enlarged cross-sections of the upper films, cut off at the bottom. Before the step a purple film lies on a very thin striped film over a blanket metal stack. After it a violet resist block stands on the purple film over the right-hand part of the width, with the film bare to its left.</title>
<desc>Two enlarged cross-sections of the upper films, cut off at the bottom. Before the step a purple film lies on a very thin striped film over a blanket metal stack. After it a violet resist block stands on the purple film over the right-hand part of the width, with the film bare to its left.</desc>
