<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 575" width="480" height="575" role="img" data-kind="xsection" data-theme="dark">
<title>Two enlarged cross-sections of the left-hand end of the slice, one above the other: an active area under a thick oxide, and the edge of the oxide-filled trench on the right. Before the step the active area is bare. After it steeply slanted arrows come down on it, and a doped layer lies in the silicon under the whole active area.</title>
<desc>Two enlarged cross-sections of the left-hand end of the slice, one above the other: an active area under a thick oxide, and the edge of the oxide-filled trench on the right. Before the step the active area is bare. After it steeply slanted arrows come down on it, and a doped layer lies in the silicon under the whole active area.</desc>
