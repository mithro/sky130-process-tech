<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 539" width="480" height="539" role="img" data-kind="xsection" data-theme="auto">
<title>Two cross-sections of the wafer, one above the other. Before the step resist covers the left-hand active area, the oxide-filled trench and the wide capped stack on it, and doped layers lie in the silicon of the right-hand active area beside its narrow gate. After it the resist is gone and the rest of the drawing is unchanged.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step resist covers the left-hand active area, the oxide-filled trench and the wide capped stack on it, and doped layers lie in the silicon of the right-hand active area beside its narrow gate. After it the resist is gone and the rest of the drawing is unchanged.</desc>
