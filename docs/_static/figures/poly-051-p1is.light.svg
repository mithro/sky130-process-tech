<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 522" width="480" height="522" role="img" data-kind="xsection" data-theme="light">
<title>Two cross-sections of the wafer, one above the other. Before the step a single block of resist sits on a continuous film over the middle of the oxide-filled trench. After it the resist is gone and the film is bare across the whole slice.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step a single block of resist sits on a continuous film over the middle of the oxide-filled trench. After it the resist is gone and the film is bare across the whole slice.</desc>
