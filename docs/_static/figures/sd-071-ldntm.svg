<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 569" width="480" height="569" role="img" data-kind="xsection" data-theme="auto">
<title>Two cross-sections of the wafer, one above the other. Before the step two capped stacks stand on the wafer, a wide one on the oxide-filled trench and a narrow one on the right-hand active area, with doped layers in the silicon of both active areas. After it one flat-topped block of resist covers the whole slice.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step two capped stacks stand on the wafer, a wide one on the oxide-filled trench and a narrow one on the right-hand active area, with doped layers in the silicon of both active areas. After it one flat-topped block of resist covers the whole slice.</desc>
