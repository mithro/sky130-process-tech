<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 589" width="480" height="589" role="img" data-kind="xsection" data-theme="light">
<title>Two cross-sections of the wafer, one above the other. Before the step two resist lines stand on three stacked films that cover the whole slice. After it the three films remain only under those lines, as a narrow gate stack on the thin oxide of the left-hand active area and a wider resistor stack on the oxide-filled trench; the resist is gone and the thin oxide is bare elsewhere.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step two resist lines stand on three stacked films that cover the whole slice. After it the three films remain only under those lines, as a narrow gate stack on the thin oxide of the left-hand active area and a wider resistor stack on the oxide-filled trench; the resist is gone and the thin oxide is bare elsewhere.</desc>
