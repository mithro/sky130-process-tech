<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 635" width="480" height="635" role="img" data-kind="xsection" data-theme="auto">
<title>Two enlarged cross-sections of a shallow hole with vertical walls going down through a flat pale oxide to a purple plate, which lies on a very thin striped film over a metal line. Before the step the hole is open. After it a thin purple film of even thickness covers the whole top: the oxide surface, the walls of the hole and its floor, leaving an opening in the middle.</title>
<desc>Two enlarged cross-sections of a shallow hole with vertical walls going down through a flat pale oxide to a purple plate, which lies on a very thin striped film over a metal line. Before the step the hole is open. After it a thin purple film of even thickness covers the whole top: the oxide surface, the walls of the hole and its floor, leaving an opening in the middle.</desc>
