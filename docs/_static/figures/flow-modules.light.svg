<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 784" width="480" height="784" role="img" data-kind="flowmap" data-theme="light">
<title>A vertical strip divided into the thirteen process modules in proportion to their number of steps, bracketed into front end (88 steps), middle of line (18) and back end (65). Each segment fans out to a row giving the module&#x27;s name, its step range and its masks.</title>
<desc>A vertical strip divided into the thirteen process modules in proportion to their number of steps, bracketed into front end (88 steps), middle of line (18) and back end (65). Each segment fans out to a row giving the module&#x27;s name, its step range and its masks.</desc>
<style>
:root{--bg:#ffffff;--ink:#1b1f24;--ink-muted:#545d68;--rule:#c4cad1;--halo:#ffffff;--accent:#0a58b0;--inferred:#9a5b00;--m-si-sub:#c6cbd1;--m-well-n:#a3cdf5;--m-well-p:#f7b3cd;--m-well-dn:#7fb0e0;--m-sd-n:#2f7fd1;--m-sd-p:#c43d83;--m-oxide-thermal:#e3b92e;--m-oxide-dep:#f7e9a8;--m-psg:#efe0b4;--m-nitride:#74c7a5;--m-ono:#2d3e6e;--m-poly:#d9662b;--m-resist:#b49ce0;--m-silicide:#1f6f6c;--m-barrier:#3d2f5b;--m-tungsten:#5b6673;--m-aluminium:#b3c0cc;--m-mim-diel:#c69a55;--m-polyimide:#dcb98f;--ph-feol:#9cc4ea;--pht-feol:#e7f1fa;--ph-mol:#f0c060;--pht-mol:#fbf1dc;--ph-beol:#86cdb4;--pht-beol:#e4f4ee;}
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, 'Liberation Sans', 'DejaVu Sans', sans-serif;fill:var(--ink)}
.t-panel-title{font-size:14px;font-weight:700}
.t-label-title{font-size:14px;font-weight:600}
.t-label-note{font-size:13px;font-weight:400}
.t-mono{font-size:12.5px;font-weight:400}
.t-mono{font-family:'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace}
.muted{fill:var(--ink-muted)}.tag{fill:var(--inferred);font-style:italic}.acc{fill:var(--accent)}
.ground{fill:var(--bg)}.mat{stroke:var(--ink);stroke-width:1.0;stroke-linejoin:round}
.pat{stroke:var(--ink);stroke-width:0.7;opacity:0.38;fill:none}.patdot{fill:var(--ink);opacity:0.38}
.leader{stroke:var(--ink-muted);stroke-width:0.9;fill:none}.halo{stroke:var(--halo);stroke-width:2.6;fill:none;opacity:0.85}.dot{fill:var(--ink)}
.dim{stroke:var(--ink);stroke-width:0.9;fill:none}.dimhead{fill:var(--ink)}.witness{stroke:var(--ink-muted);stroke-width:0.75;stroke-dasharray:3 2.5;fill:none}
.rule{stroke:var(--rule);stroke-width:0.75;fill:none}.hl{stroke:var(--accent);stroke-width:2.4;fill:none;stroke-linejoin:round;stroke-linecap:round}.parrow{stroke:var(--accent);stroke-width:2.0;fill:none}.pahead{fill:var(--accent)}
.ion{stroke:var(--accent);stroke-width:1.8;fill:none}.ionhead{fill:var(--accent)}
.cbox{fill:var(--bg);stroke:var(--ink);stroke-width:1.0;stroke-linejoin:round}.carrow{stroke:var(--ink-muted);stroke-width:1.6;fill:none}.cahead{fill:var(--ink-muted)}
.m-si-sub{fill:var(--m-si-sub)}.m-well-n{fill:var(--m-well-n)}.m-well-p{fill:var(--m-well-p)}.m-well-dn{fill:var(--m-well-dn)}.m-sd-n{fill:var(--m-sd-n)}.m-sd-p{fill:var(--m-sd-p)}.m-oxide-thermal{fill:var(--m-oxide-thermal)}.m-oxide-dep{fill:var(--m-oxide-dep)}.m-psg{fill:var(--m-psg)}.m-nitride{fill:var(--m-nitride)}.m-ono{fill:var(--m-ono)}.m-poly{fill:var(--m-poly)}.m-resist{fill:var(--m-resist)}.m-silicide{fill:var(--m-silicide)}.m-barrier{fill:var(--m-barrier)}.m-tungsten{fill:var(--m-tungsten)}.m-aluminium{fill:var(--m-aluminium)}.m-mim-diel{fill:var(--m-mim-diel)}.m-polyimide{fill:var(--m-polyimide)}.ph-feol{fill:var(--ph-feol)}.pht-feol{fill:var(--pht-feol)}.ph-mol{fill:var(--ph-mol)}.pht-mol{fill:var(--pht-mol)}.ph-beol{fill:var(--ph-beol)}.pht-beol{fill:var(--pht-beol)}
</style>
<defs></defs>
<rect class="ground" x="0" y="0" width="480" height="784"/>
<text x="12.0" y="25.0" class="t-label-note muted">All 171 steps</text>
<text x="140.0" y="25.0" class="t-label-note muted">The thirteen modules</text>
<polygon class="pht-feol" points="102,35.0 130,35.0 468,35.0 468,97.0 130,97.0 102,88.4"/>
<path class="rule" d="M102 35.0L130 35.0H468"/>
<rect class="mat ph-feol" x="82" y="35.0" width="20" height="53.4"/>
<text x="464.0" y="53.2" class="t-label-note muted" text-anchor="end">001–013</text>
<text x="140.0" y="53.2" class="t-label-title">Starting material,</text>
<text x="140.0" y="70.2" class="t-label-title">isolation and deep N-well</text>
<text x="140.0" y="86.2" class="t-label-note muted">13 steps · 2 masks: <tspan class="t-mono">FOM, DNM</tspan></text>
<path class="rule" d="M102 88.4L130 97.0H468"/>
<rect class="mat ph-feol" x="82" y="88.4" width="20" height="86.3"/>
<text x="464.0" y="115.2" class="t-label-note muted" text-anchor="end">014–034</text>
<text x="140.0" y="115.2" class="t-label-title">Wells and threshold implants</text>
<text x="140.0" y="131.2" class="t-label-note muted">21 steps · 5 masks:</text>
<text x="140.0" y="147.2" class="t-label-note muted"><tspan class="t-mono">LVTNM, NWM, HVTPM, PWBM, PWDEM</tspan></text>
<polygon class="pht-feol" points="102,174.8 130,158.0 468,158.0 468,220.0 130,220.0 102,207.7"/>
<path class="rule" d="M102 174.8L130 158.0H468"/>
<rect class="mat ph-feol" x="82" y="174.8" width="20" height="32.9"/>
<text x="464.0" y="176.2" class="t-label-note muted" text-anchor="end">035–042</text>
<text x="140.0" y="176.2" class="t-label-title">SONOS tunnel window</text>
<text x="140.0" y="193.2" class="t-label-title">and ONO stack</text>
<text x="140.0" y="209.2" class="t-label-note muted">8 steps · 2 masks: <tspan class="t-mono">TUNM, ONOM</tspan></text>
<path class="rule" d="M102 207.7L130 220.0H468"/>
<rect class="mat ph-feol" x="82" y="207.7" width="20" height="20.6"/>
<text x="464.0" y="238.2" class="t-label-note muted" text-anchor="end">043–047</text>
<text x="140.0" y="238.2" class="t-label-title">Gate oxides</text>
<text x="140.0" y="254.2" class="t-label-note muted">5 steps · 1 mask: <tspan class="t-mono">LVOM</tspan></text>
<polygon class="pht-feol" points="102,228.2 130,265.0 468,265.0 468,310.0 130,310.0 102,294.0"/>
<path class="rule" d="M102 228.2L130 265.0H468"/>
<rect class="mat ph-feol" x="82" y="228.2" width="20" height="65.8"/>
<text x="464.0" y="283.2" class="t-label-note muted" text-anchor="end">048–063</text>
<text x="140.0" y="283.2" class="t-label-title">Poly gate and poly resistors</text>
<text x="140.0" y="299.2" class="t-label-note muted">16 steps · 4 masks: <tspan class="t-mono">RPM, RRPM, URPM, P1M</tspan></text>
<path class="rule" d="M102 294.0L130 310.0H468"/>
<rect class="mat ph-feol" x="82" y="294.0" width="20" height="49.3"/>
<text x="464.0" y="328.2" class="t-label-note muted" text-anchor="end">064–075</text>
<text x="140.0" y="328.2" class="t-label-title">Tips and halos</text>
<text x="140.0" y="344.2" class="t-label-note muted">12 steps · 3 masks: <tspan class="t-mono">NTM, HVNTM, LDNTM</tspan></text>
<polygon class="pht-feol" points="102,343.3 130,355.0 468,355.0 468,400.0 130,400.0 102,396.8"/>
<path class="rule" d="M102 343.3L130 355.0H468"/>
<rect class="mat ph-feol" x="82" y="343.3" width="20" height="53.4"/>
<text x="464.0" y="373.2" class="t-label-note muted" text-anchor="end">076–088</text>
<text x="140.0" y="373.2" class="t-label-title">Spacers and source/drain</text>
<text x="140.0" y="389.2" class="t-label-note muted">13 steps · 3 masks: <tspan class="t-mono">NPCM, PSDM, NSDM</tspan></text>
<path class="rule" d="M102 396.8L130 400.0H468"/>
<rect class="mat ph-mol" x="82" y="396.8" width="20" height="74.0"/>
<text x="464.0" y="418.2" class="t-label-note muted" text-anchor="end">089–106</text>
<text x="140.0" y="418.2" class="t-label-title">Pre-metal dielectric, contact</text>
<text x="140.0" y="435.2" class="t-label-title">silicide and local interconnect</text>
<text x="140.0" y="451.2" class="t-label-note muted">18 steps · 2 masks: <tspan class="t-mono">LICM1, LI1M</tspan></text>
<polygon class="pht-beol" points="102,470.8 130,462.0 468,462.0 468,507.0 130,507.0 102,516.0"/>
<path class="rule" d="M102 470.8L130 462.0H468"/>
<rect class="mat ph-beol" x="82" y="470.8" width="20" height="45.2"/>
<text x="464.0" y="480.2" class="t-label-note muted" text-anchor="end">107–117</text>
<text x="140.0" y="480.2" class="t-label-title">Metal contact and metal 1</text>
<text x="140.0" y="496.2" class="t-label-note muted">11 steps · 2 masks: <tspan class="t-mono">CTM1, MM1</tspan></text>
<path class="rule" d="M102 516.0L130 507.0H468"/>
<rect class="mat ph-beol" x="82" y="516.0" width="20" height="69.9"/>
<text x="464.0" y="525.2" class="t-label-note muted" text-anchor="end">118–134</text>
<text x="140.0" y="525.2" class="t-label-title">Via 1, metal 2 and via 2</text>
<text x="140.0" y="541.2" class="t-label-note muted">17 steps · 3 masks: <tspan class="t-mono">VIM, MM2, VIM2</tspan></text>
<polygon class="pht-beol" points="102,585.9 130,552.0 468,552.0 468,614.0 130,614.0 102,643.4"/>
<path class="rule" d="M102 585.9L130 552.0H468"/>
<rect class="mat ph-beol" x="82" y="585.9" width="20" height="57.6"/>
<text x="464.0" y="570.2" class="t-label-note muted" text-anchor="end">135–148</text>
<text x="140.0" y="570.2" class="t-label-title">First MiM capacitor,</text>
<text x="140.0" y="587.2" class="t-label-title">metal 3 and via 3</text>
<text x="140.0" y="603.2" class="t-label-note muted">14 steps · 3 masks: <tspan class="t-mono">CAPM, MM3, VIM3</tspan></text>
<path class="rule" d="M102 643.4L130 614.0H468"/>
<rect class="mat ph-beol" x="82" y="643.4" width="20" height="61.7"/>
<text x="464.0" y="632.2" class="t-label-note muted" text-anchor="end">149–163</text>
<text x="140.0" y="632.2" class="t-label-title">Metal 4, second MiM</text>
<text x="140.0" y="649.2" class="t-label-title">capacitor, via 4 and metal 5</text>
<text x="140.0" y="665.2" class="t-label-note muted">15 steps · 4 masks: <tspan class="t-mono">CAP2M, MM4, VIM4, MM5</tspan></text>
<polygon class="pht-beol" points="102,705.1 130,676.0 468,676.0 468,738.0 130,738.0 102,738.0"/>
<path class="rule" d="M102 705.1L130 676.0H468"/>
<path class="rule" d="M102 738.0L130 738.0H468"/>
<rect class="mat ph-beol" x="82" y="705.1" width="20" height="32.9"/>
<text x="464.0" y="694.2" class="t-label-note muted" text-anchor="end">164–171</text>
<text x="140.0" y="694.2" class="t-label-title">Passivation, pads,</text>
<text x="140.0" y="711.2" class="t-label-title">alloy and test</text>
<text x="140.0" y="727.2" class="t-label-note muted">8 steps · 2 masks: <tspan class="t-mono">NSM, PDM</tspan></text>
<path class="leader" d="M79 36.5H76V395.3H79"/>
<text x="12.0" y="213.9" class="t-label-title">FEOL</text>
<text x="12.0" y="228.9" class="t-label-note muted">88 steps</text>
<path class="leader" d="M79 398.3H76V469.3H79"/>
<text x="12.0" y="431.8" class="t-label-title">MOL</text>
<text x="12.0" y="446.8" class="t-label-note muted">18 steps</text>
<path class="leader" d="M79 472.3H76V736.5H79"/>
<text x="12.0" y="602.4" class="t-label-title">BEOL</text>
<text x="12.0" y="617.4" class="t-label-note muted">65 steps</text>
<text x="140.0" y="756.0" class="t-label-note muted">171 steps, 36 masks. Strip height is</text>
<text x="140.0" y="772.0" class="t-label-note muted">proportional to the number of steps.</text>
</svg>
