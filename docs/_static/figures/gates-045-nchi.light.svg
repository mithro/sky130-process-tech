<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 621" width="480" height="621" role="img" data-kind="xsection" data-theme="light">
<title>Two cross-sections of the wafer, one above the other. Before the step photoresist covers the left-hand part of the drawing and the right-hand active area, still covered by thick oxide, lies in a window. After it arrows come straight down into the window and a hatched band lies at the surface of the right-hand active silicon, under the oxide; the silicon under the resist is untouched.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step photoresist covers the left-hand part of the drawing and the right-hand active area, still covered by thick oxide, lies in a window. After it arrows come straight down into the window and a hatched band lies at the surface of the right-hand active silicon, under the oxide; the silicon under the resist is untouched.</desc>
