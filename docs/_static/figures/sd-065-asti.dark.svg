<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 714" width="480" height="714" role="img" data-kind="xsection" data-theme="dark">
<title>Two enlarged cross-sections of one transistor edge, one above the other. Before the step a capped gate stands on a thin oxide over the silicon, with thin oxide on its sidewalls, and bare oxide-covered silicon beside it. After it tilted arrows come down on both sides of the gate, and a shallow doped layer lies in the silicon from the left edge of the view up to the gate edge on the left, and in the narrow strip right of the gate.</title>
<desc>Two enlarged cross-sections of one transistor edge, one above the other. Before the step a capped gate stands on a thin oxide over the silicon, with thin oxide on its sidewalls, and bare oxide-covered silicon beside it. After it tilted arrows come down on both sides of the gate, and a shallow doped layer lies in the silicon from the left edge of the view up to the gate edge on the left, and in the narrow strip right of the gate.</desc>
<style>
