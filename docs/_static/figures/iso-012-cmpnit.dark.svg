<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 604" width="480" height="604" role="img" data-kind="xsection" data-theme="dark">
<title>Two cross-sections of the wafer, one above the other. Before the polish a thick fill oxide buries the lined trench and the nitride-covered active areas. After the polish the oxide is left only in the trench, its top level with the nitride on the active areas, so the whole surface is flat.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the polish a thick fill oxide buries the lined trench and the nitride-covered active areas. After the polish the oxide is left only in the trench, its top level with the nitride on the active areas, so the whole surface is flat.</desc>
<style>
