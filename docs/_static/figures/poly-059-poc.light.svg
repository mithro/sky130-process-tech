<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 551" width="480" height="551" role="img" data-kind="xsection" data-theme="light">
<title>Two cross-sections of the wafer, one above the other. Before the step a hatched film lies on a continuous film across the whole slice. After it a third, thin film lies on top of the hatched one, again across the whole slice.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step a hatched film lies on a continuous film across the whole slice. After it a third, thin film lies on top of the hatched one, again across the whole slice.</desc>
