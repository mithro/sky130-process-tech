<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 741" width="480" height="741" role="img" data-kind="xsection" data-theme="auto">
<title>Two cross-sections of the wafer, one above the other. Before the step the thick implant resist still covers the right-hand part of the drawing. After it the resist is gone, the nitride and pad oxide are back in view over both active areas, the trench is open again and the buried N-type band is unchanged.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step the thick implant resist still covers the right-hand part of the drawing. After it the resist is gone, the nitride and pad oxide are back in view over both active areas, the trench is open again and the buried N-type band is unchanged.</desc>
