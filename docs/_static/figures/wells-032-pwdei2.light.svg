<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 409" width="480" height="409" role="img" data-kind="xsection" data-theme="light">
<title>One cross-section of the wafer. Thick resist covers the whole slice, over a P-well on the left and an N-well on the right; a second set of arrows comes down across the whole slice and stops on the resist. The drawing is the same as the state before the step.</title>
<desc>One cross-section of the wafer. Thick resist covers the whole slice, over a P-well on the left and an N-well on the right; a second set of arrows comes down across the whole slice and stops on the resist. The drawing is the same as the state before the step.</desc>
