<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 306" width="480" height="306" role="img" data-kind="xsection" data-theme="light">
<title>One cross-section of the wafer: pad oxide over a P-well on the left and an N-well on the right, which meet under the middle of an oxide-filled trench, with a thin implanted band at the surface of each active area. The drawing is the same as the state before the step.</title>
<desc>One cross-section of the wafer: pad oxide over a P-well on the left and an N-well on the right, which meet under the middle of an oxide-filled trench, with a thin implanted band at the surface of each active area. The drawing is the same as the state before the step.</desc>
