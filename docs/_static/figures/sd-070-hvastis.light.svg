<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 580" width="480" height="580" role="img" data-kind="xsection" data-theme="light">
<title>Two cross-sections of the wafer, one above the other. Before the step a thin resist film covers everything but the left-hand active area, where a doped layer lies in the silicon. After it the resist is gone and the rest of the drawing is unchanged.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step a thin resist film covers everything but the left-hand active area, where a doped layer lies in the silicon. After it the resist is gone and the rest of the drawing is unchanged.</desc>
