<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 562" width="480" height="562" role="img" data-kind="xsection" data-theme="auto">
<title>Two cross-sections of the wafer, one above the other. Before the step the trench floor and walls are bare silicon. After it a thin, even thermal oxide lines the floor and both walls of the trench, while the active areas, still covered by nitride, are unchanged.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step the trench floor and walls are bare silicon. After it a thin, even thermal oxide lines the floor and both walls of the trench, while the active areas, still covered by nitride, are unchanged.</desc>
<style>
