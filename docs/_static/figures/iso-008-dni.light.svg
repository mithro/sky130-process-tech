<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 729" width="480" height="729" role="img" data-kind="xsection" data-theme="light">
<title>Two cross-sections of the wafer, one above the other. Before the step the thick resist masks the right-hand part of the drawing. After it arrows come down on the open window and a buried, hatched N-type band lies well below the surface under the window only; the band steps down under the trench, because there the ions entered at the trench floor.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step the thick resist masks the right-hand part of the drawing. After it arrows come down on the open window and a buried, hatched N-type band lies well below the surface under the window only; the band steps down under the trench, because there the ions entered at the trench floor.</desc>
