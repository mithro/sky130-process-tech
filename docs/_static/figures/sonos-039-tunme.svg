<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 729" width="480" height="729" role="img" data-kind="xsection" data-theme="auto">
<title>Two cross-sections of the wafer, one above the other. Before the step photoresist and a thin anti-reflective film cover the surface except for a window over the right-hand active area, whose bottom is thin oxide over two hatched bands. After it the resist and the film are gone, the thin oxide is gone from the window so that bare silicon shows there, and the oxide remains everywhere else.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step photoresist and a thin anti-reflective film cover the surface except for a window over the right-hand active area, whose bottom is thin oxide over two hatched bands. After it the resist and the film are gone, the thin oxide is gone from the window so that bare silicon shows there, and the oxide remains everywhere else.</desc>
