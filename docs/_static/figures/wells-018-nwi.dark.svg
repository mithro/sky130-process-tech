<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 793" width="480" height="793" role="img" data-kind="xsection" data-theme="dark">
<title>Two cross-sections of the wafer, one above the other. Before the step thick resist covers the left-hand part of the drawing and the right-hand part lies in an open window. After it arrows come down on the window, and under the window an N-type region reaches from the silicon surface to a flat bottom far below the trench floor, under the right-hand active area and the right half of the trench alike; the silicon under the resist is untouched.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step thick resist covers the left-hand part of the drawing and the right-hand part lies in an open window. After it arrows come down on the window, and under the window an N-type region reaches from the silicon surface to a flat bottom far below the trench floor, under the right-hand active area and the right half of the trench alike; the silicon under the resist is untouched.</desc>
