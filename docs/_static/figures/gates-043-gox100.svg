<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 463" width="480" height="463" role="img" data-kind="xsection" data-theme="auto">
<title>Two cross-sections of the wafer, one above the other, each showing two active areas of P-type silicon either side of an oxide-filled trench that stands proud of them. Before the step the silicon of both active areas is bare. After it a thick oxide film covers both active areas, and the filled trench is unchanged.</title>
<desc>Two cross-sections of the wafer, one above the other, each showing two active areas of P-type silicon either side of an oxide-filled trench that stands proud of them. Before the step the silicon of both active areas is bare. After it a thick oxide film covers both active areas, and the filled trench is unchanged.</desc>
