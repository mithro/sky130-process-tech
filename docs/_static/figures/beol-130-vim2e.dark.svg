<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 793" width="480" height="793" role="img" data-kind="xsection" data-theme="dark">
<title>Two enlarged cross-sections of the top of a metal line, a silver film under a thin purple one, buried in a flat pale oxide. Before the step a violet resist with a window lies on the oxide above the line. After it the resist is gone and under the window a hole with vertical walls goes down through the oxide to the thin purple film on top of the line.</title>
<desc>Two enlarged cross-sections of the top of a metal line, a silver film under a thin purple one, buried in a flat pale oxide. Before the step a violet resist with a window lies on the oxide above the line. After it the resist is gone and under the window a hole with vertical walls goes down through the oxide to the thin purple film on top of the line.</desc>
