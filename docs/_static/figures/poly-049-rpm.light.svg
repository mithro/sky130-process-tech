<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 532" width="480" height="532" role="img" data-kind="xsection" data-theme="light">
<title>Two cross-sections of the wafer, one above the other. Before the step a continuous film covers the whole slice. After it a single block of resist sits on that film over the middle of the oxide-filled trench, wider than the part of the film that will later become a resistor; the film over both active areas is bare.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step a continuous film covers the whole slice. After it a single block of resist sits on that film over the middle of the oxide-filled trench, wider than the part of the film that will later become a resistor; the film over both active areas is bare.</desc>
