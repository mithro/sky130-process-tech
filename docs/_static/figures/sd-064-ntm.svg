<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 611" width="480" height="611" role="img" data-kind="xsection" data-theme="auto">
<title>Two cross-sections of the wafer, one above the other. Before the step a narrow capped gate stands on the right-hand active area and a wider capped stack on the oxide-filled trench, with a thin oxide over the active areas and the gate sidewalls. After it resist covers the left-hand active area, the trench and the wide stack, and leaves the right-hand active area and its gate bare.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step a narrow capped gate stands on the right-hand active area and a wider capped stack on the oxide-filled trench, with a thin oxide over the active areas and the gate sidewalls. After it resist covers the left-hand active area, the trench and the wide stack, and leaves the right-hand active area and its gate bare.</desc>
