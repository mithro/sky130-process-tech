<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 873" width="480" height="873" role="img" data-kind="stack" data-theme="auto">
<title>A single column of layers drawn to scale beside a vertical axis in micrometres, from the top of the field oxide up to the top of the passivation nitride: a thick pre-metal dielectric, the thin local interconnect and its cap, then five aluminium levels of increasing thickness separated by oxide, and finally a thin oxide under a thicker nitride.</title>
<desc>A single column of layers drawn to scale beside a vertical axis in micrometres, from the top of the field oxide up to the top of the passivation nitride: a thick pre-metal dielectric, the thin local interconnect and its cap, then five aluminium levels of increasing thickness separated by oxide, and finally a thin oxide under a thicker nitride.</desc>
