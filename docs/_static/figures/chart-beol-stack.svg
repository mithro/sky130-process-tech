<text x="12.0" y="781.0" class="t-label-note muted">To scale, with the axis in 1 µm steps from the field-oxide</text>
<text x="12.0" y="797.0" class="t-label-note muted">top. Every thickness is a level or an interval labelled on the</text>
<text x="12.0" y="813.0" class="t-label-note muted">PDK&#x27;s process stack diagram, as the table below lists them.</text>
<text x="12.0" y="829.0" class="t-label-note muted">The via intervals include the thin &quot;NILD3_C&quot; and &quot;NILD4_C&quot;</text>
<text x="12.0" y="845.0" class="t-label-note muted">films the table lists separately, and the two MiM capacitor</text>
<text x="12.0" y="861.0" class="t-label-note muted">plates carry no labelled thickness and are not drawn.</text>
