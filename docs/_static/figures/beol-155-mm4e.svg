<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 742" width="480" height="742" role="img" data-kind="xsection" data-theme="auto">
<title>Two enlarged cross-sections of the upper films, cut off at the bottom. Before the step violet resist covers a raised purple plate and a narrow block at the left edge of a blanket metal stack. After it the resist is gone and the metal stack remains only under where it was: the right-hand edge of a line at the left and a wide bottom plate at the right, carrying the plate on the thin striped film, with bare pale oxide between them.</title>
<desc>Two enlarged cross-sections of the upper films, cut off at the bottom. Before the step violet resist covers a raised purple plate and a narrow block at the left edge of a blanket metal stack. After it the resist is gone and the metal stack remains only under where it was: the right-hand edge of a line at the left and a wide bottom plate at the right, carrying the plate on the thin striped film, with bare pale oxide between them.</desc>
