<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 706" width="480" height="706" role="img" data-kind="xsection" data-theme="auto">
<title>Two cross-sections of the wafer, one above the other. Before the step thin pad oxide covers two active areas either side of an oxide-filled trench, over a P-well that lies on a buried deep N-well. After it a thin anti-reflective film covers the whole surface and photoresist covers everything except a wide window over most of the right-hand active area, running on past the right-hand edge of the drawing, where the film lies bare.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step thin pad oxide covers two active areas either side of an oxide-filled trench, over a P-well that lies on a buried deep N-well. After it a thin anti-reflective film covers the whole surface and photoresist covers everything except a wide window over most of the right-hand active area, running on past the right-hand edge of the drawing, where the film lies bare.</desc>
