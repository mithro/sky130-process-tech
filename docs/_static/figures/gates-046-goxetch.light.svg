<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 587" width="480" height="587" role="img" data-kind="xsection" data-theme="light">
<title>Two cross-sections of the wafer, one above the other. Before the step photoresist covers the left-hand part of the drawing and a thick oxide film covers the right-hand active area in the window, over a hatched band. After it the resist is gone, the thick oxide remains on the left-hand active area, and the right-hand active silicon is bare.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step photoresist covers the left-hand part of the drawing and a thick oxide film covers the right-hand active area in the window, over a hatched band. After it the resist is gone, the thick oxide remains on the left-hand active area, and the right-hand active silicon is bare.</desc>
