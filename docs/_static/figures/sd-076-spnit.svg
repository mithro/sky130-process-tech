<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 714" width="480" height="714" role="img" data-kind="xsection" data-theme="auto">
<title>Two enlarged cross-sections of one transistor edge, one above the other. Before the step a capped gate stands on a thin oxide, with doped layers in the silicon beside it. After it a new film of even thickness covers everything: the oxide beside the gate, the gate&#x27;s sidewalls and its top.</title>
<desc>Two enlarged cross-sections of one transistor edge, one above the other. Before the step a capped gate stands on a thin oxide, with doped layers in the silicon beside it. After it a new film of even thickness covers everything: the oxide beside the gate, the gate&#x27;s sidewalls and its top.</desc>
