<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 689" width="480" height="689" role="img" data-kind="xsection" data-theme="auto">
<title>Two cross-sections of the wafer, one above the other. Before the step the thick implanted resist covers the left-hand part of the drawing. After it the resist is gone and the oxide surface is bare across the slice; the N-well and the implanted surface bands are unchanged.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step the thick implanted resist covers the left-hand part of the drawing. After it the resist is gone and the oxide surface is bare across the slice; the N-well and the implanted surface bands are unchanged.</desc>
