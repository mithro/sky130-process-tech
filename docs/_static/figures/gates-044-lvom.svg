<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 559" width="480" height="559" role="img" data-kind="xsection" data-theme="auto">
<title>Two cross-sections of the wafer, one above the other. Before the step a thick oxide film covers both active areas either side of an oxide-filled trench. After it a block of photoresist covers the left-hand active area and the left half of the trench, and the right-hand active area lies in an open window, the resist edge standing on the trench oxide.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step a thick oxide film covers both active areas either side of an oxide-filled trench. After it a block of photoresist covers the left-hand active area and the left half of the trench, and the right-hand active area lies in an open window, the resist edge standing on the trench oxide.</desc>
