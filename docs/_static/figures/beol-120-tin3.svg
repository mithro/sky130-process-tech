<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 571" width="480" height="571" role="img" data-kind="xsection" data-theme="auto">
<title>Two enlarged cross-sections of a hole with vertical walls going down through a flat pale oxide to a thin purple film on top of a metal line. Before the step the hole is open. After it a thin purple film of even thickness covers the whole top: the oxide surface, the walls of the hole and its floor, leaving a narrow opening in the middle.</title>
<desc>Two enlarged cross-sections of a hole with vertical walls going down through a flat pale oxide to a thin purple film on top of a metal line. Before the step the hole is open. After it a thin purple film of even thickness covers the whole top: the oxide surface, the walls of the hole and its floor, leaving a narrow opening in the middle.</desc>
