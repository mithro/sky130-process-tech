<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 337" width="480" height="337" role="img" data-kind="xsection" data-theme="light">
<title>One enlarged cross-section of one transistor edge. A capped gate stands on a thin oxide over the silicon; beside it a shallow doped layer lies in the silicon, and a hatched region lies under that layer and reaches a short way under the gate edge. The drawing is the same as the state before the step.</title>
<desc>One enlarged cross-section of one transistor edge. A capped gate stands on a thin oxide over the silicon; beside it a shallow doped layer lies in the silicon, and a hatched region lies under that layer and reaches a short way under the gate edge. The drawing is the same as the state before the step.</desc>
