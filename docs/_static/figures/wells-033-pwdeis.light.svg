<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 675" width="480" height="675" role="img" data-kind="xsection" data-theme="light">
<title>Two cross-sections of the wafer, one above the other. Before the step thick resist covers the whole slice. After it the resist is gone and the oxide surface is bare over a P-well on the left and an N-well on the right.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step thick resist covers the whole slice. After it the resist is gone and the oxide surface is bare over a P-well on the left and an N-well on the right.</desc>
