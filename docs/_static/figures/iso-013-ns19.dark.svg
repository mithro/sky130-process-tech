<text x="50.0" y="422.0" class="t-label-title acc">NS19, step 013</text>
<text x="50.0" y="437.0" class="t-label-note muted">The nitride is dissolved in hot phosphoric acid,</text>
<text x="50.0" y="452.0" class="t-label-note muted">which the pad oxide stops at the silicon surface.</text>
<text x="12.0" y="485.0" class="t-panel-title">After: nitride gone, pad oxide</text>
<text x="12.0" y="503.0" class="t-panel-title">left, field oxide standing proud</text>
