<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 315" width="480" height="315" role="img" data-kind="xsection" data-theme="dark">
<title>One cross-section of the wafer. Resist covers both active areas and leaves a window over a wide stack on the oxide-filled trench; vertical arrows come down on the resist and, in the window, on the stack&#x27;s thin oxide and the field oxide beside it. The drawing is the same as the state before the step.</title>
<desc>One cross-section of the wafer. Resist covers both active areas and leaves a window over a wide stack on the oxide-filled trench; vertical arrows come down on the resist and, in the window, on the stack&#x27;s thin oxide and the field oxide beside it. The drawing is the same as the state before the step.</desc>
