<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 419" width="480" height="419" role="img" data-kind="xsection" data-theme="dark">
<title>One cross-section of the wafer. Thick resist covers the N-well on the right; the P-well lies under the open left-hand part of the drawing, and arrows come down on that opening. The drawing is the same as the state before the step.</title>
