<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 767" width="480" height="767" role="img" data-kind="xsection" data-theme="dark">
<title>Two cross-sections of the wafer, one above the other. Before the step the P-well lies under the open left-hand part of the drawing beside the thick resist over the N-well. After it a second set of arrows comes down on the same opening; the drawing of the well is unchanged.</title>
<desc>Two cross-sections of the wafer, one above the other. Before the step the P-well lies under the open left-hand part of the drawing beside the thick resist over the N-well. After it a second set of arrows comes down on the same opening; the drawing of the well is unchanged.</desc>
