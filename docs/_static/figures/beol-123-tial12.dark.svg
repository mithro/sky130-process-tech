<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 633" width="480" height="633" role="img" data-kind="xsection" data-theme="dark">
<title>Two enlarged cross-sections of a small tungsten plug set flush in a flat pale oxide over a metal line. Before the step the top is flat oxide with the plug&#x27;s top showing. After it three blanket films cover the whole top: a thin purple film, a thick silver film with diagonal lines, and another thin purple film.</title>
<desc>Two enlarged cross-sections of a small tungsten plug set flush in a flat pale oxide over a metal line. Before the step the top is flat oxide with the plug&#x27;s top showing. After it three blanket films cover the whole top: a thin purple film, a thick silver film with diagonal lines, and another thin purple film.</desc>
