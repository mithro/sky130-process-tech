- id: cyx-startribune-2019-plant-history
  source:
    publisher: Star Tribune
    title: Why computer-chip factories from the 1980s are still going strong in Bloomington
    date: 2019-06-09
    form: newspaper article
  url: https://www.startribune.com/why-computer-chip-factories-from-the-1980s-are-still-going-strong-in-bloomington/510984342
