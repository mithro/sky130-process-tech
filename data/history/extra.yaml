- id: cyx-ar-fy2008-fab2-closed
  source:
    publisher: Cypress Semiconductor Corporation
    title: 2008 Annual Report, including the Form 10-K for the fiscal year ended 2008-12-28
    date: 2009-02-26
    form: Annual Report
