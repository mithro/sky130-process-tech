  quotes:
  - text: >-
      In 1982, Control Data sold the chip business to private investors who formed VTC Inc. and
      continued chiefly to supply its former owner. As VTC, the business added the plant that is now
      SkyWater's, tucked against a state park at 2401 E. 86th St.
    location: article body, "Roots in Control Data"
  - text: >-
      Control Data bought the two factories back from VTC in the late 1980s, then sold them off again
      in the 1990s. The original plant became Polar Semiconductor, a unit of Japan's Sanken Electric,
      while the one on 86th went to Cypress.
    location: article body, "Roots in Control Data"
  - text: >-
      under Cypress, the size of the cleanroom at SkyWater's plant more than doubled.
    location: article body, "Roots in Control Data"
  claims:
