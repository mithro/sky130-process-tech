# Claims matrix for the Cypress process history (docs/history/).
# Checked by `uv run tools/check_history.py`; the rules are in that
# tool's docstring. Grades:
#   corroborated   sources from at least two different origins
#   attributed     two or more sources, all from one origin; the page
#                  names that origin in the claim's paragraph
#   single-source  one source; the paragraph says "(single source)" or
#                  the claim's `hedge` phrase
#   conflict       sources disagree; the paragraph says so (`hedge`)
# Origins: cypress (annual reports, SEC filings, qualification reports,
# notices), eetimes, edn, ew (Electronics Weekly), semidigest, connectcre,
# startribune, gale (FundingUniverse / International Directory of Company
# Histories), wikipedia, and one per other publisher.
