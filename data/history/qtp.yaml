    location: p.3, Technology/Fab Process Description
  notes: 'Earliest dated reference to L28 found anywhere in this corpus: QTP 97403, Apr 98, "New Technology
    L28/New Device CY227*", at Cypress''s own Fab 2 (Round Rock, TX) -- five years before qtp-080608''s
    TSMC-2A transfer qualification (QTP 99285, May 2003). L28 thus originated as a Cypress-fab technology
    and was later transferred to the TSMC-2A foundry, contrary to this corpus''s earlier working assumption
    (see qtp-080608''s notes, now corrected). Confirmed by qtp-098333 (same Fab2/L28 process figures,
    QTP 98333, Aug 2003, CY2287PVC). Both this Fab 2 version of L28 and the TSMC-2A version share the same
    0.65 µm design rule, but their metal compositions, passivation and gate-oxide thickness all differ
    (Fab 2: Metal1 500Å Ti/1,200Å TiW/6,000Å Al/1,200Å TiW, 3,000Å TEOS + 15,000Å Si2N4, 145 Å gate oxide;
    TSMC-2A per qtp-080608/qtp-110605: Metal1 400Å Ti/1,000Å TiN/4,700Å AlSiCu/375Å TiN, 3,000Å SiN/3,150Å
    SOG/1,200Å SiN, 125 Å gate oxide) -- the same technology name and design rule cover two measurably
    different process recipes at the two sites.'
