    decimal-dropping/adding naming inconsistency already documented for R7LD-1.8 (where the Die
    Fab Line ID instead drops to plain "R7-1.8"). Process figures: 3 metal layers, 0.15 µm design rule, 32
    Å gate oxide, Fab 4 (Bloomington, MN) -- finer than R7FT-3R (0.18 µm) and close to R7FD-3R/R7LD-1.8
    (0.15/0.16 µm) already in this corpus, consistent with R7FFT-18 being a QDR/DDR-II-generation sibling
    in the same R7 family.'
