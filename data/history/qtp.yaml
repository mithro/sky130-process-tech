    description: New Technology S4AD-5 / New Product, Programmable Clock Generator, CY2414ZC, its product
      family and bond option.
    date: Apr 01
  - number: '042806'
    description: New Product, WLAN Clock Generator, CY5048WAF, S4ADLatch Technology, Fab2
    date: Jan 05
  quotes:
  - text: S4ADLATCH Technology, Fab 2
    location: p.1, title
  - text: New Technology S4AD-5 / New Product, Programmable Clock Generator, CY2414ZC,
    location: p.2, Product Qualification History, row 010702 (the table wraps 'its product family and
      bond option.' onto the next physical line, after the interleaved QTP-number/date columns)
  - text: 'Die Fab Line ID/Wafer Process ID: Fab2, S4AD-5'
    location: p.3, Technology/Fab Process Description
  - text: Single Poly, Double Metal, 0.35 µm
    location: p.3, Technology/Fab Process Description, Generic Process Technology/Design Rule value
  notes: 'This report''s own title calls the technology "S4ADLATCH" (or "S4ADLatch"), but its qualification
    history reuses S4AD-5''s own "New Technology" row verbatim (QTP 010702, Apr 01, matching qtp-021507''s
    identical row for the same event) and its Die Fab Line ID reads plain "Fab2, S4AD-5" -- so "S4AD-Latch"
    reads as a device/option name layered on the S4AD-5 process, not a separate technology. Design rule
    here is printed as "Single Poly, Double Metal, 0.35 µm" -- the same 0.35 µm figure as qtp-151005
    (S4AD-5 at HHGrace, 2015), and in direct numeric conflict with qtp-021507 (S4AD-5, this same Fab 2,
    2003), which for the same technology and Die Fab Line ID ("Fab2, S4AD-5") instead gives "0.5 m" (0.5
    µm). This is now the *second* independent Fab 2 report to give S4AD-5 as 0.35 µm, versus the *one*
    Fab 2 report (qtp-021507) giving 0.5 µm -- weakening the possibility that the 0.35 µm figure is only
    a foundry-specific (HHGrace) shrink, and increasing the likelihood that qtp-021507''s "0.5 m" is
    itself a misprint (e.g. a dropped "3"). The Gate Oxide field here also reads "SiO2 / 7A", implausibly
    thin next to qtp-021507''s "110Å" for the same Die Fab Line ID -- most likely a truncated print of
    "110A" (dropped leading digits) rather than a real value, but printed here exactly as it appears in
    the source.'
