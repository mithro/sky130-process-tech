# ---- The Cypress-Grace deal and the SONOS licence in the press ------------
- id: grc-eepw-2006-cypress-grace
  origin: eepw
  capture: browser
  source:
    publisher: 电子产品世界 (EEPW), reproduced by fx361.com (参考网)
    title: 赛普拉斯与上海宏力达成代工协议 (Cypress and Shanghai Grace reach a foundry agreement)
    date: 2006-02
    form: magazine news item, 2006 issue 2
  url: https://m.fx361.com/news/2006/0101/29693231.html
  archive_url: null
  retrieved: 2026-09-26
  cache: web/chrome-fx361-eepw-2006-02-cypress-grace.txt
  quotes:
  - text: 赛普拉斯半导体公司（Cypress Semiconductor）和上海宏力半导体制造有限公司（Grace）宣布建立战略IC代工合作伙伴关系
    translation: Cypress Semiconductor and Shanghai Grace Semiconductor Manufacturing Co., Ltd. (Grace)
      announced a strategic IC foundry partnership
    location: news item, first sentence
  - text: Cypress公司将把自己的可编程系统级芯片（Programmable System-on-Chip，PSoC）混合信号阵列、CMOS图像传感器、WirelessUSB和PC时钟工艺技术转移给宏力公司制造，而宏力公司将优先向Cypress提供其IC代工生产能力。
    translation: Cypress will transfer its process technologies for PSoC mixed-signal arrays, CMOS image
      sensors, WirelessUSB and PC clocks to Grace for manufacture, and Grace will give Cypress priority for
      its IC foundry capacity.
    location: news item, first sentence, continued
  claims:
  - {subject: Cypress-Grace agreement, attribute: processes to transfer, value: 'PSoC, CMOS image sensor, WirelessUSB, PC clock'}
  notes: Reports the same announcement as EE Times on 2005-12-12 (cyhist-corp-pr-2005-grace-deal), probably
    from the same press release; it confirms the Chinese company name 上海宏力半导体制造有限公司. The page shows
    only the first paragraph.

