# Evidence for docs/history/grace.md: Grace Semiconductor (宏力半导体, GSMC),
# Shanghai Huahong Grace (华虹宏力, HHGrace) and Hua Hong Semiconductor
# (华虹半导体) as a place where Cypress's processes, S8 among them, were run.
#
# Same schema as corporate.yaml and extra.yaml. Every quote is verbatim in
# the file named by `cache`, relative to tmp/cyhist-cache/ in the main
# checkout (`uv run tools/check_history_quotes.py`). Chinese quotes are kept
# in the original Chinese; `translation` is this reference's English
# rendering, not the source's. Names of report preparers, reviewers and
# approvers, lot numbers and e-mail addresses are never copied.
#
# Records captured with the Chrome browser (`capture: browser`) come from
# sites that refuse scripted fetches; the capture files say so.
schema_version: 1
retrieved: 2026-09-26
records:

# ---- Cypress qualification reports naming HHGrace or GSMC for S8 ----------
- id: grc-qtp-142304
  origin: cypress
  source:
    publisher: Cypress Semiconductor Corporation
    title: 'Product Qualification Report QTP# 142304 version *A: PSoC4 Family, S8PF-10R, Fab 3 HHGrace
      (CY8C4013, CY8C4014)'
    date: 2014-07
    form: qualification report, document 001-92842 Rev. *B
  url: https://www.cypress.com/file/138901/download
  archive_url: https://web.archive.org/web/20210517161353/https://www.cypress.com/file/138901/download
  retrieved: 2026-09-26
  cache: qtp/qtp-142304.txt
  sha256: cb0e3361ac2966e829a6049ff0cc02120854bdce08ba5b337c425559fa5090ea
  quotes:
  - text: S8PF-10R, Fab 3 HHGrace
    location: p.1, cover title
  - text: CY8C20X96A) Device in Fab 5 GSMC on S8DIN-5R Process
    location: p.2, Product Qualification History, row 090706 (dated Mar 10); the row begins "Qualification
      of Capsense (CY8C20X36A, CY8C20X46A, CY8C20X66A,"
  - text: Qualification of Touch Screen PSoC Device in S8TMC-5R Process at
    location: p.2, Product Qualification History, row 100101 (dated Apr 10), continued "GSMC" on the next
      line
  - text: S8P12-10P technology at GSMC-Fab 5
    location: p.2, Product Qualification History, row 124505 (dated May 13), 5th Generation Touch Screen
      (TSG5_M)
  - text: Technology in HHGrace-Fab3
    location: p.2, Product Qualification History, row 142304 (dated June 14), CY8C4013/CY8C4014 PSoC4
  - text: 'Metal 1: 150A Ti /250A TiN / 3200Al-0.5%Cu / 90A Ti/500A TiN'
    location: p.3, Technology/Fab Process Description
  - text: 'Metal 3: 150A Ti /250A TiN 6500Al-0.5%Cu / 90A Ti/500A TiN'
    location: p.3, Technology/Fab Process Description (metal 4 is printed the same)
  - text: 'Metal 5: 190A Ti/450A TiN/10000A Al-0.5% Cu/90A Ti/200A TiN'
    location: p.3, Technology/Fab Process Description
  - text: NFUSOX / 1K oxide / 6k Nitride
    location: p.3, Passivation Type and Thickness
  - text: SiO2 / 32A/110A
    location: p.3, Gate Oxide Material/Thickness (MOS)
  - text: Fab 3 / HHGrace, Shanghai China
    location: p.3, Name/Location of Die Fab (prime) Facility
  - text: CMI Fab 4
    location: p.3, Alternative Fab Facility Site table (location "MINNESOTA, USA", QTP 132802)
  - text: 5V, Industrial Programmable System on a Chip
    location: p.3, Device Description
  - text: Updated technology from S8P12-10R to S8PF-10R in title page
    location: Document History Page, revision *A
  - text: Long Term Failure Rate was computed from QTPs 090706, 100101, 124505 & 142304 LFR Data.
    location: p.6, footnote 2 to the Reliability Failure Rate Summary
  claims:
  - {subject: S8PF-10R, attribute: qualified at, value: HHGrace Fab 3 (Shanghai), date: 2014-06}
  - {subject: S8DIN-5R, attribute: qualified at, value: Fab 5 GSMC, date: 2010-03}
  - {subject: S8TMC-5R, attribute: qualified at, value: GSMC, date: 2010-04}
  - {subject: S8P12-10P, attribute: qualified at, value: GSMC-Fab 5, date: 2013-05}
  - {subject: S8PF-10R at HHGrace Fab 3, attribute: metal layers, value: '5, Ti/TiN/AlCu/Ti/TiN'}
  - {subject: S8PF-10R at HHGrace Fab 3, attribute: gate oxides, value: 32 Å and 110 Å}
  - {subject: S8PF-10R, attribute: alternative fab, value: CMI Fab 4 (QTP 132802)}
  notes: The cover and page 2 say S8PF-10R; the revision history says the title was changed from
    S8P12-10R, and cypress.com's page for the report kept the old name ("S8P12-10R, Fab 3 HHGrace"). The
    history table dates the first S8 qualification at the Shanghai foundry to March 2010 (QTP 090706,
    CapSense, "Fab 5 GSMC"); the reports 090706, 100101 and 124505 themselves were not found in a public
    copy (Infineon now serves them only after log-in). The metal-1 recipe is the one Fab 4 moved to in
    2013 (grc-qtp-123907) and the one the HHGrace Fab 3 R95LD-3R report prints (qtp-091206).

- id: grc-qtp-152604
  origin: cypress
  source:
    publisher: Cypress Semiconductor Corporation (an Infineon Technologies company)
    title: 'Automotive Product Qualification Report QTP# 152604 version *B: Automotive Generation6
      TouchScreen (TSG6_XL) Product Family, S8SPF-10P Technology, HHGrace1 (CYAT8168X)'
    date: 2020-07
    form: qualification report, document 002-12007 Rev. *B
  url: https://www.cypress.com/file/278091/download
  archive_url: https://web.archive.org/web/20201205000354/https://www.cypress.com/file/278091/download
  retrieved: 2026-09-26
  cache: qtp/qtp-152604.txt
  sha256: d1ce899b21a318aa2b4f542ad6707dd51ac306bcc5b2bd87007451365499b4e6
  quotes:
  - text: S8SPF-10P Technology, HHGrace1
    location: p.1, cover title
  - text: HHNEC / China
    location: p.3, Name/Location of Die Fab (prime) Facility
  - text: HHGrace Fab1 / S8SPF-10P
    location: p.3, Die Fab Line ID/Wafer Process ID
  - text: Proprietary
    location: p.3, printed in place of the metal layers, metal composition, passivation, design rule and
      gate oxide
  claims:
  - {subject: S8SPF-10P, attribute: qualified at, value: HHGrace Fab 1, date: 2016-03}
  - {subject: HHGrace Fab 1, attribute: named as, value: HHNEC / China}
  notes: The qualification history dates the qualification to March 2016 ("Mar 16"). The report calls the
    fab both "HHNEC" and "HHGrace Fab1", the names before and after the 2011 merger. Unlike the 2014 HHGrace
    Fab 3 report it withholds the whole stack as "Proprietary".

