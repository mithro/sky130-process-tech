- id: teardown-siliconpr0n-cy8c4245axi
  kind: teardown
  origin: siliconpr0n
  source: >-
    Azonenberg (siliconpr0n.org / Silicon Prawn wiki), teardown page
    "azonenberg:cypress:cy8c4245axi" for the Cypress CY8C4245AXI (PSoC 4200
    series), last modified 2025-08-04.
  url: https://siliconpr0n.org/archive/doku.php?id=azonenberg:cypress:cy8c4245axi
  archive_url: http://web.archive.org/web/20251016214945/https://siliconpr0n.org/archive/doku.php?id=azonenberg:cypress:cy8c4245axi
  retrieved: '2026-09-25'
  cache: web/siliconpr0n-cy8c4245axi-wayback.html.txt
  sha256: 0a7f7042d3e0899792f3311be237a3a372c3c802db363570b229ac6a126d8ec2
  quotes:
  - text: >-
      PSoC 4200 series device originally made on Cypress's S8 SONOS process
      in the Minnesota fab (Fab 4, S8DIN-5R). GSMC in China has also
      licensed the S8 process technology; traceability markings presumably
      tell where the device came from but this isn't known yet.
    location: "page body, first paragraph after the infobox"
  - text: "Confirmed by SEM imaging to be 130nm tech, layer count not measured."
    location: "page body, second paragraph"
  - text: >-
      Ti/AlCu/TiW to Ti/TiN/AlCu/Ti/TiN for metallization in fab 4 (except
      for top layers) Metal 1: 150A Ti/250A TiN/3200A Al 0.5% Cu/90A Ti/500A
      TiN Metal 2: 150A Ti/250A TiN/3200A Al 0.5% Cu/90A Ti/500A TiN Metal
      3: 500A TiW/21,250A Al 0.5% Cu/300A TiW
    location: "'Stackup from change notice 145273' section"
  - text: "Passivation: 1000A TEOS/9000A Si3N4"
    location: "'Stackup from change notice 145273' section"
  - text: "Gate stack: SiO2 / 110A & SiO2 / 32A"
    location: "'Stackup from change notice 145273' section"
  - text: >-
      Looks like >= 4 metal layers (thick top metal, at least one
      vertical-horizontal routing pair, then M1).
    location: "page body, second paragraph"
  claims:
  - {technology: "S8 (Cypress/PSoC 4200, Fab 4)", attribute: "process node", value: "130 nm, confirmed by SEM cross-section"}
  - {technology: "S8 (Cypress/PSoC 4200, Fab 4)", attribute: "internal technology code", value: "S8DIN-5R"}
  - {technology: "S8 (Cypress/PSoC 4200, Fab 4)", attribute: "metal layer count", value: ">=4 metal layers observed; a 3-layer metallisation recipe is separately given from a change-notice stackup table, so the die may use a later/different metal stack than that specific change notice"}
  - {technology: "S8", attribute: "second-source manufacturer", value: "GSMC (China) also licensed the S8 process"}
  - {technology: "S8", attribute: "gate oxide", value: "two thicknesses recorded: SiO2/110 Å and SiO2/32 Å (dual gate oxide, consistent with a SONOS charge-trap plus low-voltage logic transistor split)"}
  notes: >-
    This is the clearest public technical source for what "S8" itself is: a
    130 nm SONOS process run at Cypress's Minnesota Fab 4 under the
    internal code S8DIN-5R, second-sourced at foundry GSMC. The "S8DIN-5R"
    code shows the same family-letter/mnemonic/suffix naming pattern the
    S4AD-5 records in data/history/qtp.yaml show for the 0.35 µm SONOS
    generation. The "confirmed 130nm" line and the ">=4 metal layers" line
    are the author's own SEM-based readings, not a formal foundry
    disclosure; the metal-composition table is sourced from a "change
    notice" the author cites but does not reproduce.

