# --- Papers (Cypress-authored technical literature) ---------------------

- id: paper-qiao-1999-sac-018um-sram
  kind: paper
  origin: cypress
  source: >-
    Jianmin Qiao et al. (Cypress Semiconductor, San Jose, California),
    "Development of self-aligned contact technology for 0.18 μm static
    random access memory devices", Journal of Vacuum Science & Technology
    B, vol. 17, issue 5, published 1999-09-01. DOI: 10.1116/1.590921.
  url: https://doi.org/10.1116/1.590921
  archive_url: null
  retrieved: '2026-09-25'
  cache: web/crossref-10_1116_1_590921.json.txt
  sha256: abe7929fe80c02a8d5ea81ae4cebffafc571d6d2fa44ba6fad1ac236f8e32f3e
  quotes:
  - text: >-
      A self-aligned contact (SAC) technology is developed for the
      application of electrical contacts between the local interconnect
      and the silicon diffusion regions for 0.18 μm static random access
      memory cells. The key components of this SAC technology include the
      deposition and gap fill of borophosphosilicate glass (BPSG) films, a
      selective oxide etch process, and metal-plug contact formation by
      Ti/TiN-liner silicidation and W filling. The BPSG film, deposited by
      plasma enhanced chemical vapor deposition, has exhibited an ability
      of filling 0.04 μm spaces with an aspect ratio (AR) of about 10:1
      after reflow at 800 °C.
    location: "abstract, via the Crossref REST API (works/10.1116/1.590921)"
  claims:
  - {technology: "Cypress 0.18 µm SRAM technology", attribute: "contact scheme", value: "self-aligned contacts (SAC) with BPSG gap fill (PECVD, reflow at 800 °C, 10:1 aspect ratio at 0.04 µm spaces), a selective oxide etch, and Ti/TiN-liner silicidation with W plug"}
  - {technology: "Cypress 0.18 µm SRAM technology", attribute: "local interconnect", value: "local interconnect contacted to diffusion via the same SAC scheme"}
  notes: >-
    Confirms a distinct 0.18 µm SRAM generation at Cypress (San Jose) in
    1999, between the 0.25 µm generation
    (data/history/extra.yaml's cyx-jin-1999-locos) and the eventual 0.13 µm
    generation. No technology-code letter for this 0.18 µm generation was
    found.

