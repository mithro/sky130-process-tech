    location: "abstract, reconstructed from OpenAlex's word-position index for this DOI"
  claims:
  - {technology: "Cypress/Altera joint CMOS EPROM technology", attribute: "node and isolation", value: "0.65 µm double-poly, double-metal UV EPROM CMOS with poly-buffer LOCOS (PBL) isolation, six transistor types, compared against a prior 0.8 µm technology; applied to Altera MAX PLD products"}
  notes: >-
