# Technical public-record evidence for Cypress Semiconductor process
# technologies from before S8 (roughly 1983-2009): papers, patents, a
# teardown report, an app note and web pages that describe device
# structure, stackup, gate oxides, SONOS/ONO stacks, isolation schemes
# and lineage.
#
# Schema: see docs/plans/cypress-history-plan.md. Fields: id, kind
# (paper/patent/app-note/teardown/datasheet/web), origin (a short
# publisher/author key: "patent-record" for patents, "cypress" for
# anything Cypress or Infineon wrote, otherwise the publisher), source
# (bibliographic), url, archive_url, retrieved, cache (path relative to
# tmp/cyhist-cache/), sha256 (of the original cached file), quotes
# ({text, location}), claims ({technology, attribute, value}), notes
# (what the source shows, and how it agrees or conflicts with other
# records).
#
# Cache: tmp/cyhist-cache/web/ and tmp/cyhist-cache/patents/ in the main
# checkout hold every fetched document and its extracted text
# (<name>.txt). Quotes are checked verbatim against the cached text by
# tools/check_history_quotes.py (uv run tools/check_history_quotes.py).
#
# Patents already indexed in data/patents.yaml are cross-referenced here
# by family id; each record repeats that file's family id,
# representative number, priority date and expiry/status, and adds its
# own quote from a fresh fetch of the Google Patents page (abstract).
# Where that fresh fetch's own legal-status field disagrees with the
# status data/patents.yaml records, the disagreement is noted rather
# than resolved here. Patents whose expired is not true are RESTRICTED
# under tools/check_inforce.py and must stay inside a collapsed block
# wherever any page quotes their content, title or number outside
# docs/references/patents/.
schema_version: 1
retrieved: '2026-09-25'
records:

