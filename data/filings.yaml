    summary: >-
      Cypress's 1999 annual report. Its body pages are set in a font whose
      glyphs pypdf cannot map to Unicode, so ordinary extraction returns
      literal glyph-id names or garbled text; the font's glyph table turns
      out to be a constant offset from the character's WinAnsi code, which
      tools/check_filings.py now decodes for this one document (independent
      review finding V-11). Decoded, the report recaps the 1998 shutdown of
      the original, 6-inch Minnesota Fab 3, and records a 1999-2000
      capital-equipment plan to expand the Minnesota site with two further
      fabs, "Fab 4b" and "Fab 4c", alongside the existing 8-inch "Fab 4a" --
      fab designations that appear nowhere else in this index.
    quotes:
    - text: >-
        A majority of the equipment purchased was for Fab 4a located in
        Minnesota to increase its capacity and capability.
      location: Annual report, Management's Discussion and Analysis, Liquidity and Capital Resources
    - text: >-
        Capital expenditures in 2000 are expected to be significantly higher
        compared to 1999 as Cypress continues its efforts to increase its
        wafer manufacturing capabilities and capacity by purchasing more
        equipment for Fab 4a and by constructing Fab 4b and Fab 4c, located
        on the same site as Fab 4a in Minnesota.
      location: Annual report, Management's Discussion and Analysis, Liquidity and Capital Resources
  auditor_report:
    firm: PricewaterhouseCoopers LLP
    subject: consolidated financial statements of Cypress Semiconductor Corporation, fiscal year 1999
