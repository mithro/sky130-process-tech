- id: cypress-annual-report-fy1993
  company: Cypress Semiconductor Corporation
  company_key: cypress
  form: 10-K
  document_type: annual-report
  parent: null
  title: Cypress Semiconductor Form 10-K for the fiscal year ended 1994-01-03 (fiscal year 1993)
  period:
    label: fiscal year 1993
    start: null
    end: 1994-01-03
  filed: 1994-03-16
  jurisdiction: US
  regulator: SEC
  identifier:
    scheme: company-document
    value: NASDAQ_CY_1994
  urls:
    original: https://www.annualreports.com/HostedData/AnnualReportArchive/c/NASDAQ_CY_1994.pdf
    wayback: null
    ir: https://www.annualreports.com/HostedData/AnnualReportArchive/c/NASDAQ_CY_1994.pdf
  about:
    summary: >-
      The earliest Cypress filing in this index. This bare Form 10-K for
      fiscal year 1993 names the Minnesota plant "Fab 3", says it commenced
      operations in 1991 (the year SkyWater's later 10-Ks use for a 26-year
      captive period, at odds with the 20-year figure in SkyWater's IPO
      filings), and gives its size as 170,000 square feet on 17 acres in
      Bloomington. The Company's three fabs then ran 0.65-1.2 µm CMOS,
      0.5-0.8 µm BiCMOS and 0.65 µm Flash processes. This 1991-start "Fab
      3" is the original, 6-inch plant, shut down in 1998
      (cypress-annual-report-fy1998); the 8-inch fab SkyWater actually
      bought in 2017 -- called "Fab 4", then "Fab 4a" -- broke ground in
      August 1994 and began production in 1995
      (cypress-annual-report-fy1995), so the 26-year figure (1991-2017)
      counts continuous Cypress operation of the Bloomington site, not the
      age of the building SkyWater received.
    quotes:
    - text: >-
        Cypress Minnesota (Fab 3), which commenced operations in 1991, is the
        Company's newest wafer fabrication facility.
      location: Form 10-K, Item 1, Business, Manufacturing
    - text: >-
        an approximately 170,000 square foot wafer fabrication facility (Fab
        3) on 17 acres of land in Bloomington, Minnesota
      location: Form 10-K, Item 2, Properties
  auditor_report:
    firm: Price Waterhouse
    subject: consolidated financial statements of Cypress Semiconductor Corporation, fiscal year 1993
    date: 1994-01-25
    quote: PRICE WATERHOUSE San Jose, California January 25, 1994
  relationships:
  - cypress-fab-operations
  - minnesota-fab-investment
  related_docs:
  - label: overview-index
    relation: context
    reason: The 10-K is the earliest filing in this index to date the Minnesota fab's 1991 start, the year later cited for a 26-year captive period.
  inventory_key: null
  discovery:
  - annualreports-com
  discovery_note: >-
    annualreports.com archive of Cypress annual reports (NASDAQ_CY_1994, a
    bare EDGAR-Online reproduction of the Form 10-K rather than a glossy
    annual report); added to close the FY1991-2002 coverage gap identified
    in independent review finding FIL-R1-01. annualreports.com does not
    answer for NASDAQ_CY_1991, 1992 or 1993 (HTTP 404).
  verified: 2026-09-18 annualreports.com PDF fetched; quotes checked
  notes: >-
    The EDGAR filing date and accession number were not retrieved; the cover
    page of this copy prints "Filed 03/16/94 for the Period Ending 01/03/94",
    which is used as filed.

