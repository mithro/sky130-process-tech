    summary: >-
      SkyWater's IPO registration statement. It says the Bloomington fab was
      a Cypress captive fab for 20 years, that Oxbow Industries acquired the
      business from Cypress in March 2017, that a foundry services agreement
      with Cypress ran to June 2020, that Cypress (acquired by Infineon in
      April 2020) was 29 % of 2020 revenue, and that S130 base design IP from
      Cypress was licensed in 2017; the exhibit index lists the Process
      Technology License Agreement with Cypress (exhibit 10.6).
    quotes:
    - text: >-
        Before we began independent operations, our fab was owned and operated
        by Cypress Semiconductor Corporation, or Cypress, as a captive
        manufacturing facility for 20 years.
      location: Prospectus Summary
    - text: >-
        the base design IP portfolio for S130 technologies originating from
        Cypress (now Infineon) was licensed via a technology license agreement
        in 2017
      location: Business
