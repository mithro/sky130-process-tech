alt: >-
  One cross-section of the wafer. Resist covers both active areas and leaves a window over a
  wide stack on the oxide-filled trench; vertical arrows come down on the resist and in the
  window. The drawing is the same as the state before the step.
caption: >-
  At 2PSDI a second p-type implant goes through the same PSDM resist, on this reference's
  reading of the PDK's single "P+ Implant, PSDM" mask,[^pdk-05] so here it reaches only the
  window over the resistor's contact head, and nothing the drawing shows changes. What the
  implant is, a second energy or species for the deep P⁺ junction, a tilted PMOS extension or a
  device-specific implant, is not public; so are its species, energy, dose, tilt and twist. The
  arrows are drawn vertical, as on the first of those readings, which has it at the PDK's 0°
  "High current" angle;[^pdk-03] a tilted reading would lean them. The spacers, the caps, the gate
  films, the gate oxides, the re-oxidation oxide, the tips and the halo, and the field oxide (the
  oxide-filled trench in the middle) are drawn but not labelled, and the liner oxide is drawn
  faded; the P-well and the NCHI channel implant made earlier are not drawn. The p-type resistor body is not labelled, because its leader would
  have to cross the beam. The slice has no PMOS; the P⁺ source/drain this implant makes beside the
  spacers of every PMOS transistor is not shown. Not to scale.
