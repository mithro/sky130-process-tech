id: sonos-035-tunm
kind: xsection
page: docs/steps/035-tunm.md
series: series-sonos.yaml
crop_depth: 90
alt: >-
  Two cross-sections of the wafer, one above the other. Before the step thin pad oxide covers two
  active areas either side of an oxide-filled trench, over a P-well that lies on a buried deep
  N-well. After it a thin anti-reflective film covers the whole surface and photoresist covers
  everything except a wide window over most of the right-hand active area, running on past the
  right-hand edge of the drawing, where the film lies bare.
caption: >-
  Before, the wafer as the wells module leaves it, on a slice through a SONOS memory transistor
  (right) and an active area that stands for any other transistor (left); after, the tunnel-mask
  resist with one window over the memory transistor's channel, and the anti-reflective coating
  still covering the bottom of that window. This slice is not the one the wells figures show: a
  tunnel window may only lie inside a deep N-well ("Tunm outside deep n-well is not allowed",
  tunm.6a),[^pdk-periph] so the slice is drawn inside one deep-N-well tub, and the channel
  implants of the wells module are not drawn. The window's width and place are illustrative; no
  layout is being shown. That the layer carries an anti-reflective coating is inferred from the
  ARC etch that follows. The pad oxide is drawn as still in place, which the page infers, and the
  liner oxide in the trench is drawn faded. Not to scale.
arrow:
  title: "TUNM, step 035"
  note: "An anti-reflective coating and resist are coated, exposed through the tunnel mask and developed, opening a window over the cell."
panels:
  - state_after: "034"
    title: "Before: the wafer left by the wells module; memory transistor right, another left"
    dim_layers: [liner]
    hide_labels: [sub]
  - state_after: "035"
    title: "After: resist over everything but the tunnel window over the memory channel"
    dim_layers: [liner]
