id: gates-047-lvgox
kind: xsection
page: docs/steps/047-lvgox.md
series: series-gates.yaml
crop_depth: 72
alt: >-
  Two cross-sections of the wafer, one above the other. Before the step a thick oxide film covers
  the left-hand active area and the right-hand active silicon is bare. After it a thin oxide film
  covers the right-hand active area, drawn thinner than the film on the left, which is drawn
  unchanged.
caption: >-
  Before, the thick oxide on the 5 V area and bare silicon on the 1.8 V area; after, the thin gate
  oxide on the 1.8 V area. The models carry electrical oxide thicknesses of 4.148 nm for the 1.8 V
  NMOS[^pdk-model-nfet01v8] and 11.6 nm for the 5 V device;[^pdk-model-nfet5v] the two films are
  drawn thinner and thicker, not in that ratio. The thick oxide grows a little during this step, by
  an amount that is not public, and that increment is not drawn; nor is any nitridation, which is
  inferred. The memory cells and their ONO islands are not in this slice. The P-well is labelled in the
  upper panel only, and the liner oxide is drawn faded. Not to scale.
arrow:
  title: "LVGOX, step 047"
  note: "The wafer is oxidised again, growing the thin gate oxide on the bare silicon of the low-voltage areas."
panels:
  - state_after: "046"
    title: "Before: bare silicon on the 1.8 V area after GOXETCH (step 046)"
