alt: >-
  Two enlarged cross-sections of the upper films, cut off at the bottom. Before the step a flat
  pale oxide carries a blanket of three metal films, a thick silver one between two thin purple
  ones. After it a very thin film with fine vertical stripes covers the top purple film across
  the whole width.
caption: >-
  A close-up of part of the metal-3 level, where a capacitor is built in the next steps; the
  lower part of the slice is cut off, and the drawing starts inside the oxide under metal 3.
  Before, the blanket metal-3 stack; after, the thin capacitor dielectric over all of it, the
  film that becomes the dielectric between metal 3 and the top plate. The PDK does not name the
  material, and this page describes it as a PECVD silicon oxynitride (inference). Its thickness
  is not public: the stack diagram gives none,[^pdk-04] and 18–33 nm is the page's own
  arithmetic from the PDK's 2 fF/µm²[^pdk-07] with an assumed permittivity. It is drawn much
  thicker in proportion than that, and metal 3 is not drawn to scale either. Which refractory
  film caps metal 3, TiW or TiN, is not public (the overview of the metal cap sets out the
  evidence); the figure draws every Ti, TiN and TiW film in one colour. The two oxides and the bottom film of the
  stack is drawn but not labelled. Not to scale.
arrow:
  title: "CAPILD, step 135"
  note: "A thin dielectric is deposited by PECVD over the whole blanket metal stack, before the metal is patterned."
