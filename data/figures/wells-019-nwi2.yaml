id: wells-019-nwi2
kind: xsection
page: docs/steps/019-nwi2.md
series: series-wells.yaml
crop_depth: 128
alt: >-
  Two cross-sections of the wafer, one above the other. Before the step the N-well lies under the
  open window beside the thick resist. After it a second set of arrows comes down on the same window;
  the drawing of the well is unchanged.
caption: >-
  Before, the N-well from NWI under its window; after, a second beam on the same window and the well
  drawn unchanged. That NWI2 is a second phosphorus dose at another energy is this reference's
  inference from retrograde-well practice;[^txt-01] whether it is the shallower or the deeper member
  of the pair is not public, so the drawing does not divide the well between the two implants. The
  arrows are drawn vertical because the tilt is not public. The earlier channel-implant band and the
  liner oxide are drawn faded. Not to scale.
arrow:
  title: "NWI2, step 019"
  note: "A second N-well implant goes through the same resist window, directly after NWI."
panels:
  - state_after: "018"
    title: "Before: the N-well implanted at NWI (step 018); NMOS left, PMOS right"
    dim_layers: [liner, chn]
    show_ions: false
  - state_after: "019"
    title: "After: a second dose into the same window; the drawn well is unchanged"
    dim_layers: [liner, chn]
