id: beol-126-nild4
kind: xsection
page: docs/steps/126-nild4.md
series: series-beol.yaml
crop_depth: -84
alt: >-
  Two cross-sections of the upper films, one above the other, cut off at the bottom. Before the
  step three separate metal lines, each a thick silver film between two thin purple ones, stand on
  a flat pale oxide. After it a thick pale oxide fills the gaps between the lines and buries them;
  its top is higher over the lines than over the gaps, with sloping sides.
caption: >-
  Before, the etched metal-2 lines; after, the inter-metal oxide the PDK's stack diagram labels
  "NILD4" (permittivity 4.2),[^pdk-04] filling the gaps between the lines and burying them. The
  page names HDP-CVD and PECVD TEOS as the two routes for such a gap, as at NILD3, and does not
  choose; the drawn profile, filled from the bottom and softened over the lines, only illustrates
  a gap-filling deposit. The deposited thickness and any liner under it are not public, and
  nothing is drawn to scale. The thin "NILD4_C" film the diagram draws beside it (0.030 µm;[^pdk-04]
  whether a liner or the cap to come is not public) is not drawn. The lower part of the slice is
  cut off: the drawing starts inside the inter-level oxide under metal 1. The bottom and cap
  films of the metal-2 lines, the via plugs and their liners, the oxides of the via level and
  the metal-1 lines with their contact plugs are drawn but not labelled. Not to scale.
arrow:
  title: "NILD4, step 126"
  note: "A silicon dioxide is deposited over the metal lines, filling the gaps between them."
