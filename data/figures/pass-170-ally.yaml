alt: >-
  One cross-section of the upper films, cut off at the bottom: two thick metal shapes under a
  thin pale film and a thick green film, which are cut away over the middle of the left-hand
  shape, leaving its top bare. The drawing is the same as the state before the step.
caption: >-
  The finished slice at the final anneal, the same drawing as after the pad etch: at ALLY the
  wafer is, on the page's reading, annealed at low temperature in a hydrogen-bearing ambient,
  and nothing the drawing can show changes. The ambient, temperature and time are not public;
  the page's 350–450 °C is the industry's typical range for an alloy anneal.[^txt-02] Where
  the hydrogen that reaches the gate oxides comes from, the furnace ambient through the
  openings and the passivation or the hydrogen-rich nitride itself, is not public, and nothing
  of it is drawn. The lower part of the slice is cut off: the drawing starts inside the oxide
  under metal 5. The metal-5 films, the via-4 fill, the metal-4 line, the capacitor plates and
  the oxides under the passivation oxide are drawn but not labelled. Not to scale.
