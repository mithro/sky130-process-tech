id: beol-145-vim3e
kind: xsection
page: docs/steps/145-vim3e.md
series: series-beol.yaml
crop_depth: -128
alt: >-
  Two cross-sections of the upper films, one above the other, cut off at the bottom. Before the
  step a violet resist with two windows lies on a flat pale oxide that buries a metal line and
  a wider metal shape carrying a raised thin plate. After it the resist is gone and under each
  window a hole with vertical walls goes down through the oxide: at the left to the top of the
  line, at the right, less deep, to the plate.
caption: >-
  Before, the via-3 resist; after, the holes etched through the cap oxide and the NILD5 oxide,
  0.39 µm together over metal 3 in the PDK's stack diagram,[^pdk-04] and the resist stripped,
  which the page treats as part of this step. The two holes stop on two kinds of floor: at the
  left on the cap film of a metal-3 line, and at the right on the capacitor's top plate, higher
  by the dielectric and the plate (0.1–0.2 µm on the page's reading, an inference). Which
  refractory film caps metal 3 is not public: the overview of the metal cap sets out the TiW
  and the TiN readings, and the figure does not choose. On this drawing the etch over the
  metal-3 line also clears the thin capacitor dielectric left on the line at MM3E, down to the
  cap; the page gives the floor as the cap and does not discuss that film. The PDK's via 3 is
  a 0.20 µm square (via3.1),[^pdk-periph] about 1.95 times as deep as it is wide over metal 3 on
  the page's reckoning; the left hole is drawn about 1.3 times as deep as it is wide, and the
  walls vertical. The lower part of the slice is cut off: the drawing starts inside the oxide
  under metal 2. The oxides, the aluminium and bottom film of metal 3, the thin capacitor
  dielectric, the via plugs below and their liners and the metal-2 lines are drawn but not
  labelled. Not to scale.
arrow:
  title: "VIM3E, step 145"
  note: "A fluorocarbon plasma etches the via holes through the oxide to the metal caps and the capacitor plates; the resist is stripped."
