id: iso-006-stie
kind: xsection
page: docs/steps/006-stie.md
series: series-isolation.yaml
alt: >-
  Two cross-sections of the wafer, one above the other. Before the step, photoresist, the nitride hard
  mask and the pad oxide cover two active areas and the silicon between them is bare. After the step a
  trench with slightly tapered walls and rounded bottom corners has been etched into that bare
  silicon, and the resist is gone.
caption: >-
  The wafer before and after `STIE`. The resist is drawn as left on for the trench etch and stripped
  at the end of the step, one of the two sequences described under *How it is typically performed*. No
  SkyWater document gives the SKY130 trench depth; about 0.33 µm is this page's reading of the PDK
  stack drawing, on the assumption that the drawing's zero is the trench floor.[^pdk-04] Not to scale.
arrow:
  title: "STIE, step 006"
  note: "A halogen plasma etches the open field; the resist is then stripped."
panels:
  - state_after: "005"
    crop_depth: 84
    title: "Before: the wafer as STINITE (step 005) leaves it"
    callouts:
      - x: 134
        y: "top@134"
        label:
          title: "Bare silicon"
          note: "the future field region"
          basis: public
  - state_after: "006"
    crop_depth: 84
    title: "After: trench etched, resist stripped"
    highlight: {where: [[80, 188]]}
    dims:
      - x: 120
        y0: "top@134"
        y1: 0
        witness: [[80, 188]]
        label:
          title: "Trench depth"
          note: "not public; about 0.33 µm is this page's reading"
          basis: reading
          cite: pdk-04
    callouts:
      - x: 176
        y: "top@176"
        label:
          title: "Tapered wall, rounded corners"
          note: "so that the liner oxide and the fill can follow (steps 010, 011)"
          basis: typical
