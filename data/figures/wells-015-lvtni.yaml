id: wells-015-lvtni
kind: xsection
page: docs/steps/015-lvtni.md
series: series-wells.yaml
crop_depth: 84
alt: >-
  Two cross-sections of the wafer, one above the other. Before the step photoresist covers the
  right-hand part of the drawing and the left-hand active area lies in a window. After it arrows come
  straight down into the window, and a hatched band just under the surface of the left-hand active
  silicon marks the implanted dopant; the silicon under the resist is untouched.
caption: >-
  Before, the LVTNM window; after, the implanted dose as the NMOS channel implant, a thin band in the
  active silicon under the window. The band is hatched, with no colour of its own, because its type
  is not public: the PDK describes `lvtn` as blocking a Vt-adjust implant,[^pdk-periph] and the page
  weighs a p-type implant that low-Vt channels skip, which it favours, against an n-type counter-dope
  into the low-Vt channels only. The window is on the NMOS side as drawn at LVTNM, which is
  illustrative; the slice is read as an NMOS beside a high-Vt PMOS. The band is drawn only in the
  active silicon, under the oxide the page infers to be the pad oxide, and its depth is not public;
  the arrows are drawn vertical because the tilt is not public. The liner oxide is drawn faded. Not
  to scale.
arrow:
  title: "LVTNI, step 015"
  note: "A channel-type implant is placed through the LVTNM window into the active silicon; the resist stops it elsewhere."
panels:
  - state_after: "014"
    title: "Before: the LVTNM window (step 014); NMOS left, PMOS right"
    dim_layers: [liner]
    show_ions: false
  - state_after: "015"
    title: "After: a thin implanted band in the NMOS active silicon"
    dim_layers: [liner]
