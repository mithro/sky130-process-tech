close_up_name: "the 1.8 V source/drain contact"
crop_depth: 24
alt: >-
  Two enlarged cross-sections of one contact hole beside a transistor gate, one above the other.
  Before the step a hole with sloping walls goes down through a thin flat oxide and a dotted
  glass to the doped silicon. After it a thin dark film covers the flat top, the walls and the
  bottom of the hole; it is thickest in the lower corners, where the walls close in.
caption: >-
  A close-up of the 1.8 V source/drain contact, the right-hand hole of the slice, beside the
  gate. Before, the cleaned hole; after, the liner over everything: titanium, then titanium
  nitride, drawn as one film on the field, the walls and the bottom. The thicknesses and the
  bottom coverage are not public (the page gives 10–30 nm of each on the field as
  industry-typical[^koerner-1993]); whether the titanium is ionised or collimated is not public
  either. The liner is drawn of even thickness, so it fills the narrow bottom corners of the
  hole; the real coverage of an ionised deposition is not drawn. The hole's bottom is 0.08 µm
  across in the PDK ("Standard Licon bottom CD"),[^pdk-03] not drawn to scale. The other two
  holes are lined in the same way, outside this view. The colours mark the type of the doping,
  not a depth profile. The gate, its caps and spacers, the thin oxides, the silicon and its doped regions, and the field oxide at the left edge are drawn but not labelled, and the liner oxide is drawn faded; the P-well and the NCHI channel implant made earlier are not drawn. Not
  to scale.
arrow:
  title: "TI/TIN1, step 097"
  note: "Titanium, then titanium nitride, is sputtered into the holes and over the field."
