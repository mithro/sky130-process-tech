id: wells-033-pwdeis
kind: xsection
page: docs/steps/033-pwdeis.md
series: series-wells.yaml
crop_depth: 128
alt: >-
  Two cross-sections of the wafer, one above the other. Before the step thick resist covers the whole
  slice. After it the resist is gone and the oxide surface is bare over a P-well on the left and an
  N-well on the right.
caption: >-
  Before, the PWDEM resist over the whole slice; after, the resist gone and the oxide bare over both
  wells, ready for the anneal. The page assumes that the pad oxide is kept through the anneal, so it
  is drawn in place; whether it is kept is not stated publicly. The NMOS channel implant, the PMOS
  channel implant and the liner oxide are drawn faded. Not to scale.
arrow:
  title: "PWDEIS, step 033"
  note: "The implanted resist is ashed and stripped, and the wafer is given a full clean before the anneal."
panels:
  - state_after: "032"
    title: "Before: the PWDEM resist after PWDEI2 (step 032); NMOS left, PMOS right"
    dim_layers: [liner, chn, chp]
    show_ions: false
  - state_after: "033"
    title: "After: resist removed; both wells and both channel bands in place"
    dim_layers: [liner, chn, chp]
