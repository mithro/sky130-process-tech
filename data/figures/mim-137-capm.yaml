alt: >-
  Two enlarged cross-sections of the upper films, cut off at the bottom. Before the step a
  purple film lies on a very thin striped film over a blanket metal stack. After it a violet
  resist block stands on the purple film over the right-hand part of the width, with the film
  bare to its left.
caption: >-
  A close-up of part of the metal-3 level, at the left edge of a capacitor that runs on past the
  right-hand edge of the view; the lower part of the slice is cut off, and the drawing starts
  inside the oxide under metal 3. Before, the blanket top-plate film on the dielectric;
  after, the resist of the capacitor mask left where the layout draws a top plate, with the film
  bare everywhere else. The PDK gives the capacitor mask a minimum width of 2 µm and a minimum
  space of 0.84 µm (CAPMCD, CAPMCDSP);[^pdk-03] where the plate edge falls is an illustrative
  choice, and neither the plate nor the resist is drawn to scale. The dielectric, some 20–30 nm
  on the estimate of the CAPILD page, and the plate film are drawn thicker in proportion than
  they are. The two oxides and the bottom film of the metal stack are drawn but not labelled,
  nor, in the upper panel, is the aluminium–copper. Not to scale.
