alt: >-
  Two enlarged cross-sections of a small tungsten plug set flush in a flat pale oxide over a metal
  line. Before the step the top is flat oxide with the plug's top showing. After it three blanket
  films cover the whole top: a thin purple film, a thick silver film with diagonal lines, and
  another thin purple film.
caption: >-
  A close-up of the middle via; the lower part of the slice is cut off, and the drawing starts
  inside the inter-level oxide under metal 1. Before, the flush via plug; after, the metal-2
  stack over the whole wafer: a thin bottom film, the aluminium–copper alloy and a thin cap.
  Which refractory films the bottom and the cap are is not public for SKY130. A 2013 Cypress
  report for the fab's S8TNV-5R technology gives "Metal 2: 100A Ti / 3200A Al -0.5%Cu / 300A
  TiW",[^cyp-qtp-113005] and a 2014 report gives the new metal 2 of its S8DI technology as "150A
  Ti/250A TiN/3200A Al 0.5% Cu/90A Ti/500A TiN";[^cyp-qtp-123907] the overview of the metal cap
  sets out both, and this figure does not choose: the bottom and the cap are drawn in the colour
  the figure conventions use for every Ti, TiN and TiW film, and labelled with both readings. The
  page follows the Ti/Al–Cu/TiW stack, as an inference from its 3 600 Å sum and the PDK's
  0.36 µm for metal 2;[^pdk-04] the figure, like the overview, draws neither. The stack is drawn
  as thick as the metal-1 stack under it, since the PDK gives both 0.36 µm, but nothing is drawn
  to scale. The plug's liner (drawn with one thickness, thicker on the floor of the hole, in proportion, than it is), the metal-1 line and the oxides are drawn but not labelled, nor, in
  the lower panel, is the plug. Not to scale.
arrow:
  title: "TIAL12, step 123"
  note: "A bottom film, the aluminium–copper and a cap are sputtered over the whole wafer."
