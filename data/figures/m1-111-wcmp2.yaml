alt: >-
  Two enlarged cross-sections of one small filled hole through a flat pale oxide down to a thin
  purple pad. Before the step a cross-hatched grey metal fills the hole and covers the whole top.
  After it the metal and its thin purple lining are gone from the top, which is flat oxide, and
  the metal remains only in the hole as a plug flush with the oxide.
caption: >-
  A close-up of the right-hand metal contact, over the local-contact plug beside the gate; the
  lower part of the slice is cut off. Before, the tungsten blanket; after, the polish has removed
  the tungsten and the liner from the field and landed on the inter-level oxide, leaving a
  tungsten plug flush with it. The plug is one of the page's 0.17 µm tungsten squares,[^pdk-periph]
  not drawn to scale. Whether a conventional or a high-selectivity tungsten slurry is used is not public, and
  the plug recess and oxide erosion the page describes are not drawn. The left-hand plug is
  polished in the same way, outside this view. The local interconnect, the local-contact plug
  and its liner, the glass and the cap oxide below are drawn but not labelled, as is the plug's
  liner. Not to scale.
