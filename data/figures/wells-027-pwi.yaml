id: wells-027-pwi
kind: xsection
page: docs/steps/027-pwi.md
series: series-wells.yaml
crop_depth: 128
alt: >-
  Two cross-sections of the wafer, one above the other. Before the step thick resist covers the N-well
  on the right. After it arrows come down on the open left-hand part of the drawing, and a P-type
  region reaches from the silicon surface to a flat bottom, shallower than the N-well, under the
  left-hand active area and the left half of the trench; it meets the N-well in the middle of the
  trench.
caption: >-
  Before, the block resist over the N-well; after, a beam on the open part of the slice and the P-well
  under it, drawn from the silicon surface to a flat bottom. The PDK's process assumptions give a
  P-well peak of 4 × 10¹⁷ cm⁻³ at 0.42 µm and a vertical dimension of 0.75 µm, against a baseline
  N-well vertical dimension of 1.1 µm;[^pdk-03] the P-well is drawn shallower than the N-well in that
  ratio, but not to scale against anything else (the trench is drawn deeper relative to the wells
  than it is), and no doping profile is drawn. The two wells are drawn meeting in the middle of the
  trench, where the PWBM page infers the two well edges meet. Boron is inferred; the energy, dose
  and tilt are not public, and the arrows are drawn vertical. The NMOS channel implant, the PMOS
  channel implant and the liner oxide are drawn faded. Not to scale.
arrow:
  title: "PWI, step 027"
  note: "Ions are implanted at high energy into everything the P-well block resist leaves open."
panels:
  - state_after: "026"
    title: "Before: the P-well block resist from PWBM (step 026); NMOS left, PMOS right"
    dim_layers: [liner, chn, chp]
  - state_after: "027"
    title: "After: the P-well under the opening"
    dim_layers: [liner, chn, chp]
    labels:
