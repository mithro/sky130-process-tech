id: mol-093-licm1
kind: xsection
page: docs/steps/093-licm1.md
series: series-mol.yaml
crop_depth: 60
alt: >-
  Two cross-sections of the wafer, one above the other. Before the step a thin flat oxide lies on
  a dotted glass that buries two active areas, an oxide-filled trench with a wide stack on it and
  a narrow capped gate. After it resist covers the flat surface except three openings: one over
  each active area and one over the middle of the wide stack.
caption: >-
  Before, the flat, capped glass; after, the LICM1 resist with three openings, one over each kind
  of landing surface in this slice: the 5 V source/drain on the left, the resistor head inside
  the nitride cut in the middle, and the 1.8 V source/drain beside the gate on the right. Where
  the openings fall is an illustrative choice. The PDK's openings are 0.17 µm squares at minimum
  (licon.1);[^pdk-periph] the drawn openings are wider than to scale. The resist's thickness is
  not public, and any anti-reflective coating under it is not drawn. The transistors' films (the
  spacers, the caps, the gate oxides, the gate film, the re-oxidation oxide and the spacer oxide), the tips and the halo, and the field oxide (the oxide-filled trench in the middle) are
  drawn but not labelled, and the liner oxide is drawn faded; the P-well and the NCHI channel
  implant made earlier are not drawn. In the lower panel the doped regions are not labelled
  either. Not to scale.
arrow:
  title: "LICM1, step 093"
  note: "Resist is coated, exposed through the contact reticle and developed, opening the contact holes."
