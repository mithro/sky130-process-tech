routes: {mcliner: right, mcw: right}
crop_depth: -130
alt: >-
  Two enlarged cross-sections of one small lined hole through a flat pale oxide and a thin hatched
  film down to a thin purple pad. Before the step a thin purple film lines the hole and covers
  the flat top. After it a cross-hatched grey metal fills the hole and covers the whole top in
  an even layer, with a shallow dip over the hole.
caption: >-
  A close-up of the right-hand metal contact, over the local-contact plug beside the gate; the
  lower part of the slice is cut off. Before, the lined hole; after, tungsten grown from every
  surface has closed it and covers the field. The deposited thickness is not public (the page
  gives a few hundred nanometres as the industry norm for a hole of this size[^txt-05]), and it
  is not drawn to scale. The hole, too, is drawn much shallower than it is: on the page's reading it
  is about 0.34 µm deep,[^pdk-04] about twice its width. The nucleation layer and any seam where the growth from the walls meets
  are not drawn. The left-hand hole is filled in the same way, outside this view. The local
  interconnect, the local-contact plug and its liner, the glass and the cap oxide below are
  drawn but not labelled, as is the new liner in the lower panel. Not to scale.
arrow:
  title: "WDEP2, step 110"
  note: "Tungsten is grown by CVD over the whole wafer until every lined hole is closed."
