id: beol-163-mm5e
kind: xsection
page: docs/steps/163-mm5e.md
series: series-beol.yaml
crop_depth: -180
alt: >-
  Two cross-sections of the upper films, one above the other, cut off at the bottom. Before the
  step two thick violet resist blocks stand on a very thick blanket metal stack. After it the
  resist is gone and the metal remains only under where it was: two thick metal shapes with
  vertical edges, each over a filled hole, with bare pale oxide between them.
caption: >-
  Before, the metal-5 resist; after, the chlorine etch has removed the whole metal-5 stack
  outside the resist, stopping on the cap oxide, and the resist has been stripped (the page
  treats the passivation, strip and clean as part of this step). What remains are two metal-5
  shapes, each over a via-4 hole that its metal fills on the reading of WTIAL5. Unlike at MM3E
  and MM4E, no capacitor dielectric lies on this metal. The cap is read here as TiW, because the
  2014 S8P stack change excluded "top metal layers"[^cyp-qtp-123907] (the overview of the metal
  cap sets out the evidence), and is broken through first. The edges are drawn vertical, and
  nothing is drawn to scale: the page uses the PDK's 1.26 µm for the metal[^pdk-04] and gives
  the minimum width and space as 1.600 µm (m5.1, m5.2);[^pdk-periph] a minimum space is about
  0.8:1 on the page's arithmetic, and this wider space is drawn about as deep as it is wide.
  The lower part of the slice is cut off: the drawing starts inside the oxide under metal 3.
  The underlayer of metal 5, the metal-4 line and the capacitors, the plugs and their liners
  and the oxides below the cap oxide are drawn but not labelled, nor, in the upper panel, is the
  cap oxide. Not to scale.
arrow:
  title: "MM5E, step 163"
  note: "The cap is broken through, then chlorine etches the thick metal between the resist shapes; the resist is stripped."
