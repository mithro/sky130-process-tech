alt: >-
  Two enlarged cross-sections of the upper films, cut off at the bottom. Before the step a raised
  purple plate on a very thin striped film covers the right-hand part of a blanket metal stack.
  After it violet resist covers the plate and reaches some way to its left, and a second, narrower
  resist block stands at the left edge; between the two the striped film is bare.
caption: >-
  A close-up of the left edge of a capacitor and the right-hand edge of a metal-3 wiring line; the
  lower part of the slice is cut off, and the drawing starts inside the oxide under metal 3.
  Before, the top plate on the dielectric over the still blanket metal-3 stack; after, the resist
  of the metal-3 mask over the future wiring line and over the capacitor, where it covers the
  whole plate and reaches beyond its edge, so that the plate will lie inside its metal-3 bottom
  plate, as the PDK's cross-section draws it.[^pdk-07] The PDK's metal-3 lines are at least
  0.300 µm wide and 0.300 µm apart (m3.1, m3.2); the enclosure of the plate by the metal beneath
  is a rule whose value is not published.[^pdk-periph] The layout and the resist thickness are
  illustrative, and nothing is drawn to scale: the metal is 0.845 µm on the PDK's stack
  diagram,[^pdk-04] the plate of the order of 0.1 µm and the dielectric a few tens of nanometres
  on the readings of the preceding pages. The two oxides and the bottom film of the metal stack
  are drawn but not labelled, nor, in the upper panel, is the
  aluminium–copper. Not to scale.
