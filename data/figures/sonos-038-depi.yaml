id: sonos-038-depi
kind: xsection
page: docs/steps/038-depi.md
series: series-sonos.yaml
crop_depth: 90
alt: >-
  Two cross-sections of the wafer, one above the other. Before the step photoresist covers the
  surface except for a window over the right-hand active area, and a hatched band lies a short way
  below the silicon surface in the window. After it arrows come straight down into the window and a
  second, thinner hatched band lies at the silicon surface, above the first.
caption: >-
  Before, the tunnel window with the punch-through stop of PTSI beneath it; after, a beam into the
  same window and the implanted dose drawn as a thin band at the silicon surface, above the earlier
  band. The surface band is hatched with no colour of its own: the page gives the n-type dose of a
  depletion implant, but the species (arsenic is this page's inference), the energy and the dose
  are not public, and so are its depth and profile. The arrows are drawn vertical because the tilt
  is not public (7° is only the textbook convention). The oxide the ions pass is drawn as the pad
  oxide, which the page infers. The fill oxide and the deep N-well are drawn but not labelled, and the liner oxide is drawn faded. Not to scale.
arrow:
  title: "DEPI, step 038"
  note: "A second implant through the same window dopes the surface of the memory channel, making the transistor a depletion-mode device."
panels:
  - state_after: "037"
    title: "Before: the punch-through stop from PTSI (step 037) under the window"
