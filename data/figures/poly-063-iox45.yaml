id: poly-063-iox45
kind: xsection
page: docs/steps/063-iox45.md
series: series-poly.yaml
crop_depth: 72
alt: >-
  Two cross-sections of the wafer, one above the other. Before the step a narrow capped gate
  stack stands on the thin oxide of the left-hand active area and a wider capped stack on the
  oxide-filled trench. After it a thin new oxide lines both sides of the gate stack and lies on
  top of the old thin oxide over both active areas; the tops of the stacks are unchanged.
caption: >-
  Before, the etched gate and resistor stacks; after, a thin oxide on every exposed silicon
  surface: on both sidewalls of the gate film and on the active areas, where it thickens what
  the etch left of the gate oxide. The capped top of the gate film does not oxidise, which is
  the page's reading of the nitride cap. The resistor body's sidewalls oxidise too, less than
  the gate's, but that oxide is not drawn. The oxide's thickness, ambient, temperature and tool
  are not public, and that it is thin is the page's inference; it is drawn at the minimum film
  thickness. The silicon and the field oxide are drawn but not labelled (and the gate oxide in the lower panel), and the liner oxide is
  drawn faded; the wells and channel implants made earlier are not drawn. Not to scale.
arrow:
  title: "IOX45, step 063"
  note: "A thin thermal oxidation grows oxide on the bare poly sidewalls and on the silicon beside the gate."
