# S9 — the via and metal levels: steps 118-134 (via 1, metal 2, via 2, the metal-3 stack),
# and later 141-149 and 154-163 (with the MiM capacitor steps between them).
#
# One geometry for the whole back end above metal 1; a figure is "the state after step N".
# Thicknesses are DRAWING units and are NOT to scale; the minimum drawn film is 5 u.
#
# STARTING STATE. `base: series-metal1.yaml` puts the ops of the contact and metal-1 series
# (S8, steps 002-117) first, unchanged, so the wafer at step 117 is the same drawing in both
# series: three metal-1 lines (x 22-58 over the left metal contact, 100-150 in the middle
# with no contact, 186-268 over the right contact and running on past the edge), each a
# bottom film, the aluminium-copper and a cap (94-122 u), buried in the NILD3 oxide polished
# at 132 u and the NCAPOX3 cap oxide on it (top at 140 u).
#
# THE TEMPLATES. Every via and metal level of this flow repeats the same few steps with
# different codes, heights and positions, so the steps are written once, as five templates,
# and instantiated per level below (tools/gen_figures.py expands them when the series is
# loaded; docs/plans/figure-authoring.md, "Series templates"):
#   via-hole       the via mask (resist with square windows) and the via etch, which cuts
#                  every oxide under the windows and stops on the cap of the metal line
#                  below; the resist is stripped in the etch step, as the VIME and VIM2E
#                  pages treat it
#   via-plug       the TiN liner (conformal), the tungsten (conformal, thick enough to close
#                  the lined hole) and the tungsten polish down to the cap oxide: a flush plug
#   metal-stack    the three-film metal stack: a thin bottom film, the aluminium-copper and a
#                  thin cap. Which refractory films the bottom and the cap are is UNDECIDED
#                  on the pages (the overview's "overview-metal-cap"); both are drawn in the
#                  barrier material, as at metal 1, and labelled with the readings the level's
#                  own page gives (a parameter)
#   metal-pattern  the metal mask (resist lines) and the metal etch through the whole stack,
#                  stopping on the cap oxide and the plug tops; the resist is stripped in the
#                  etch step, as the MM1E and MM2E pages treat it
#   imd            the inter-metal oxide, drawn as a gap-filling deposit (`profile: gapfill`,
#                  softened with a flow length; the NILD pages name HDP-CVD and PECVD TEOS
#                  and do not choose), its polish to a flat surface above the metal (a removal
#                  amount; not public how much) and the flat blanket cap oxide on it
# A later level (via 3, metal 4, via 4, metal 5) is one more `use:` of each, with its own
# codes and numbers; the MiM capacitor steps (135-140, 150-153) go between them as plain
# ops. Via 4 (VIM4E, step 160) has no tungsten step in the step list: its level uses
# via-hole and then metal-stack directly, without via-plug.
#
# THE LEVELS DRAWN HERE (118-134):
# * Via 1: two 16 u holes, one over the middle metal-1 line (x 117-133) and one over the
#   right-hand line away from its contact (x 236-252); positions illustrative (the pages
#   give the size, 0.150 um squares, via.1a, not where they fall). The hole is as deep as
#   the oxide over metal 1 (18 u), so it is drawn about 1.1 times as deep as it is wide,
#   against about 1.8:1 on the pages (0.27 um deep, pdk-04; 0.15 um wide): the captions say
#   so. Walls vertical (the pages give a "Via1 slope" of 0.02 and read it as a taper
#   allowance; the wall angle is not drawn). Liner 3 u (`thin_ok`: the liners are seen mainly
#   in close-ups enlarged 2.6-4.2x; at 5 u the liner was most of the plug); tungsten 10 u;
#   polished at 140 u.
# * Metal 2: 5 + 18 + 5 u (28 u, the same as metal 1: both are 0.36 um in the PDK); three
#   lines, x 14-64 (no via under it), 106-144 (over the middle via) and 226-268 (over the
#   right-hand via, running on past the edge); layout illustrative.
# * NILD4: 52 u as deposited, polished at 188 u (20 u over the metal-2 tops), cap oxide 8 u:
#   the via-2 hole is 28 u deep, about 1.5 times the via-1 depth, as 0.42 um is to 0.27 um
#   (pdk-04).
# * Via 2: one 20 u hole over the left-hand metal-2 line (x 29-49), not over a via 1
#   (placement illustrative); 28 u deep, so drawn about 1.4 times as deep as it is wide,
#   against about 2.1:1 on the pages (0.42 um deep, 0.20 um wide). Liner 3 u; tungsten 12 u;
#   polished at 196 u.
# * Metal 3 (the stack only; it is patterned at 139-140, after the MiM steps): 5 + 32 + 5 u
#   (42 u, half as thick again as metal 2; in the PDK 0.845 um against 0.36 um, which is not
#   drawn). Top at 238 u.
#
# THE MiM STEPS AND THE CONTEXT FOR THE SECOND CAPACITOR (135-153, S10):
# * First capacitor (135-138), on the blanket metal 3: dielectric 3 u (`mim-diel`,
#   `thin_ok`), plate 8 u (`barrier`), plate from x 130 on; the CAPME etch stops on the
#   dielectric (the pages' reading), so the dielectric stays on the whole metal.
# * Metal 3 patterned (139-140): a wiring line x 14-76 over the via-2 plug and the
#   capacitor's bottom plate from x 100 on; the MM3 resist covers the top plate; the etch
#   (`etch_materials`) removes the dielectric outside the resist, then the stack. Under the
#   resist the dielectric stays on the metal (the pages do not discuss it).
# * 141-149 (S9b's steps, instantiated here so that 150-153 have a state): NILD5 gap-fill,
#   polished at 256, cap to 264 (26 u over the metal-3 tops, as 0.39 um is to via 2's
#   0.42 um and 28 u; 15 u over the plate); via 3 holes of 20 u on the wiring line (x 52-72,
#   etched through the dielectric) and on the top plate (x 196-216); the metal-4 stack
#   5 + 32 + 5 u (as metal 3: the PDK gives both 0.845 um), top at 306 u. S9b may change
#   these; 150-153 draw only the window x 76-176 above 250 u, so they depend only on the
#   metal-4 heights (then move their `crop_depth`).
# * Second capacitor (150-153): the same films on the blanket metal 4, plate from x 130 on,
#   over the first plate. MM4 (154) must cover it, as MM3 covers the first.
# Series labels carry no numbers; step numbers and level codes (VIM2, NILD4) are free.
base: series-metal1.yaml
templates:
  via-hole:
    params: [mask_step, etch_step, mask_code, resist_id, resist_where]
    defaults: {resist_t: 30, etch_materials: [oxide-dep]}
    ops:
      - step: "${mask_step}"
        op: deposit
        id: "${resist_id}"
        material: resist
        t: "${resist_t}"
        where: "${resist_where}"
        label:
          title: "Photoresist"
          note: "${mask_code} mask, step ${mask_step}"
          basis: public
      # the etch cuts every oxide under the windows and stops on the metal line's cap (or on a
      # MiM top plate); `etch_materials` adds the capacitor dielectric where it lies on a line
      - step: "${etch_step}"
        op: etch
        materials: "${etch_materials}"
        where_open: "${resist_id}"
      - step: "${etch_step}"
        op: strip
        materials: [resist]
  via-plug:
    params: [liner_step, fill_step, polish_step, liner_id, fill_id, fill_t, polish_to]
    defaults: {liner_t: 3}
    ops:
      - step: "${liner_step}"
        op: deposit
        id: "${liner_id}"
        material: barrier
        t: "${liner_t}"
        thin_ok: true
        route: over
        label:
          title: "TiN liner"
          note: "deposited at step ${liner_step}"
          basis: public
      - step: "${fill_step}"
        op: deposit
        id: "${fill_id}"
        material: tungsten
        t: "${fill_t}"
        route: over
        label:
          title: "Tungsten"
          note: "deposited at step ${fill_step}"
          basis: public
      # the polish takes the tungsten and the liner off the field, down to the cap oxide
      - step: "${polish_step}"
        op: planarise
        to: "${polish_to}"
  metal-stack:
    params: [step, bot_id, al_id, cap_id, al_t, al_anchor_y, bot_note, cap_note]
    defaults: {bot_t: 5, cap_t: 5}
    ops:
      - step: "${step}"
        op: deposit
        id: "${bot_id}"
        material: barrier
        t: "${bot_t}"
        label:
          title: "Bottom film"
          note: "${bot_note}"
          basis: inferred
      - step: "${step}"
        op: deposit
        id: "${al_id}"
        material: aluminium
        t: "${al_t}"
        anchor_y: "${al_anchor_y}"
        label:
          title: "Aluminium alloy"
          note: "aluminium–copper, the conductor; step ${step}"
          basis: public
      - step: "${step}"
        op: deposit
        id: "${cap_id}"
        material: barrier
        t: "${cap_t}"
        label:
          title: "Cap film"
          note: "${cap_note}"
          basis: inferred
  metal-pattern:
    params: [mask_step, etch_step, mask_code, resist_id, resist_where]
    defaults: {resist_t: 30, etch_materials: [barrier, aluminium]}
    ops:
      - step: "${mask_step}"
        op: deposit
        id: "${resist_id}"
        material: resist
        t: "${resist_t}"
        where: "${resist_where}"
        label:
          title: "Photoresist"
          note: "${mask_code} mask, step ${mask_step}"
          basis: public
      # the etch removes the whole stack between the lines, stopping on the cap oxide and
      # the plug tops; the resist is stripped in the same step. At metals 3 and 4 the MiM
      # dielectric lies on the stack and `etch_materials` adds it (the MM3E, MM4E pages)
      - step: "${etch_step}"
        op: etch
        materials: "${etch_materials}"
        where_open: "${resist_id}"
      - step: "${etch_step}"
        op: strip
        materials: [resist]
  imd:
    params: [dep_step, polish_step, cap_step, imd_id, cap_id, imd_t, polish_to]
    defaults: {smooth: 16, cap_t: 8}
    ops:
      - step: "${dep_step}"
        op: deposit
        id: "${imd_id}"
        material: oxide-dep
        t: "${imd_t}"
        profile: gapfill
        smooth: "${smooth}"
        label:
          title: "Inter-metal oxide"
          note: "deposited at step ${dep_step}"
          basis: public
      # the polish: flat, leaving oxide over the metal tops
      - step: "${polish_step}"
        op: planarise
        to: "${polish_to}"
      - step: "${cap_step}"
        op: deposit
        id: "${cap_id}"
        material: oxide-dep
        t: "${cap_t}"
        label:
          title: "Cap oxide"
          note: "deposited at step ${cap_step}"
          basis: public
ops:
  # ================================================================ via 1 (118-122)
  - use: via-hole
    with:
      mask_step: "118"
      etch_step: "119"
      mask_code: "VIM"
      resist_id: vimres
      resist_where: [[0, 117], [133, 236], [252, 268]]
  - use: via-plug
    with:
      liner_step: "120"
      fill_step: "121"
      polish_step: "122"
      liner_id: v1liner
      fill_id: v1w
      fill_t: 10
      polish_to: 140
  # ================================================================ metal 2 (123-125)
  - use: metal-stack
    with:
      step: "123"
      bot_id: m2bot
      al_id: m2al
      cap_id: m2cap
      al_t: 18
      al_anchor_y: 154
      bot_note: "Ti or Ti/TiN — see the overview"
      cap_note: "TiW or Ti/TiN — see the overview"
  - use: metal-pattern
    with:
      mask_step: "124"
      etch_step: "125"
      mask_code: "MM2"
      resist_id: mm2res
      resist_where: [[14, 64], [106, 144], [226, 268]]
  # ================================================================ NILD4 (126-128)
  - use: imd
    with:
      dep_step: "126"
      polish_step: "127"
      cap_step: "128"
      imd_id: nild4
      cap_id: ncap4
      imd_t: 52
      polish_to: 188
  # ================================================================ via 2 (129-133)
  - use: via-hole
    with:
      mask_step: "129"
      etch_step: "130"
      mask_code: "VIM2"
      resist_id: vim2res
      resist_where: [[0, 29], [49, 268]]
  - use: via-plug
    with:
      liner_step: "131"
      fill_step: "132"
      polish_step: "133"
      liner_id: v2liner
      fill_id: v2w
      fill_t: 12
      polish_to: 196
  # ================================================================ the metal-3 stack (134)
  - use: metal-stack
    with:
      step: "134"
      bot_id: m3bot
      al_id: m3al
      cap_id: m3cap
      al_t: 32
      al_anchor_y: 217
      bot_note: "Ti or TiW — see the overview"
      cap_note: "TiW or Ti/TiN — see the overview"
  # ================================================================ the first MiM capacitor (135-138)
  # Built on the blanket metal-3 stack, before metal 3 is patterned. The dielectric is drawn
  # 3 u (`thin_ok`: it is seen only in close-ups enlarged about 2.7x) and the plate 8 u, thicker
  # than the 5 u metal cap: the pages give no thickness for either (not public); their
  # estimates are 18-33 nm for the dielectric and about 0.1 um for the plate, several times the
  # 300 A cap of the 2013 stack. The plate is `barrier` (the conventions' Ti/TiN/TiW colour).
  - step: "135"
    op: deposit
    id: capild
    material: mim-diel
    t: 3
    thin_ok: true
    label:
      title: "Capacitor dielectric"
      note: "not public; read here as a PECVD oxynitride"
      basis: inferred
  - step: "136"
    op: deposit
    id: capm
    material: barrier
    t: 8
    label:
      title: "Top-plate film"
      note: "TiW on this reference's reading"
      basis: inferred
  # the capacitor: one top plate from x 130, running on past the right edge of the slice
  - step: "137"
    op: deposit
    id: capmres
    material: resist
    t: 30
    where: [[130, 268]]
    label:
      title: "Photoresist"
      note: "CAPM mask, step 137"
      basis: public
  # the plate etch stops on the dielectric (the CAPME page's reading); the resist is stripped
  # in the same step
  - step: "138"
    op: etch
    materials: [barrier]
    where_open: capmres
  - step: "138"
    op: strip
    materials: [resist]
  # ================================================================ metal 3 patterned (139-140)
  # Two metal-3 shapes: a wiring line over the via-2 plug (x 14-76) and the capacitor's bottom
  # plate (x 100 on, past the edge), which encloses the top plate by 30 u. The MM3 resist
  # covers the plate; under it the dielectric is not etched, so it stays on both shapes; the
  # etch removes the dielectric left outside them, then the stack.
  - use: metal-pattern
    with:
      mask_step: "139"
      etch_step: "140"
      mask_code: "MM3"
      resist_id: mm3res
      resist_where: [[14, 76], [100, 268]]
      etch_materials: [mim-diel, barrier, aluminium]
  # ================================================================ NILD5 and via 3 (141-148)
  # Context for the second capacitor, instantiated here so that 150-153 have a state to draw;
  # S9b owns these levels and may change them (then rebuild 150-153). Oxide over the metal-3
  # tops 26 u with the cap (0.39 um on the PDK's stack diagram, against via 2's 0.42 um and
  # 28 u); over the plate 15 u. Via 3: two 20 u holes, one on the wiring line (etched through
  # the capacitor dielectric to the cap) and one on the top plate.
  - use: imd
    with:
      dep_step: "141"
      polish_step: "142"
      cap_step: "143"
      imd_id: nild5
      cap_id: ncap5
      imd_t: 72
      polish_to: 256
  - use: via-hole
    with:
      mask_step: "144"
      etch_step: "145"
      mask_code: "VIM3"
      resist_id: vim3res
      resist_where: [[0, 52], [72, 196], [216, 268]]
      etch_materials: [oxide-dep, mim-diel]
  - use: via-plug
    with:
      liner_step: "146"
      fill_step: "147"
      polish_step: "148"
      liner_id: v3liner
      fill_id: v3w
      fill_t: 12
      polish_to: 264
  # ================================================================ the metal-4 stack (149)
  # As thick as metal 3 (the PDK gives both 0.845 um); top at 306 u.
  - use: metal-stack
    with:
      step: "149"
      bot_id: m4bot
      al_id: m4al
      cap_id: m4cap
      al_t: 32
      al_anchor_y: 285
      bot_note: "Ti or TiW — see the overview"
      cap_note: "TiW or Ti/TiN — see the overview"
  # ================================================================ the second MiM capacitor (150-153)
  # The same construction one level up, the plate drawn over the first one's (x 130 on).
  - step: "150"
    op: deposit
    id: capild2
    material: mim-diel
    t: 3
    thin_ok: true
    label:
      title: "Capacitor dielectric"
      note: "not public; read here as a PECVD oxynitride"
      basis: inferred
  - step: "151"
    op: deposit
    id: cap2m
    material: barrier
    t: 8
    label:
      title: "Top-plate film"
      note: "TiW on this reference's reading"
      basis: inferred
  - step: "152"
    op: deposit
    id: cap2mres
    material: resist
    t: 30
    where: [[130, 268]]
    label:
      title: "Photoresist"
      note: "CAP2M mask, step 152"
      basis: public
  - step: "153"
    op: etch
    materials: [barrier]
    where_open: cap2mres
  - step: "153"
    op: strip
    materials: [resist]
  # ================================================================ metal 4 patterned (154-155)
  # Two metal-4 shapes, as at metal 3: a wiring line over the via-3 plug on the metal-3 line
  # (x 20-84) and the second capacitor's bottom plate (x 104 on, past the edge), which encloses
  # the second top plate by 26 u and carries the via-3 plug that lands on the first top plate
  # (the "M4 (plate 2)" of the PDK's stacked cross-section). The MM4 resist covers the whole
  # second plate; the etch removes the dielectric left outside the resist, then the stack.
  - use: metal-pattern
    with:
      mask_step: "154"
      etch_step: "155"
      mask_code: "MM4"
      resist_id: mm4res
      resist_where: [[20, 84], [104, 268]]
      etch_materials: [mim-diel, barrier, aluminium]
  # ================================================================ NILD6 (156-158)
  # 34 u of oxide over the metal-4 tops with the cap (the PDK's via-4 height, 0.505 um, against
  # via 3's 0.39 um and 26 u); over the second plate 23 u.
  - use: imd
    with:
      dep_step: "156"
      polish_step: "157"
      cap_step: "158"
      imd_id: nild6
      cap_id: ncap6
      imd_t: 80
      polish_to: 332
  # ================================================================ via 4 (159-160)
  # Two 44 u holes, wider than deep (0.800 um squares 0.505 um deep on the pages): one on the
  # metal-4 line (x 30-74, etched through the capacitor dielectric left on it to the cap) and
  # one on the second top plate (x 190-234). No liner, tungsten or plug polish follows.
  - use: via-hole
    with:
      mask_step: "159"
      etch_step: "160"
      mask_code: "VIM4"
      resist_id: vim4res
      resist_where: [[0, 30], [74, 190], [234, 268]]
      etch_materials: [oxide-dep, mim-diel]
  # ================================================================ metal 5 (161-163)
  # 5 + 53 + 5 u, half as thick again as metals 3 and 4 (1.26 um against 0.845 um in the PDK),
  # deposited conformally into the open via-4 holes: the stack lines their walls and floors and
  # the aluminium closes them, leaving a shallow dimple over each (the fill technique is not
  # public). Top at 403 u over the field. Two metal-5 shapes, over the two vias.
  - use: metal-stack
    with:
      step: "161"
      bot_id: m5bot
      al_id: m5al
      cap_id: m5cap
      al_t: 53
      al_anchor_y: 371
      bot_note: "Ti or TiW — see the overview"
      cap_note: "read here as TiW — see the overview"
  - use: metal-pattern
    with:
      mask_step: "162"
      etch_step: "163"
      mask_code: "MM5"
      resist_id: mm5res
      resist_where: [[10, 94], [160, 268]]
      resist_t: 40
