id: sonos-039-tunme
kind: xsection
page: docs/steps/039-tunme.md
series: series-sonos.yaml
crop_depth: 90
alt: >-
  Two cross-sections of the wafer, one above the other. Before the step photoresist and a thin
  anti-reflective film cover the surface except for a window over the right-hand active area, whose
  bottom is thin oxide over two hatched bands. After it the resist and the film are gone, the thin
  oxide is gone from the window so that bare silicon shows there, and the oxide remains everywhere
  else.
caption: >-
  Before, the tunnel-mask resist over its window; after, the oxide gone from the window down to the
  silicon, and the resist and the anti-reflective coating gone from the whole wafer. The etch is
  drawn only inside the window, as this page describes a masked etch; whether the oxide is also
  removed elsewhere after the strip is an open question. The oxide is drawn as the pad oxide, which the page
  infers. The resist is drawn stripped, with the coating under it, because this page treats the
  strip as the tail of this step; how the coating comes off is not stated. The two implanted bands of PTSI and DEPI are unchanged. The deep N-well is drawn but not labelled, and the liner oxide is drawn faded. Not to scale.
arrow:
  title: "TUNME, step 039"
  note: "The oxide in the tunnel window is etched away to the silicon; then the resist is stripped and the wafer cleaned."
