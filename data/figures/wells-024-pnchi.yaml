alt: >-
  One cross-section of the wafer. Resist covers the left-hand part of the drawing and the PMOS active
  area, with its thin hatched surface band inside the N-well, lies in a window on which arrows come
  down. The drawing is the same as the state before the step.
caption: >-
  At PNCHI a second implant goes through the same HVTPM window, directly after PCHI; the drawing is
  the state at this step, which is the same as before it. The species, BF₂, is this reference's
  inference; the energy and dose are not public, and no public source gives the depth of either
  high-Vt implant, so the drawing does not separate them. The arrows are drawn vertical because the
  tilt is not public. The fill oxide is drawn but not labelled; the NMOS channel implant and the liner oxide are drawn faded.
  Not to scale.
