id: beol-160-vim4e
kind: xsection
page: docs/steps/160-vim4e.md
series: series-beol.yaml
crop_depth: -190
alt: >-
  Two cross-sections of the upper films, one above the other, cut off at the bottom. Before the
  step a violet resist with two wide windows lies on a flat pale oxide that buries a metal line
  and a wider metal shape carrying a raised thin plate. After it the resist is gone and under
  each window a hole with vertical walls, wider than it is deep, goes down through the
  oxide: at the left to the top of the line, at the right, less deep, to the plate.
caption: >-
  Before, the via-4 resist; after, the holes etched through the cap oxide and the NILD6 oxide,
  0.505 µm together over metal 4 as the PDK's stack diagram gives it,[^pdk-04] and the resist stripped,
  which the page treats as part of this step. The two holes stop on two kinds of floor: at the
  left on the cap film of a metal-4 line, and at the right on the second capacitor's top plate,
  which stands on the capacitor dielectric, higher than the metal-4 cap. Which refractory film caps
  metal 4 is not public: the overview of the metal cap sets out the TiW and the TiN readings,
  and the figure does not choose. On this drawing the etch over the metal-4 line also clears
  the thin capacitor dielectric left on the line at MM4E, down to the cap; the page gives the
  floor as the cap and does not discuss that film. The PDK's via 4 is a 0.800 µm square
  (via4.1),[^pdk-periph] about 0.63 times as deep as it is wide on the page's arithmetic; the
  left hole is drawn about 0.8 times as deep as it is wide, and the walls vertical, although
  whether via 4 is tapered is not public. No liner, tungsten fill or plug polish follows in the
  step list: the next step sputters the metal-5 stack into the open holes. The lower part of
  the slice is cut off: the drawing starts inside the oxide under metal 3. The oxides, the
  aluminium and bottom film of metal 4, the thin capacitor dielectric, the first capacitor and
  the metal-3 line and the via plugs and their liners are drawn but not labelled. Not to scale.
