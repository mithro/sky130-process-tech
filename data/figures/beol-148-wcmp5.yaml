crop_depth: -946
alt: >-
  Two enlarged cross-sections of a filled shallow hole in a flat pale oxide over a purple plate,
  which lies on a very thin striped film over a metal line. Before the step a thick grey
  tungsten film over a thin purple liner covers the whole top and fills the hole. After it the
  top is flat oxide again, with the tungsten and its liner left only inside the hole, their tops
  level with the oxide.
caption: >-
  A close-up of the via-3 plug on the capacitor's top plate; the lower part of the slice is cut
  off, and the drawing starts inside the aluminium of the metal 3 under the capacitor. Before,
  the tungsten and its liner over the whole wafer; after, both polished off the field down to
  the cap oxide, leaving the plug: a 0.20 µm square in the PDK's rules,[^pdk-periph] drawn here
  flush with the oxide. How far the polish recesses the plug and erodes the oxide is not
  public, and neither is drawn; how much oxide remains over the plate is not public either. The
  plug on the metal-3 line, outside this view, is made in the same polish and is taller, since
  the oxide over metal 3 is 0.39 µm in the PDK's stack diagram[^pdk-04] and the plate stands
  above the metal. The plug on the plate, whose true height is not public, is drawn a little less tall than it is wide, and its liner with one
  thickness, far thicker in proportion than it is. The liner, the NILD5 oxide, the
  aluminium–copper of metal 3 and, in the lower panel, the plate, the dielectric and the metal
  cap are drawn but not labelled, nor, in the upper panel, is the cap oxide. Not to scale.
