series: series-isolation.yaml
crop_depth: 84
alt: >-
  Two cross-sections of the wafer, one above the other. Before the step the lined trench is still
  open. After it a thick blanket of deposited oxide covers everything: it fills the trench and buries
  the nitride-covered active areas under a flat top surface.
caption: >-
  Before, the lined trench still open; after, a thick blanket of deposited oxide filling it and
  burying the nitride-covered active areas. The PDK's stack drawing labels this oxide "FOX
  K=3.9".[^pdk-04] The PDK gives no fill thickness or topography; the fill is drawn with a flat top.
  This cross-section is drawn outside a deep N-well region, so the buried layer of `DNI` (step 008)
  does not appear. Not to scale.
arrow:
  title: "FILOX, step 011"
  note: "A thick blanket of silicon dioxide is deposited over the whole wafer, filling the trench."
panels:
