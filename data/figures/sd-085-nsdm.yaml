id: sd-085-nsdm
kind: xsection
page: docs/steps/085-nsdm.md
series: series-tips-sd.yaml
crop_depth: 72
alt: >-
  Two cross-sections of the wafer, one above the other. Before the step a thin oxide covers
  everything: both active areas, a narrow capped gate with nitride blocks on its sidewalls, and a
  wide stack on the oxide-filled trench. After it resist covers the trench and the wide stack and
  leaves both active areas open.
caption: >-
  Before, the wafer cleaned at PDIS; after, the NSDM resist, with windows over both NMOS areas
  and resist over the field and the resistor, which the precision-resistor rules keep clear of
  `nsdm` (rpm.6).[^pdk-periph] The two windows are, as the page says, close to the complement of
  the P⁺ window across the active area. The resist is drawn at the thickness of the other implant
  resists; the PDK's nominal photoresist thickness is 1.14 µm,[^pdk-03] and this mask's is not
  public. The colours of the gate film mark the type of its doping, not a depth profile. The
  spacers, the caps, the gate oxides, the re-oxidation oxide, the tips and the halo, and the field
  oxide (the oxide-filled trench in the middle) are drawn but not labelled, and the liner oxide is
  drawn faded; the P-well and the NCHI channel implant made earlier are not drawn. Not to scale.
arrow:
  title: "NSDM, step 085"
  note: "Resist is coated, exposed through the N+ implant reticle and developed, open over every NMOS."
