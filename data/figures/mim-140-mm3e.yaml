close_up_name: "the edge of a capacitor and a metal-3 line"
routes: {m3bot: right, m3al: right, m3cap: right, ncap4: right}
crop_depth: -461
alt: >-
  Two enlarged cross-sections of the upper films, cut off at the bottom. Before the step violet
  resist covers a raised purple plate and a narrower block at the left edge of a blanket metal
  stack. After it the resist is gone and the metal stack remains only under where it was: a
  line end at the left and a wide bottom plate at the right, carrying the plate on the thin
  striped film, with bare pale oxide between them.
caption: >-
  A close-up of the left edge of a capacitor and the right-hand end of a metal-3 wiring line; the
  lower part of the slice is cut off, and the drawing starts inside the oxide under metal 3.
  Before, the metal-3 resist over the line and over the capacitor; after, the chlorine etch has
  removed the dielectric outside the resist and then the whole metal-3 stack, stopping on the cap
  oxide, and the resist has been stripped (the page treats the passivation, strip and clean as
  part of this step). Under the resist the stack is left whole, so the capacitor now has its own
  bottom plate. Nothing is etched under the resist, so on this drawing the thin dielectric also
  stays on the metal around the top plate and on the wiring line; the page does not discuss
  that, and the PDK's schematic cross-section draws the dielectric only under the
  plate.[^pdk-07] The edges are drawn vertical, and nothing is drawn to scale: the page uses the
  PDK's 0.845 µm for the metal[^pdk-04] and gives the minimum width and space as
  0.300 µm (m3.1, m3.2).[^pdk-periph] The two oxides and the bottom film of the metal are drawn
  but not labelled, nor, in the upper panel, is the aluminium–copper. Not to scale.
