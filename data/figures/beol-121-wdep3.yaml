close_up: [59, 150]
close_up_name: "the middle via"
routes: {m1cap: right, m1al: right}
crop_depth: -265
alt: >-
  Two enlarged cross-sections of a lined hole going down through a flat pale oxide to a metal
  line. Before the step a thin purple liner covers the oxide and the walls and floor of the hole.
  After it a thick grey cross-hatched tungsten film covers the liner everywhere and fills the
  hole completely, with a dip in its top surface over the hole.
caption: >-
  A close-up of the middle via; the lower part of the slice is cut off, and the drawing starts
  inside the inter-level oxide under metal 1. Before, the lined via hole; after, the tungsten
  grown over the whole wafer, closing the hole from its walls inward and continuous above it.
  Its thickness is not public; the page gives a film of the order of 0.2–0.3 µm as the industry
  norm for a via of this size,[^txt-05] and the drawn film is not to scale, nor is the dip over
  the hole, and the liner is drawn far thicker in proportion to the hole than it is. The hole
  is drawn about 1.1 times as deep as it is wide; on the page it is
  0.15 µm wide and 0.27 µm deep,[^pdk-periph][^pdk-04] an aspect ratio under 2:1. The
  right-hand via is filled in the same way, outside this view. The cap oxide, the inter-metal
  oxide, the metal-1 line and the inter-level oxide under it are drawn but not labelled, nor, in
  the lower panel, is the liner. Not to scale.
arrow:
  title: "WDEP3, step 121"
  note: "Tungsten is deposited by CVD over the whole wafer, filling the lined via holes."
