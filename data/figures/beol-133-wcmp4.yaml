alt: >-
  Two enlarged cross-sections of a filled hole in a flat pale oxide over a metal line. Before
  the step a thick grey tungsten film over a thin purple liner covers the whole top and fills the
  hole. After it the top is flat oxide again, with the tungsten and its liner left only inside the
  hole, their tops level with the oxide.
caption: >-
  A close-up of via 2; the lower part of the slice is cut off, and the drawing starts inside
  the aluminium of the metal-2 line under it. Before, the tungsten and its liner over the whole
  wafer; after, both polished off the field down to the cap oxide, leaving the via-2 plug: a
  0.20 µm square in the PDK's rules,[^pdk-periph] drawn here flush with the oxide. How far the
  polish recesses the plug and thins the 0.42 µm dielectric[^pdk-04] under the field is not
  public, and neither is drawn. The plug is drawn about 1.4 times as tall as it is wide, and its liner with one thickness, thicker on the floor, in proportion, than it is. The liner, the metal-2 line and, in the upper
  panel, the oxides are drawn but not labelled. Not to scale.
arrow:
