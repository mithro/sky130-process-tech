crop_depth: 72
alt: >-
  Two cross-sections of the wafer, one above the other. Before the step a continuous film covers
  the whole slice. After it a second, hatched film lies on top of the first across the whole
  slice, following the same small steps.
caption: >-
  Before, the doped gate film; after, the blanket nitride cap on top of it. Its thickness and
  whether it is deposited by LPCVD or PECVD are not public, so it is drawn at an arbitrary
  thickness. That it stays on the gates until contacts are cut, and is opened only under them,
  is the page's inference from the PDK's nitride-cut rules[^pdk-periph] and its "poly cap after
  SPE" of 0.2 µm, read as the whole cap stack.[^pdk-03] The colours of the gate film mark the type of its doping, not a depth profile. The field oxide (the oxide-filled trench in the middle) and both gate oxides are drawn but not labelled, and the liner oxide is drawn faded; the P-well and the NCHI channel implant made earlier are not drawn. Not to scale.
arrow:
  title: "GATENIT, step 058"
  note: "A blanket silicon nitride is deposited on the doped gate film."
