routes: {m3al: right, m3cap: right, capild: right, capm: right, ncap5: right}
crop_depth: -946
alt: >-
  Two enlarged cross-sections of a shallow lined hole going down through a flat pale oxide to a
  purple plate on a very thin striped film over a metal line. Before the step a thin purple
  liner covers the oxide and the walls and floor of the hole. After it a thick grey
  cross-hatched tungsten film covers the liner everywhere and fills the hole completely, with a
  slight dip in its top surface over the hole.
caption: >-
  A close-up of the via-3 hole on the capacitor's top plate; the lower part of the slice is cut
  off, and the drawing starts inside the aluminium of the metal 3 under the capacitor. Before,
  the lined hole; after, the tungsten grown over the whole wafer, closing the hole from its
  walls inward and continuous above it. Its thickness is not public; the page gives a film of
  the order of 0.25–0.35 µm as the industry norm for a via of this size,[^txt-05] and the drawn
  film is not to scale, nor is the dip over the hole; the liner is drawn with one thickness,
  far thicker in proportion than it is. Since a conformal film closes a hole from its walls, the
  page reads one film as filling both kinds of via; the deeper hole on the metal-3 line, outside
  this view, is filled in the same way. Over metal 3 the PDK's via 3 is 0.20 µm wide and
  0.39 µm deep;[^pdk-periph][^pdk-04] how much shallower the hole over a plate is depends on
  plate and dielectric thicknesses that are not public, and it is drawn a little less deep
  than it is wide. The oxides, the aluminium–copper of metal 3 and, in the lower panel,
  the liner, the plate, the dielectric and the metal cap are drawn but not labelled. Not to
  scale.
