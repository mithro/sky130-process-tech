id: m1-113-mm1
kind: xsection
page: docs/steps/113-mm1.md
series: series-metal1.yaml
crop_depth: 40
alt: >-
  Two cross-sections of the wafer, one above the other. Before the step three flat blanket films,
  thin purple, thick silver and thin purple, cover a flat pale oxide in which two small tungsten
  plugs sit over thin purple pads. After it three violet resist lines stand on the films: one over
  each plug and one in the middle of the slice.
caption: >-
  Before, the blanket metal-1 stack on the flat oxide and plugs; after, resist lines wherever the
  layout draws metal 1: one over each contact, enclosing it (the right-hand one runs on past the edge of
  the slice), and one over the middle of the slice, which has no contact here. The layout is an illustrative choice; the PDK's rules give a
  0.140 µm minimum width and space (m1.1, m1.2) and an enclosure of the contact of 0.030 µm
  (m1.4).[^pdk-periph] Which refractory films the bottom and the cap of the stack are is not
  public (the overview of the metal cap sets out the two readings, and the figure does not choose; the page's text opens with the TiW stack of the
  2013 report, and the figure, like the overview, draws neither); either way the resist sits on a flat film. Nothing is drawn to scale. The metal
  contacts, the bottom film of the stack, the local interconnect, the glass, the cap oxide, the lower tungsten plugs, the
  silicide discs, the contact liners and the transistors' films (the spacers, the caps, the gate
  oxides, the gate film, the re-oxidation oxide and the spacer oxide), the doped regions and the
  field oxide (the oxide-filled trench in the middle) are drawn but not labelled, and the liner
  oxide is drawn faded; the P-well and the NCHI channel implant made earlier are not drawn. The inter-level
  oxide under the stack is not labelled either. Not to scale.
arrow:
  title: "MM1, step 113"
  note: "Resist is coated, exposed through the metal reticle and developed, leaving a line wherever metal is to remain."
