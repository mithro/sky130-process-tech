id: beol-161-wtial5
kind: xsection
page: docs/steps/161-wtial5.md
series: series-beol.yaml
crop_depth: -190
alt: >-
  Two cross-sections of the upper films, one above the other, cut off at the bottom. Before the
  step two wide open holes go down through a flat pale oxide, one to a metal line and one to a
  raised thin plate. After it three films cover the whole top and fill the holes: a thin purple
  film lining the oxide, the walls and the floors, a very thick silver film that closes each
  hole, and another thin purple film, with a shallow dip over each hole.
caption: >-
  Before, the open via-4 holes; after, the metal-5 stack over the whole wafer and into the
  holes: a thin underlayer, lining the oxide, the walls and the floors, a thick aluminium–copper
  alloy that closes each hole, and a cap, with a shallow dimple over each hole. No public source
  states how via 4 is filled; the page reads the holes as filled by the metal-5 stack itself
  (an inference), and which technique does it — a thick, conventionally sputtered film, a
  heated or biased deposition, or a high-pressure fill — is not public: the drawn profile, each
  film growing with one thickness everywhere, only illustrates that reading. No public source
  gives the metal-5 films either; the page describes a Ti or TiW underlayer, some 1.2 µm of
  Al–Cu and a TiW cap, the cap read as TiW because the 2014 S8P stack change excluded "top
  metal layers"[^cyp-qtp-123907] (inferences; the overview of the metal cap sets out the
  evidence), and the figure draws every Ti, TiN and TiW film in one colour. The PDK's stack
  diagram gives metal 5 as 1.26 µm against 0.845 µm for metal 4,[^pdk-04] and it is drawn half
  as thick again, as it is there; on the page the stack is more than twice as thick as the via
  is deep, and it is drawn a little under twice as thick. The lower part of the slice is cut
  off: the drawing starts inside the oxide under metal 3. The metal-4 line and the capacitors,
  the plugs and their liners and the oxides are drawn but not labelled, except, in the upper
  panel, the metal cap film. Not to scale.
