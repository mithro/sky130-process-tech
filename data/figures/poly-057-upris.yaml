  Before, the URPM resist over the whole slice; after, the resist gone and the gate film bare
  and clean, ready for the cap. The chemical oxide the clean leaves on the film, which the page
  infers is kept, is not drawn. The field oxide is drawn but not labelled, and the liner oxide
  is drawn faded; the wells and channel implants made earlier are not drawn. Not to scale.
