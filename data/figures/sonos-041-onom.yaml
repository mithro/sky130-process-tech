id: sonos-041-onom
kind: xsection
page: docs/steps/041-onom.md
series: series-sonos.yaml
crop_depth: 90
alt: >-
  Two cross-sections of the wafer, one above the other. Before the step three thin films, oxide,
  nitride and oxide, cover the whole surface. After it a block of photoresist sits on them over the
  right-hand active area only, starting a little to the left of the window in the oxide and running
  on to the right-hand edge; the films elsewhere are exposed.
caption: >-
  Before, the stack over the whole wafer; after, one resist island over the memory transistor and
  the stack bare everywhere else. The island is drawn enclosing the tunnel window with a margin, as
  this page infers from a mask that designers do not draw and that is most simply generated by
  oversizing the tunnel layer; the margin is not public, its width here is illustrative, and the
  island runs on past the right-hand edge of the drawing. Its left-hand edge is drawn on the memory
  transistor's active area, which the page allows ("on silicon that becomes part of the select
  transistor's structure"). The pad oxide (which the page infers), the tunnel oxide in the window,
  the fill oxide and the deep N-well are drawn but not labelled; the punch-through stop and the
  depletion implant (the bands of PTSI and DEPI) and the liner oxide are drawn faded. Not to scale.
arrow:
  title: "ONOM, step 041"
  note: "Resist is coated, exposed through the ONO mask and developed, leaving an island over each memory transistor."
