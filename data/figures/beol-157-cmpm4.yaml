id: beol-157-cmpm4
kind: xsection
page: docs/steps/157-cmpm4.md
series: series-beol.yaml
crop_depth: -190
alt: >-
  Two cross-sections of the upper films, one above the other, cut off at the bottom. Before the
  step a thick pale oxide buries a metal line and a wider metal shape carrying a raised thin
  plate, its top higher over the metal than over the gap. After it the oxide is polished flat,
  leaving a layer of it over the metal, thinner over the plate.
caption: >-
  Before, the NILD6 oxide as deposited; after, polished flat until the topography is gone, at a
  height above the metal-4 line and the second capacitor's top plate. The polish is stopped by
  the removal amount, not by a stop layer, and how much it removes is not public. Since the
  plate stands above the metal-4 top, the oxide left over it is drawn thinner than over the
  bare line; how much remains over a plate is not public (with the cap to come, about
  0.35–0.4 µm on the page's estimate, of a finished 0.505 µm over metal 4[^pdk-04]). Nothing is
  drawn to scale, and the pattern-density steps the page describes are not drawn. The lower
  part of the slice is cut off: the drawing starts inside the oxide under metal 3. The bottom
  and cap films of metal 4, the thin capacitor dielectric, the first capacitor and the metal-3
  line, the via plugs and their liners and the oxides below are drawn but not labelled. Not to
  scale.
arrow:
  title: "CMPM4, step 157"
  note: "The oxide is polished flat, leaving a controlled thickness over the metal and the capacitor plates."
