# S6 — tips, halos, spacers and source/drain, steps 064-088.
#
# One geometry for the whole module; a figure is "the state after step N". Thicknesses are
# DRAWING units and are NOT to scale; the minimum drawn film is 5 u.
#
# STARTING STATE. The module continues from the exact end state of the poly series
# (series-poly.yaml, S5): its operations for steps 002-063 are repeated below unchanged, ids and
# label text included, so the wafer at step 063 is the same drawing in both series. The slice:
# a 5 V NMOS area on the left (x 0-80) under the thick gate oxide, with no gate in this slice; the
# field oxide (x 80-188) with one P+ poly resistor body on it (x 108-160); a 1.8 V NMOS area on the
# right (x 188-268) with one capped gate line (x 236-260), whose poly sidewalls carry the IOX45
# oxide. The slice has no PMOS and no SONOS transistor. The P-well and the NCHI channel implant
# stay in the geometry but every figure hides them, as S5's do.
#
# Which windows are open, mask by mask (each figure's caption says the same):
# * NTM (064): open over the 1.8 V NMOS, resist over the 5 V area and the field (the PDK's Table
#   F2b marks NTM "created", i.e. covered, on everything but the 1.8 V NMOS rows);
# * HVNTM (068): open over the 5 V NMOS (the hvi devices), thin resist elsewhere;
# * LDNTM (071): open only over SONOS transistors, so resist over the whole slice, and LDASTI and
#   LDBHI (072, 073) reach nothing here (the URPM/UPRI precedent of S5);
# * NPCM (078): a cut over the resistor. The slice is read as passing through one of the
#   resistor's contact heads, which the pages have opened by the nitride cut (rpm.5) and doped
#   by the P+ implant (rpm.4); that the slice runs through a head is an illustrative choice;
# * PSDM (081): open over the resistor (rpm.4), resist over both NMOS areas;
# * NSDM (085): open over both NMOS areas, resist over the field and the resistor (rpm.6).
#
# Doped regions (overlays in the silicon; each marks where a type of doping is, not a profile):
# * the 1.8 V tip (ASTI, 065) runs from the active edge to the poly edge on each side of the
#   gate: self-aligned to the gate, as the page says; any reach under the gate edge is not drawn;
# * the halo (BHI, 066), drawn with the pattern-only channel-implant material, sits under the tip
#   and reaches a little under the gate edge, the page's "around the tip, on the channel side";
#   its shape is industry-typical (the page's own description), and the S/D later covers most of it;
# * the 5 V tip (HVASTI, 069) covers the whole 5 V active area: there is no gate there in this
#   slice;
# * the deep N+ source/drain (NSDI, 086) covers the 5 V area and, on the 1.8 V side, runs from
#   the active edge to the outer foot of the spacer oxide: self-aligned to the spacer.
# Depths are drawn in the order the pages give (tip shallower than the halo, both shallower than
# the 0.1 um deep junction; the 5 V tip deeper than the 1.8 V tip), none to scale.
#
# Films. The spacer nitride (SPNIT, 076) is conformal; the unmasked spacer etch (SPE, 077) takes
# the film's own thickness off every horizontal surface and leaves slab-shaped spacers on the gate,
# the resistor and the field-oxide shoulders. The page has the over-etch clear the stringers at
# the step down from field oxide to active area, so those two are removed by an etch confined to
# the shoulders. The cap is drawn unchanged by SPE (how much it takes is not public, beyond the
# PDK's 0.2 um "poly cap after SPE"). NPCME (079) removes the oxide cap over the resistor, then
# cuts the nitride in the window down to the poly, which also shortens the resistor's spacers to
# the height of the poly (how much of the spacer the etch takes is not public). The spacer oxide
# (SPOX, 080) is conformal and blanket, as the page reads it.
#
# Thicknesses drawn: standard implant resist 38 u; the HV-tip resist 10 u, conformal (the PDK's
# 0.3 um against 1.14 um: thinner than the gate stack it covers); the nitride-cut resist 30 u;
# spacer nitride 8 u; spacer oxide 5 u. Series labels carry no numbers.
note_order: newest
substrate:
  material: si-sub
  depth: 160
  label:
    title: "Silicon wafer"
    basis: public
ops:
  # ================================================================ steps 002-063, as in series-poly.yaml
  # ---- steps 002-013, as in series-isolation.yaml
  - step: "002"
    op: deposit
    id: padox
    material: oxide-thermal
    t: 5
    label:
      title: "Pad oxide"
      note: "from BOX, step 002; still in place, we infer"
      basis: inferred
  - step: "003"
    op: deposit
    id: isonit
    material: nitride
    t: 24
    label:
      title: "Nitride hard mask"
      basis: public
  - step: "004"
    op: deposit
    id: fomres
    material: resist
    t: 38
    where: [[0, 79.5], [188.5, 268]]
    label:
      title: "Photoresist"
      basis: public
  - step: "005"
    op: etch
    materials: [nitride, oxide-thermal]
    where_open: fomres
  - step: "006"
    op: etch
    materials: [si-sub]
    where_open: fomres
    depth: 56
    taper_deg: 9
    corner_r: 9
  - step: "006"
    op: strip
    materials: [resist]
  - step: "010"
    op: deposit
    id: liner
    material: oxide-thermal
    t: 5
    only_on: [si-sub]
    label:
      title: "Liner oxide"
      basis: public
  - step: "011"
    op: deposit
    id: fox
    material: oxide-dep
    fill_to: 60
    route: over
    label:
      title: "Field oxide"
      basis: public
  - step: "012"
    op: planarise
    stop_on: nitride
  - step: "013"
    op: strip
    materials: [nitride]
  # ---- the P-well under both logic areas (PWI, step 027), without its mask
  - step: "027"
    op: dope
    id: pwell
    material: well-p
    where: [[0, 268]]
    follow: flat
    y_top: 0
    y_bot: -76
    anchor_y: -64
    label:
      title: "P-well"
      note: "PWI, step 027"
      basis: public
  - step: "034"
    op: anneal
  # ---- the logic silicon cleared at ONOME (step 042): the oxide over the active areas goes
  - step: "042"
    op: etch
    materials: [oxide-thermal]
    where: [[0, 80], [188, 268]]

  # ---- the thick gate oxide, grown on every active area
  - step: "043"
    op: deposit
    id: gox
    material: oxide-thermal
    t: 10
    only_on: [si-sub]
    label:
      title: "Thick gate oxide"
      note: "grown on every active area at step 043"
      basis: public

  # ---- the low-voltage oxide mask: resist over the 5 V area, a window over the 1.8 V area
  - step: "044"
    op: deposit
    id: lvores
    material: resist
    t: 38
    where: [[0, 134]]
    route: top
    label:
      title: "Photoresist"
      note: "low-voltage oxide mask, LVOM, step 044"
      basis: public

  # ---- the 1.8 V NMOS channel implant through the window
  - step: "045"
    op: dope
    id: nchi
    material: implant
    where: [[190, 268]]
    follow: surface
    from_surface: 0
    thickness: 9
    z: 1
    label:
      title: "NMOS channel implant"
      note: "NCHI, step 045; its species and depth are not public"
      basis: public
  - step: "045"
    op: ions
    where_open: lvores
    tilt_deg: 0
    label:
      title: "NCHI implant"
      note: "species, energy, dose not public"
      basis: public

  # ---- the thick oxide is etched out of the window; the resist is stripped
  - step: "046"
    op: etch
    materials: [oxide-thermal]
    where_open: lvores
  - step: "046"
    op: strip
    materials: [resist]

  # ---- the thin gate oxide, grown on the silicon GOXETCH cleared
  - step: "047"
    op: deposit
    id: thinox
    material: oxide-thermal
    t: 5
    only_on: [si-sub]
    label:
      title: "Thin gate oxide"
      note: "LVGOX, step 047"
      basis: public

  # ---- the gate film
  - step: "048"
    op: deposit
    id: poly
    material: poly
    t: 20
    route: over
    label:
      title: "Gate film"
      note: "deposited at SAGD, step 048"
      basis: public

  # ---- the resistor-protect mask and the gate implant
  - step: "049"
    op: deposit
    id: rpmres
    material: resist
    t: 38
    where: [[100, 168]]
    label:
      title: "Photoresist"
      note: "RPM, step 049; over the future resistor body"
      basis: inferred
  - step: "050"
    op: dope
    id: polyn
    material: sd-n
    host: poly
    where_open: rpmres
    label:
      title: "n-type gate film"
      note: "gate implant, step 050"
      basis: public
  - step: "050"
    op: ions
    where_open: rpmres
    tilt_deg: 0
    label:
      title: "P1I implant"
      note: "n-type; species, energy and dose are not public"
      basis: public
  - step: "051"
    op: strip
    materials: [resist]

  # ---- the reverse resistor mask and the P+ resistor implant
  - step: "052"
    op: deposit
    id: rrpmres
    material: resist
    t: 38
    where: [[0, 100], [168, 268]]
    label:
      title: "Photoresist"
      note: "RRPM, step 052; open over the resistor body"
      basis: inferred
  - step: "053"
    op: dope
    id: polyp
    material: sd-p
    host: poly
    where_open: rrpmres
    label:
      title: "p-type resistor body"
      note: "resistor implant, step 053"
      basis: public
  - step: "053"
    op: ions
    where_open: rrpmres
    tilt_deg: 0
    label_x: 60
    label:
      title: "PRI implant"
      note: "p-type; species, energy and dose are not public"
      basis: public
  - step: "054"
    op: strip
    materials: [resist]

  # ---- the ultra-high-resistor mask: its windows lie outside this slice
  - step: "055"
    op: deposit
    id: urpmres
    material: resist
    t: 38
    where: [[0, 268]]
    label:
      title: "Photoresist"
      note: "URPM, step 055; it opens only over the ultra-high-value resistors"
      basis: public
  - step: "056"
    op: ions
    where: [[0, 268]]
    tilt_deg: 0
    label_x: 10
    label:
      title: "UPRI implant"
      note: "stopped here by the resist"
      basis: public
  - step: "057"
    op: strip
    materials: [resist]

  # ---- the caps
  - step: "058"
    op: deposit
    id: nit
    material: nitride
    t: 10
    label:
      title: "Nitride cap"
      note: "GATENIT, step 058"
      basis: public
  - step: "059"
    op: deposit
    id: capox
    material: oxide-dep
    t: 8
    label:
      title: "Oxide cap"
      note: "POC, step 059"
      basis: public

  # ---- the backside film removal: nothing on the front changes (see the header)
  - step: "060"
    op: etch
    materials: [oxide-dep]
    depth: 0

  # ---- the gate mask and the gate etch
  - step: "061"
    op: deposit
    id: p1mres
    material: resist
    t: 30
    where: [[236, 260], [108, 160]]
    label:
      title: "Photoresist"
      note: "gate mask, step 061; a line wherever poly is to remain"
      basis: public
  - step: "062"
    op: etch
    materials: [oxide-dep]
    where_open: p1mres
  - step: "062"
    op: etch
    materials: [nitride]
    where_open: p1mres
  - step: "062"
    op: etch
    materials: [poly]
    where_open: p1mres
  - step: "062"
    op: strip
    materials: [resist]

  # ---- the re-oxidation: silicon and the poly sidewalls; the capped poly top does not grow.
  # The thinner oxide on the resistor's sidewalls cannot be drawn by this operation (the
  # resistor stands on field oxide) and is left out; the IOX45 caption says so.
  - step: "063"
    op: deposit
    id: iox
    material: oxide-thermal
    t: 5
    only_on: [si-sub, oxide-thermal, poly]
    label:
      title: "Re-oxidation oxide"
      note: "grown at step 063; thin, we infer"
      basis: inferred

  # ================================================================ S6: tips and halos
  # ---- the N-tip mask: open over the 1.8 V NMOS; resist over the 5 V area and the field
  - step: "064"
    op: deposit
    id: ntmres
    material: resist
    t: 38
    where: [[0, 176]]
    label:
      title: "Photoresist"
      note: "NTM, step 064; open over the standard NMOS"
      basis: public

  # ---- the arsenic tip, self-aligned to the gate
  - step: "065"
    op: dope
    id: tipn
    material: tip-n
    where: [[188, 236], [260, 268]]
    follow: surface
    from_surface: 0
    thickness: 6
    z: 2
    label:
      title: "n-type tip"
      note: "ASTI, step 065"
      basis: public
  - step: "065"
    op: ions
    where_open: ntmres
    tilt_deg: 7
    label:
      title: "ASTI implant"
      note: "arsenic; energy and dose are not public"
      basis: public

  # ---- the boron halo through the same resist
  - step: "066"
    op: dope
    id: halo
    material: implant
    where: [[188, 241], [255, 268]]
    follow: surface
    from_surface: 0
    thickness: 10
    z: 1
    label:
      title: "Halo"
      note: "BHI, step 066; a p-type pocket"
      basis: typical
  - step: "066"
    op: ions
    where_open: ntmres
    tilt_deg: 0
    label:
      title: "BHI implant"
      note: "species, energy, dose and tilt are not public"
      basis: public
  - step: "067"
    op: strip
    materials: [resist]

  # ---- the HV N-tip mask: a thin resist, open over the 5 V NMOS
  - step: "068"
    op: deposit
    id: hvntmres
    material: resist
    t: 10
    flat: false
    where: [[92, 268]]
    label:
      title: "Thin photoresist"
      note: "HVNTM, step 068; open over the high-voltage NMOS"
      basis: public

  # ---- the 5 V tip, at a large tilt; no gate in the 5 V area of this slice
  - step: "069"
    op: dope
    id: hvtip
    material: tip-n
    where: [[0, 80]]
    follow: surface
    from_surface: 0
    thickness: 9
    z: 2
    label:
      title: "High-voltage n-type tip"
      note: "HVASTI, step 069"
      basis: public
  - step: "069"
    op: ions
    where_open: hvntmres
    tilt_deg: 40
    label:
      title: "HVASTI implant"
      note: "arsenic; energy and dose are not public"
      basis: public
  - step: "070"
    op: strip
    materials: [resist]

  # ---- the SONOS tip mask: its windows lie outside this slice
  - step: "071"
    op: deposit
    id: ldntmres
    material: resist
    t: 38
    where: [[0, 268]]
    label:
      title: "Photoresist"
      note: "LDNTM, step 071; open only over SONOS transistors"
      basis: public
  - step: "072"
    op: ions
    where: [[0, 268]]
    tilt_deg: 0
    label_x: 10
    label:
      title: "LDASTI implant"
      note: "stopped here by the resist"
      basis: public
  - step: "073"
    op: ions
    where: [[0, 268]]
    tilt_deg: 0
    label_x: 10
    label:
      title: "LDBHI implant"
      note: "stopped here by the resist"
      basis: public
  - step: "074"
    op: strip
    materials: [resist]

  # ---- the tip anneal: nothing the drawing shows moves
  - step: "075"
    op: anneal

  # ================================================================ S6: spacers
  - step: "076"
    op: deposit
    id: spnit
    material: nitride
    t: 8
    label:
      title: "Spacer nitride"
      note: "SPNIT, step 076"
      basis: public

  # ---- the unmasked etch-back: the film's own thickness off every horizontal surface ...
  - step: "077"
    op: etch
    materials: [nitride]
    depth: 8
  # ---- ... and the over-etch clears the stringers at the field-oxide shoulders (see header)
  - step: "077"
    op: etch
    materials: [nitride]
    where: [[64, 90], [178, 204]]

  # ---- the nitride cut: a window over the resistor (the slice read through its contact head)
  - step: "078"
    op: deposit
    id: npcres
    material: resist
    t: 30
    where: [[0, 96], [172, 268]]
    label:
      title: "Photoresist"
      note: "NPCM, step 078; a cut over the resistor head"
      basis: public
  - step: "079"
    op: etch
    materials: [oxide-dep]
    where: [[108, 160]]
  - step: "079"
    op: etch
    materials: [nitride]
    where_open: npcres
    depth: 18
  - step: "079"
    op: strip
    materials: [resist]

  # ---- the spacer oxide, conformal and blanket
  - step: "080"
    op: deposit
    id: spox
    material: oxide-dep
    t: 5
    label:
      title: "Spacer oxide"
      note: "SPOX, step 080; read as the PDK's oxide spacer"
      basis: inferred

  # ================================================================ S6: source/drain
  # ---- the P+ mask: open over the resistor (rpm.4); resist over both NMOS areas
  - step: "081"
    op: deposit
    id: psdres
    material: resist
    t: 38
    where: [[0, 96], [172, 268]]
    label:
      title: "Photoresist"
      note: "PSDM, step 081; open over the resistor"
      basis: public
  - step: "082"
    op: ions
    where_open: psdres
    tilt_deg: 0
    label:
      title: "PSDI implant"
      note: "p-type; species, energy and dose are not public"
      basis: public
  - step: "083"
    op: ions
    where_open: psdres
    tilt_deg: 0
    label:
      title: "2PSDI implant"
      note: "p-type; what it adds is not public"
      basis: public
  - step: "084"
    op: strip
    materials: [resist]

  # ---- the N+ mask: open over both NMOS areas; resist over the field and the resistor (rpm.6)
  - step: "085"
    op: deposit
    id: nsdres
    material: resist
    t: 38
    where: [[84, 184]]
    label:
      title: "Photoresist"
      note: "NSDM, step 085; open over every NMOS"
      basis: public
  - step: "086"
    op: dope
    id: nsd
    material: sd-n
    where: [[0, 80], [188, 218]]
    follow: surface
    from_surface: 0
    thickness: 14
    z: 3
    label:
      title: "N+ source/drain"
      note: "NSDI, step 086"
      basis: public
  - step: "086"
    op: ions
    where_open: nsdres
    tilt_deg: 0
    label:
      title: "NSDI implant"
      note: "n-type; species, energy and dose are not public"
      basis: public
  - step: "087"
    op: strip
    materials: [resist]

  # ---- the source/drain anneal: nothing the drawing shows moves
  - step: "088"
    op: anneal
