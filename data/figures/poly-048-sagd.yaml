id: poly-048-sagd
kind: xsection
page: docs/steps/048-sagd.md
series: series-poly.yaml
crop_depth: 72
alt: >-
  Two cross-sections of the wafer, one above the other. Before the step two active areas lie
  either side of an oxide-filled trench whose top stands proud of them; the left-hand area is
  covered by a thicker oxide than the right-hand one. After it one continuous film covers the
  whole slice, following the steps at each edge of the trench.
caption: >-
  Before, the wafer as the gate-oxide module leaves it: the thick oxide of GOX100 on the NMOS
  area on the left and the thin oxide of LVGOX on the NMOS area on the right, with the field
  oxide still standing proud of them as in the earlier figures. The page of the gate mask
  describes a nearly planar surface with only a small field-oxide step at each active edge; no
  page says where the larger step comes down, so none is drawn. After, the blanket gate film
  over the whole slice; it is drawn as one layer, which the page infers (the PDK's stack drawing
  shows a single poly layer[^pdk-04]), and its thickness is the PDK's 0.18 µm,[^pdk-03] drawn
  far thicker than it is. That the film is undoped and amorphous as deposited is the page's
  inference from SkyWater's capability list.[^skw-01] In the lower panel the field oxide (the
  oxide-filled trench in the middle) and the thick gate oxide are drawn but not labelled. The liner oxide is drawn faded;
  the P-well and the NCHI channel implant made earlier are not drawn. Not to scale.
arrow:
  title: "SAGD, step 048"
  note: "LPCVD lays one blanket film of amorphous silicon over gate oxide and field oxide alike."
