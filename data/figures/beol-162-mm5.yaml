id: beol-162-mm5
kind: xsection
page: docs/steps/162-mm5.md
series: series-beol.yaml
crop_depth: -190
alt: >-
  Two cross-sections of the upper films, one above the other, cut off at the bottom. Before the
  step a very thick blanket metal stack covers a flat pale oxide, dipping slightly over two
  filled holes. After it two thick violet resist blocks stand on the stack, one over each
  filled hole, with bare metal between them.
caption: >-
  Before, the blanket metal-5 stack, with its shallow dimples over the filled via-4 holes (the
  page's inference, on the fill reading of WTIAL5); after, the resist of the metal-5 mask: one
  block over each via, with the metal bare between them. The periphery rules give metal 5 a
  minimum width and space of 1.600 µm (m5.1, m5.2) and a via-4 enclosure of 0.310 µm
  (m5.3);[^pdk-periph] the layout is an illustrative choice, and neither the blocks nor the
  resist are drawn to scale. The resist is drawn thicker than at the lower metal levels, since
  the page describes it as thick enough to survive the etch of the 1.26 µm stack;[^pdk-04] the
  PDK's 1.14 µm resist[^pdk-03] is an antenna-rule assumption. Which films clad metal 5 is not
  public (the page reads the cap as TiW; the overview of the metal cap sets out the evidence).
  The lower part of the slice is cut off: the drawing starts inside the oxide under metal 3.
  The underlayer of metal 5, the metal-4 line and the capacitors, the plugs and their liners
  and the oxides are drawn but not labelled, nor, in the lower panel, is the metal-5 cap. Not
  to scale.
arrow:
  title: "MM5, step 162"
  note: "Resist is coated, exposed through the metal reticle and developed, leaving it wherever metal is to remain."
