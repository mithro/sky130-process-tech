id: iso-007-dnm
kind: xsection
page: docs/steps/007-dnm.md
series: series-isolation.yaml
alt: >-
  Two cross-sections of the wafer, one above the other. Before the step the etched trench is open and
  the wafer carries no resist. After it a thick block of photoresist covers the right-hand part of the
  drawing, filling nothing on the left, so that the trench and the active area on the left lie in an
  open window and the active area on the right is masked.
caption: >-
  The wafer before and after `DNM`, the second mask step of the flow. At this point the wafer has
  open, unfilled isolation trenches and a nitride/pad-oxide stack over the active areas; the thick
  resist is opened over the regions that are to receive the high-energy phosphorus implant at `DNI`.
  The PDK's mask table lists "Deep N-Well, DNM" as used in SKY130.[^pdk-05] Where the mask edge falls
  in this drawing is chosen only so that both sides of it can be seen. Not to scale.
arrow:
  title: "DNM, step 007"
  note: "A thick resist is coated, exposed through the deep N-well mask and developed, opening windows over the deep N-well regions."
panels:
  - state_after: "006"
    crop_depth: 84
    title: "Before: the open trench left by STIE (step 006)"
  - state_after: "007"
    crop_depth: 84
    title: "After: thick resist, with a window over the deep N-well region"
