alt: >-
  Two cross-sections of the wafer, one above the other. Before the step the etched trench is open and
  the wafer carries no resist. After it a thick block of photoresist covers the right-hand part of the
  drawing, filling nothing on the left, so that the trench and the active area on the left lie in an
  open window and the active area on the right is masked.
caption: >-
  Before, the open trench; after, a thick block of resist over the right of the slice and an open
  window over the left. The PDK's mask table lists "Deep N-Well, DNM" as used in SKY130.[^pdk-05]
  Where the mask edge falls here is chosen only so that both sides of it can be seen; no layout is
  being shown. Not to scale.
arrow:
  title: "DNM, step 007"
  note: "A thick resist is coated, exposed through the deep N-well mask and developed, opening windows over the deep N-well regions."
