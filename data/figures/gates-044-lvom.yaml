id: gates-044-lvom
kind: xsection
page: docs/steps/044-lvom.md
series: series-gates.yaml
crop_depth: 72
alt: >-
  Two cross-sections of the wafer, one above the other. Before the step a thick oxide film covers
  both active areas either side of an oxide-filled trench. After it a block of photoresist covers
  the left-hand active area and the left half of the trench, and the right-hand active area lies in
  an open window, the resist edge standing on the trench oxide.
caption: >-
  Before, the thick oxide on both active areas; after, resist over the 5 V area and a window over
  the 1.8 V area, with the resist edge on the field oxide between them. That the window opens the
  low-voltage transistors is this page's reading, from the inference that the reticle is the
  complement of the drawn thick-oxide layer `hvi`.[^pdk-periph] The memory cells are not in this
  slice: whether this mask also covers their ONO islands is not public. The liner oxide is drawn
  faded. Not to scale.
arrow:
  title: "LVOM, step 044"
  note: "Resist is coated, exposed through the low-voltage oxide mask and developed, opening windows over the low-voltage areas."
panels:
  - state_after: "043"
    title: "Before: the thick oxide from GOX100 (step 043); 5 V left, 1.8 V right"
    dim_layers: [liner]
    hide_labels: [sub]
  - state_after: "044"
    title: "After: resist over the 5 V area, a window over the 1.8 V area"
    dim_layers: [liner]
