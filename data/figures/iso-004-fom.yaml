alt: >-
  Two cross-sections of the wafer, one above the other. Before the step the nitride-on-oxide stack
  covers the whole wafer. After it two blocks of photoresist stand on that stack, one at each side of
  the drawing, with the middle of the wafer left uncovered between them.
caption: >-
  Before, the blanket nitride-on-oxide stack; after, two blocks of resist with the field open
  between them. The PDK's mask table lists "Field Oxide, FOM" as a mask used in SKY130.[^pdk-05]
  Where the resist edges fall here is illustrative: no layout is being shown, and the
  anti-reflective coating the page describes under the resist is not drawn. Not to scale.
