# S5 — the poly gate and poly-resistor module, steps 048-063.
#
# One geometry for the whole module; a figure is "the state after step N". Thicknesses are
# DRAWING units and are NOT to scale; the minimum drawn film is 5 u.
#
# STARTING STATE. The module continues from the exact end state of the gate-oxide series
# (series-gates.yaml, S4): its operations for steps 002-047 are repeated below unchanged, so
# the wafer at step 047 is the same drawing in both series. The slice is the S4 logic slice:
# a 5 V NMOS area on the left (x 0-80) that keeps the thick gate oxide (id `gox`, GOX100), a
# 1.8 V NMOS area on the right (x 188-268) with the thin oxide of LVGOX (id `thinox`) and the
# NCHI channel implant, both in the P-well, and the filled trench (x 80-188) between them,
# its oxide standing proud as the earlier modules leave it. P1M (step 061) describes the
# surface the gate is printed on as nearly planar, with only a 0.07 um field-oxide step
# (pdk-03); no page says where the larger step drawn here comes down, so none is drawn, and
# the 048 caption says so. The only changes to the repeated operations are label text: the trench oxide is titled
# "Field oxide" here, as the pages of this module call it (for "Fill oxide" in the
# isolation, wells and gates series), and the thin oxide's note is shortened to keep the
# label column within the drawing's height.
#
# Module geometry. One gate line is drawn over the 1.8 V NMOS area (x 236-260, clear of the
# steps that the conformal films make near the field edge; the 0.150 um minimum poly width
# is the drawn gate length of the 1.8 V transistors) and one resistor body over the field
# oxide (x 108-160), as report D sets out for this series; the 5 V area gets no gate in this
# slice. The resistor is read as a 300 ohm/sq P+ poly resistor (res_high_po, the `rpm`
# layer): RPM (step 049) leaves resist over it, RRPM (step 052) opens a window over it, and
# URPM (step 055), which opens only over the 2000 ohm/sq `urpm` bodies, leaves resist over
# the whole slice, so UPRI (step 056) reaches nothing here. The RPM island and the RRPM
# window (x 100-168) are drawn wider than the body, because `rpm` encloses the resistor
# (rule rpm.3, cited on the pages).
#
# Doping of the gate film. P1I (step 050) and PRI (step 053) are drawn as doped overlays
# confined to the gate film (`dope` with `host: poly`): the n-type gate film in the N+
# source/drain colour and the p-type resistor body in the P+ one. An overlay fills the whole
# thickness of the film, because it marks the type of the doping, not a depth profile, which
# is not public; the captions say so.
#
# Thicknesses drawn: gate film 20 u, nitride cap 10 u, oxide cap 8 u, implant-mask resist
# 38 u, gate-mask resist 30 u (P1M infers a thinner resist than the generic 1.14 um of the
# assumptions table), re-oxidation 5 u. None of the cap thicknesses is public (the PDK's
# 0.2 um "poly cap after SPE" is read on the pages as the whole cap stack after the spacer
# etch), so the caps are not drawn to any ratio with the 0.18 um poly.
#
# BFR (step 060) etches the back of the wafer, which is not drawn: it is written as an etch
# of depth 0 on the front so that the step has a state of its own.
#
# The P-well and the NCHI channel implant are kept in the geometry so that the series stay
# one, but the figures of this module hide them: no page of this module discusses them.
# Series labels carry no numbers.
note_order: newest
substrate:
  material: si-sub
  depth: 160
  label:
    title: "Silicon wafer"
    basis: public
ops:
  # ---- steps 002-013, as in series-isolation.yaml
  - step: "002"
    op: deposit
    id: padox
    material: oxide-thermal
    t: 5
    label:
      title: "Pad oxide"
      note: "from BOX, step 002; still in place, we infer"
      basis: inferred
  - step: "003"
    op: deposit
    id: isonit
    material: nitride
    t: 24
    label:
      title: "Nitride hard mask"
      basis: public
  - step: "004"
    op: deposit
    id: fomres
    material: resist
    t: 38
    where: [[0, 79.5], [188.5, 268]]
    label:
      title: "Photoresist"
      basis: public
  - step: "005"
    op: etch
    materials: [nitride, oxide-thermal]
    where_open: fomres
  - step: "006"
    op: etch
    materials: [si-sub]
    where_open: fomres
    depth: 56
    taper_deg: 9
    corner_r: 9
  - step: "006"
    op: strip
    materials: [resist]
  - step: "010"
    op: deposit
    id: liner
    material: oxide-thermal
    t: 5
    only_on: [si-sub]
    label:
      title: "Liner oxide"
      basis: public
  - step: "011"
    op: deposit
    id: fox
    material: oxide-dep
    fill_to: 60
    route: over
    label:
      title: "Field oxide"
      basis: public
  - step: "012"
    op: planarise
    stop_on: nitride
  - step: "013"
    op: strip
    materials: [nitride]
  # ---- the P-well under both logic areas (PWI, step 027), without its mask
  - step: "027"
    op: dope
    id: pwell
    material: well-p
    where: [[0, 268]]
    follow: flat
    y_top: 0
    y_bot: -76
    anchor_y: -64
    label:
      title: "P-well"
      note: "PWI, step 027"
      basis: public
  - step: "034"
    op: anneal
  # ---- the logic silicon cleared at ONOME (step 042): the oxide over the active areas goes
  - step: "042"
    op: etch
    materials: [oxide-thermal]
    where: [[0, 80], [188, 268]]

  # ---- the thick gate oxide, grown on every active area
  - step: "043"
    op: deposit
    id: gox
    material: oxide-thermal
    t: 10
    only_on: [si-sub]
    label:
      title: "Thick gate oxide"
      note: "grown on every active area at step 043"
      basis: public

  # ---- the low-voltage oxide mask: resist over the 5 V area, a window over the 1.8 V area
  - step: "044"
    op: deposit
    id: lvores
    material: resist
    t: 38
    where: [[0, 134]]
    route: top
    label:
      title: "Photoresist"
      note: "low-voltage oxide mask, LVOM, step 044"
      basis: public

  # ---- the 1.8 V NMOS channel implant through the window
  - step: "045"
    op: dope
    id: nchi
    material: implant
    where: [[190, 268]]
    follow: surface
    from_surface: 0
    thickness: 9
    z: 1
    label:
      title: "NMOS channel implant"
      note: "NCHI, step 045; its species and depth are not public"
      basis: public
  - step: "045"
    op: ions
    where_open: lvores
    tilt_deg: 0
    label:
      title: "NCHI implant"
      note: "species, energy, dose not public"
      basis: public

  # ---- the thick oxide is etched out of the window; the resist is stripped
  - step: "046"
    op: etch
    materials: [oxide-thermal]
    where_open: lvores
  - step: "046"
    op: strip
    materials: [resist]

  # ---- the thin gate oxide, grown on the silicon GOXETCH cleared
  - step: "047"
    op: deposit
    id: thinox
    material: oxide-thermal
    t: 5
    only_on: [si-sub]
    label:
      title: "Thin gate oxide"
      note: "LVGOX, step 047"
      basis: public

  # ---- the gate film
  - step: "048"
    op: deposit
    id: poly
    material: poly
    t: 20
    route: over
    label:
      title: "Gate film"
      note: "deposited at SAGD, step 048"
      basis: public

  # ---- the resistor-protect mask and the gate implant
  - step: "049"
    op: deposit
    id: rpmres
    material: resist
    t: 38
    where: [[100, 168]]
    label:
      title: "Photoresist"
      note: "RPM, step 049; over the future resistor body"
      basis: inferred
  - step: "050"
    op: dope
    id: polyn
    material: sd-n
    host: poly
    where_open: rpmres
    label:
      title: "n-type gate film"
      note: "gate implant, step 050"
      basis: public
  - step: "050"
    op: ions
    where_open: rpmres
    tilt_deg: 0
    label:
      title: "P1I implant"
      note: "n-type; species, energy and dose are not public"
      basis: public
  - step: "051"
    op: strip
    materials: [resist]

  # ---- the reverse resistor mask and the P+ resistor implant
  - step: "052"
    op: deposit
    id: rrpmres
    material: resist
    t: 38
    where: [[0, 100], [168, 268]]
    label:
      title: "Photoresist"
      note: "RRPM, step 052; open over the resistor body"
      basis: inferred
  - step: "053"
    op: dope
    id: polyp
    material: sd-p
    host: poly
    where_open: rrpmres
    label:
      title: "p-type resistor body"
      note: "resistor implant, step 053"
      basis: public
  - step: "053"
    op: ions
    where_open: rrpmres
    tilt_deg: 0
    label_x: 60
    label:
      title: "PRI implant"
      note: "p-type; species, energy and dose are not public"
      basis: public
  - step: "054"
    op: strip
    materials: [resist]

  # ---- the ultra-high-resistor mask: its windows lie outside this slice
  - step: "055"
    op: deposit
    id: urpmres
    material: resist
    t: 38
    where: [[0, 268]]
    label:
      title: "Photoresist"
      note: "URPM, step 055; it opens only over the ultra-high-value resistors"
      basis: public
  - step: "056"
    op: ions
    where: [[0, 268]]
    tilt_deg: 0
    label_x: 10
    label:
      title: "UPRI implant"
      note: "stopped here by the resist"
      basis: public
  - step: "057"
    op: strip
    materials: [resist]

  # ---- the caps
  - step: "058"
    op: deposit
    id: nit
    material: nitride
    t: 10
    label:
      title: "Nitride cap"
      note: "GATENIT, step 058"
      basis: public
  - step: "059"
    op: deposit
    id: capox
    material: oxide-dep
    t: 8
    label:
      title: "Oxide cap"
      note: "POC, step 059"
      basis: public

  # ---- the backside film removal: nothing on the front changes (see the header)
  - step: "060"
    op: etch
    materials: [oxide-dep]
    depth: 0

  # ---- the gate mask and the gate etch
  - step: "061"
    op: deposit
    id: p1mres
    material: resist
    t: 30
    where: [[236, 260], [108, 160]]
    label:
      title: "Photoresist"
      note: "gate mask, step 061; a line wherever poly is to remain"
      basis: public
  - step: "062"
    op: etch
    materials: [oxide-dep]
    where_open: p1mres
  - step: "062"
    op: etch
    materials: [nitride]
    where_open: p1mres
  - step: "062"
    op: etch
    materials: [poly]
    where_open: p1mres
  - step: "062"
    op: strip
    materials: [resist]

  # ---- the re-oxidation: silicon and the poly sidewalls; the capped poly top does not grow.
  # The thinner oxide on the resistor's sidewalls cannot be drawn by this operation (the
  # resistor stands on field oxide) and is left out; the IOX45 caption says so.
  - step: "063"
    op: deposit
    id: iox
    material: oxide-thermal
    t: 5
    only_on: [si-sub, oxide-thermal, poly]
    label:
      title: "Re-oxidation oxide"
      note: "grown at step 063; thin, we infer"
      basis: inferred
