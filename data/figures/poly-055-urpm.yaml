id: poly-055-urpm
kind: xsection
page: docs/steps/055-urpm.md
series: series-poly.yaml
crop_depth: 72
alt: >-
  Two cross-sections of the wafer, one above the other. Before the step a continuous film covers
  the whole slice. After it resist covers the whole slice without any opening.
caption: >-
  Before, the bare gate film; after, resist over the whole slice. URPM opens only over the bodies
  of the ultra-high-value (`res_xhigh_po`) resistors,[^pdk-07] and the resistor drawn in this
  slice is read as a 300 Ω/sq one,[^pdk-07] so here the resist has no window. That the URPM
  reticle is made from `urpm` in the window tone is the page's inference; the PDK's mask table
  does not list it.[^pdk-05] The colours of the gate film mark the type of its doping, not a depth profile. Under the resist the p-type resistor body is not labelled, because its leader would have to rise through the resist. The field oxide (the oxide-filled trench in the middle) and both gate oxides are drawn but not labelled, and the liner oxide is
  drawn faded; the P-well and the NCHI channel implant made earlier are not drawn. Not to scale.
arrow:
  title: "URPM, step 055"
  note: "Resist is coated, exposed through the ultra-high-resistor reticle and developed; its windows lie outside this slice."
