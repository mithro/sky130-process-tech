id: poly-050-p1i
kind: xsection
page: docs/steps/050-p1i.md
series: series-poly.yaml
crop_depth: 72
alt: >-
  Two cross-sections of the wafer, one above the other. Before the step a continuous film covers
  the whole slice, with one block of resist on it over the middle of the oxide-filled trench.
  After it arrows come down everywhere except on the resist, and the film outside the resist is
  drawn in a new colour through its whole thickness; the film under the resist keeps its
  original colour.
caption: >-
  Before, the RPM island on the undoped gate film; after, the whole film outside the island
  n-type, the doping the PDK calls "N+ doped gate poly",[^pdk-07] and the film under the island,
  the future resistor body, left undoped, which is the page's reading of RPM. The colour fills
  the whole thickness of the film because it marks the type of the doping, not where it sits:
  the page places the dopant in the upper part of the film and has the later thermal steps
  spread it, and no depth is public. Species, energy, dose and tilt are not public; the arrows
  are drawn vertical. In the lower panel the undoped film under the island keeps the gate film's own colour and is not labelled, because its leader would have to rise through the resist. The field oxide (the oxide-filled trench in the middle) and the thick gate oxide on the left are drawn but not labelled, and the liner oxide is drawn faded; the P-well and the NCHI channel implant made earlier are not drawn. Not to scale.
arrow:
  title: "P1I, step 050"
  note: "A heavy n-type dose goes into the gate film everywhere the resist leaves it open."
panels:
  - state_after: "049"
    title: "Before: the RPM resist island from step 049"
    hide_layers: [pwell, nchi]
