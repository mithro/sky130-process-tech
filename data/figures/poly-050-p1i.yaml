alt: >-
  One cross-section of the wafer. A continuous film covers the whole slice, with one block of
  resist on it over the middle of the oxide-filled trench. Arrows come down everywhere except on
  the resist. The drawing is the same as the state before the step.
caption: >-
  At P1I the whole gate film outside the resist island receives a heavy n-type dose, the
  doping the PDK calls "N+ doped gate poly";[^pdk-07] the island keeps it off the resistor body.
  The doping itself is not drawn: the page places the dopant in the upper part of the film and
  has the later thermal steps spread it through the whole thickness, and no depth is public, so
  the drawing is the same as before the step. Species, energy, dose and tilt are not public; the
  arrows are drawn vertical. The field oxide (the oxide-filled trench in the middle) is drawn but not labelled, and the liner oxide is drawn faded; the wells and channel implants
  made earlier are not drawn. Not to scale.
