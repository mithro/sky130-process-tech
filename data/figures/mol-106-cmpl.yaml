id: mol-106-cmpl
kind: xsection
page: docs/steps/106-cmpl.md
series: series-mol.yaml
crop_depth: 60
alt: >-
  Two cross-sections of the wafer, one above the other. Before the step a thick pale oxide with a flat top
  covers three thin purple pads under a thin hatched film. After it the oxide
  is polished flat and thinner, leaving a layer of it over the pads.
caption: >-
  Before, the oxide as deposited; after, polished flat to a set thickness over the local
  interconnect, the surface on which the metal-1 contacts are printed. The page reads the PDK's
  0.265 µm "NILD2" interval[^pdk-04] as the thickness left over the LI nitride after the polish
  (our reading); the removal is not public, and nothing is drawn to scale. The glass, the cap oxide, the tungsten plugs and the local interconnect on them, the silicide discs,
  the contact liner and the transistors' films (the spacers, the caps, the gate oxides, the gate
  film, the re-oxidation oxide and the spacer oxide), the doped regions and the field oxide (the
  oxide-filled trench in the middle) are drawn but not labelled, and the liner oxide is drawn
  faded; the P-well and the NCHI channel implant made earlier are not drawn. Not to scale.
arrow:
  title: "CMPL, step 106"
  note: "The oxide is polished flat, leaving a set thickness over the local interconnect."
