alt: >-
  One cross-section of the wafer: pad oxide over a P-well on the left and an N-well on the right,
  which meet under the middle of an oxide-filled trench, with a thin implanted band at the surface of
  each active area. The drawing is the same as the state before the step.
caption: >-
  The state the module leaves: at RTAI the wafer is heated to repair the implant damage and activate
  the implants of the module, and the drawing is the same as before it. No public source says how far
  the anneal moves any of the wells or channel bands, so no diffusion is drawn. The anneal's
  temperature, time and ambient are not public. The pad oxide is drawn in place, as the pages assume;
  whether it is present during the anneal is not stated publicly. The NMOS channel implant, the PMOS
  channel implant and the liner oxide are drawn faded. Not to scale.
