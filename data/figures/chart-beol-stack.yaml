id: chart-beol-stack
kind: stack
page: docs/overview/index.md
to_scale: true
title: "The stack above the field oxide, to scale"
axis:
  unit: "µm"
  label: "Height above the field-oxide top, from the levels labelled on the PDK's stack diagram"
  tick: 1
footer: >-
  To scale. Every thickness is a level or an interval labelled on the PDK's process stack diagram, as
  the table below lists them. The two MiM capacitor plates are not labelled with a thickness and are
  not drawn.
alt: >-
  A single column of layers drawn to scale beside a vertical axis in micrometres, from the top of the
  field oxide up to the top of the passivation nitride: a thick pre-metal dielectric, the thin local
  interconnect and its cap, then five aluminium levels of increasing thickness separated by oxide, and
  finally a thin oxide under a thicker nitride.
caption: >-
  The back end drawn to scale from the heights the PDK's process stack diagram labels.[^pdk-04] The
  diagram itself is marked "(Diagram not to scale!)";[^pdk-04] this chart redraws its labelled levels
  and intervals to scale, and adds nothing to them. The datum is the field-oxide top, the level the
  diagram puts at 0.3262 µm.[^pdk-04] To scale.
