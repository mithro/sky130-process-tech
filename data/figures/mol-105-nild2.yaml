id: mol-105-nild2
kind: xsection
page: docs/steps/105-nild2.md
series: series-mol.yaml
crop_depth: 60
alt: >-
  Two cross-sections of the wafer, one above the other. Before the step a thin hatched film covers
  three thin dark pads and the flat oxide between them. After it a thick pale oxide covers
  everything; its top is flat except near the right-hand edge, beyond the last pad, where it is lower.
caption: >-
  Before, the nitride-capped local interconnect; after, the inter-level oxide over it, filling the gaps
  between the pads. It is drawn with a nearly flat top, lower only beyond the last pad; how far its
  surface copies the pads' step is not drawn. The PDK's stack diagram labels this dielectric "NILD2 K=4.05";[^pdk-04] its
  as-deposited thickness is not public (the page infers of the order of 0.5–0.7 µm, a typical
  figure[^txt-05]) and is not drawn to scale. Whether a thin liner precedes it is not public, and
  none is drawn. The glass, the cap oxide, the tungsten plugs, the silicide discs, the contact liner and the transistors' films (the spacers,
  the caps, the gate oxides, the gate film, the re-oxidation oxide and the spacer oxide), the
  doped regions and the field oxide (the oxide-filled trench in the middle) are drawn but not
  labelled, and the liner oxide is drawn faded; the P-well and the NCHI channel implant made
  earlier are not drawn. In the lower panel the local interconnect is not labelled. Not to scale.
arrow:
  title: "NILD2, step 105"
  note: "A thick undoped oxide is deposited over the capped local interconnect."
