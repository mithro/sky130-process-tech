alt: >-
  One enlarged cross-section of one transistor edge. A capped gate stands on a thin oxide over
  the silicon; beside it a shallow doped layer lies in the silicon, and a hatched region lies
  under that layer and reaches a short way under the gate edge. The drawing is the same as the
  state before the step.
caption: >-
  A close-up of the 1.8 V NMOS gate edge, as for ASTI and BHI, at the tip anneal. The anneal
  activates the tip and halo drawn here, and the 5 V tip outside this view, but nothing the
  drawing shows moves: no depth is public for the tip (the page reads the PDK's 0.01 µm "N Tip
  (As)" entry as its lateral extent),[^pdk-03] and how far the anneal moves the halo boron is
  not public either. The ambient, the temperature and the time are not public; the page
  describes an industry-typical rapid thermal anneal. The tip's colour and the halo's hatching
  mark where the implants are, not their profiles. The caps, the re-oxidation oxide and the gate
  oxide are drawn but not labelled, and the liner oxide is drawn faded; the P-well and the NCHI
  channel implant made earlier are not drawn. Not to scale.
