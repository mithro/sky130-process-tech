id: sonos-042-onome
kind: xsection
page: docs/steps/042-onome.md
series: series-sonos.yaml
crop_depth: 90
alt: >-
  Two cross-sections of the wafer, one above the other. Before the step a resist island sits on the
  three-film stack over the right-hand active area, and the stack is bare elsewhere. After it the
  resist is gone and the three films survive only as an island under where the resist was; outside
  it the stack and the thin oxide under it are gone, and the silicon is bare on the left-hand
  active area and left of the island.
caption: >-
  Before, the resist island on the stack; after, the stack left as one island over the memory
  transistor, and the silicon bare everywhere else. The top oxide and the nitride are drawn etched
  away down to the oxide beneath them, which the page infers to be the pad oxide; that oxide is then
  drawn cleared as well, and the resist stripped, because this page treats the resist strip and the
  pre-gate-oxide clean as part of this step, although whether the last oxide goes here or at the
  GOX100 pre-clean is not stated publicly. The loss of fill oxide in the etches is not drawn; the fill oxide and the pad oxide left under the edge of the island are drawn but not labelled. The punch-through stop and the depletion implant (the bands of PTSI and DEPI) and the liner oxide are drawn faded; the P-well and the deep N-well are drawn but not labelled. Not to
  scale.
arrow:
  title: "ONOME, step 042"
  note: "The stack is etched away outside the resist island, the oxide under it cleared, and the resist stripped."
