id: poly-051-p1is
kind: xsection
page: docs/steps/051-p1is.md
series: series-poly.yaml
crop_depth: 72
alt: >-
  Two cross-sections of the wafer, one above the other. Before the step a single block of resist
  sits on a continuous film over the middle of the oxide-filled trench. After it the resist is
  gone and the film is bare across the whole slice.
caption: >-
  Before, the implanted resist island of RPM; after, the island gone and the gate film bare
  everywhere, the resistor body still undoped and the rest of the film n-type. The thin chemical oxide the clean leaves on the film is not drawn. The colours of the gate film mark the type of its doping, not a depth profile. In the upper panel the undoped film under the island is not labelled, because its leader would have to rise through the resist. In the upper panel the undoped film under the island is not labelled, because its leader would have to rise through the resist. The field oxide (the oxide-filled trench in the middle) and both gate oxides are drawn but not labelled, and the liner oxide is drawn faded; the P-well and the NCHI channel implant made earlier are not drawn. Not to
  scale.
arrow:
  title: "P1IS, step 051"
  note: "The crusted resist is ashed and stripped, and the bare film is cleaned for the next mask."
