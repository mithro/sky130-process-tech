id: iso-010-linox
kind: xsection
page: docs/steps/010-linox.md
series: series-isolation.yaml
crop_depth: 84
alt: >-
  Two cross-sections of the wafer, one above the other. Before the step the trench floor and walls are
  bare silicon. After it a thin, even thermal oxide lines the floor and both walls of the trench,
  while the active areas, still covered by nitride, are unchanged.
caption: >-
  Before, a bare trench; after, a thin thermal oxide lining its floor and both walls, with the
  active areas unchanged under their nitride. This cross-section is drawn outside a deep N-well
  region, so the buried layer of `DNI` (step 008) does not appear. A Spansion STI patent that later
  passed to Cypress, contemporaneous with the 130 nm node but not evidence for S8, grows a first
  liner "to a thickness of approximately 100-300 Å";[^pat-sti-cr] no SkyWater source gives the
  SKY130 liner thickness or temperature. Not to scale.
arrow:
  title: "LINOX, step 010"
  note: "The wafer is oxidised again; oxide grows only where silicon is exposed, that is inside the trench."
panels:
  - state_after: "009"
    hide_layers: [dnw]
    title: "Before: the cleaned, open trench after DNIS (step 009)"
  - state_after: "010"
    hide_layers: [dnw]
    title: "After: a thermal liner oxide on the trench floor and walls"
