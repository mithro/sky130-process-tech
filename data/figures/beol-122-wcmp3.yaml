alt: >-
  Two enlarged cross-sections of a filled hole in a flat pale oxide over a metal line. Before
  the step a thick grey tungsten film over a thin purple liner covers the whole top and fills the
  hole. After it the top is flat oxide again, with the tungsten and its liner left only inside the
  hole, their tops level with the oxide.
caption: >-
  A close-up of the middle via; the lower part of the slice is cut off, and the drawing starts
  inside the inter-level oxide under metal 1. Before, the tungsten and its liner over the whole
  wafer; after, both polished off the field down to the cap oxide, leaving the via plug: a
  0.15 µm square in the PDK's rules,[^pdk-periph] drawn here flush with the oxide. How far the
  polish recesses the plug and thins the oxide is not public, and neither is drawn. The oxide
  over the metal-1 line is 0.27 µm in the PDK's stack diagram;[^pdk-04] the plug is drawn about 1.1 times as tall as it is wide, and its liner with one thickness, thicker on the floor, in proportion, than it is. The right-hand via is polished in the same way, outside this
  view. The metal-1 line and the inter-level oxide under it are drawn but not labelled, nor, in the upper panel, are the liner and the oxides. Not to scale.
arrow:
  title: "WCMP3, step 122"
  note: "The tungsten and the liner are polished off the field, down to the cap oxide, leaving flush plugs."
