    note: "0.35 µm SRAM and logic process, Fab 4"
    basis: public
    cite: qtp-097483
  - title: "S4AD-5, 2001"
    note: "0.35 µm SONOS process built on R42D with six more masks; Fab 2, then Grace"
    basis: public
    cite: qtp-021507
  - title: "S8, 2007–2008"
    note: "0.13 µm SONOS process, Fab 4"
    basis: public
    cite: qtp-113005
    branch:
      title: "C8, 2005"
      note: "0.13 µm logic process, Fab 4, with the same first metal as S8"
      basis: public
      cite: qtp-043004
  - title: "SKY130"
    note: "SkyWater's name for S8"
    basis: public
    cite: pdk-previous
footer: "Only the processes the pages of this section cite. The two arrows into S8 are our reading, not statements in the sources."
alt: >-
  Four boxes one above the other joined by downward arrows: R42D in 1997, S4AD-5 in 2001, S8 in
  2007 to 2008, and SKY130. A side box, C8 in 2005, points into the S8 box.
caption: >-
  The processes S8 shares most with. S4AD-5 was built on R42D, as its report says.[^qtp-021507] The
  arrows into S8, from S4AD-5 (SONOS and the 110 Å oxide) and from C8 (the same first metal and
  generation), are our reading; no source says from which process S8 was derived.[^qtp-113005][^qtp-043004]
