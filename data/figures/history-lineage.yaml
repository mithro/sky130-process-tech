    basis: public
    cite: qtp-097483
  - title: "S4AD-5, 2001"
    note: "0.35 µm SONOS process built on R42D with six more masks; Fab 2, later Fab 4 and Grace"
    basis: public
    cite: qtp-021507
  - title: "S8, 2007–2008"
    note: "0.13 µm SONOS process, Fab 4"
    basis: public
    cite: qtp-113005
    branch:
      title: "C8, 2005"
      note: "0.13 µm logic process, Fab 4, with the same first metal as S8"
      basis: public
