id: poly-061-p1m
kind: xsection
page: docs/steps/061-p1m.md
series: series-poly.yaml
crop_depth: 72
alt: >-
  Two cross-sections of the wafer, one above the other. Before the step three stacked films
  cover the whole slice. After it two narrow resist lines stand on the stack: a narrow one over
  the right-hand active area and a wider one over the middle of the oxide-filled trench.
caption: >-
  Before, the complete, unpatterned gate stack; after, two resist lines on it, one where this
  slice places a gate over the thin-oxide NMOS area and one over the resistor body on the field
  oxide. The gate line's drawn minimum width is 0.150 µm (poly.1a), and a resistor body is at
  least 0.330 µm wide (poly.3);[^pdk-periph] neither width is drawn to scale. The gate-level
  resist is drawn thinner than the implant-mask resists, following the page's inference that it
  is thinner than the PDK's generic 1.14 µm;[^pdk-03] its thickness is not public. The colours of the gate film mark the type of its doping, not a depth profile. In the lower panel the p-type resistor body is not labelled, because its leader would have to rise through the resist line. The field oxide (the oxide-filled trench in the middle) and both gate oxides are drawn but not labelled, and the liner
  oxide is drawn faded; the P-well and the NCHI channel implant made earlier are not drawn. Not to scale.
arrow:
  title: "P1M, step 061"
  note: "Resist is coated, exposed through the poly reticle and developed, leaving a line wherever poly is to remain."
