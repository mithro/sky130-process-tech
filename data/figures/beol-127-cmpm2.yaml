id: beol-127-cmpm2
kind: xsection
page: docs/steps/127-cmpm2.md
series: series-beol.yaml
crop_depth: -84
alt: >-
  Two cross-sections of the upper films, one above the other, cut off at the bottom. Before the
  step a thick pale oxide buries three metal lines, its top higher over the lines than over the
  gaps. After it the oxide is polished flat, leaving a layer of it over the tops of the lines.
caption: >-
  Before, the NILD4 oxide as deposited; after, polished flat until the topography is gone, at a
  height above the metal-2 tops. The polish is stopped by the removal amount, not by a stop
  layer, and how much it removes is not public. The oxide left over metal 2 is drawn a little thicker than the oxide over metal 1; on the page's reading, with the cap of the next step it makes up the PDK's via-2 height of 0.42 µm over metal 2.[^pdk-04] Nothing is drawn to scale, and the pattern-density steps the page describes are not drawn. The lower part
  of the slice is cut off: the drawing starts inside the inter-level oxide under metal 1. The
  bottom and cap films of the metal-2 lines, the via plugs and their liners, the oxides of the
  via level and the metal-1 lines with their contact plugs are drawn but not labelled. Not to
  scale.
arrow:
  title: "CMPM2, step 127"
  note: "The oxide is polished flat, leaving a controlled thickness over the metal lines."
