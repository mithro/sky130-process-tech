id: sonos-037-ptsi
kind: xsection
page: docs/steps/037-ptsi.md
series: series-sonos.yaml
crop_depth: 90
alt: >-
  Two cross-sections of the wafer, one above the other. Before the step photoresist covers the
  surface except for a window over the right-hand active area, whose bottom is thin oxide. After it
  arrows come straight down into the window, and a hatched band lies a short way below the silicon
  surface under the window only; the silicon under the resist is untouched.
caption: >-
  Before, the opened tunnel window; after, a beam into the window and, under it only, the implanted
  dose drawn as a band a short way below the silicon surface. The band sits below the surface
  because this page describes the implant as a p-type punch-through stop under the memory
  transistor's channel, which is an inference; it is hatched with no colour of its own, and its
  depth and profile are not public. The species, energy and dose are not public, and the arrows are
  drawn vertical because the tilt is not public (7° is only the textbook convention). The oxide the
  ions pass is drawn as the pad oxide, which the page infers. The anti-reflective coating under the resist, the fill oxide and the deep N-well, and in the lower panel the P-well, are drawn but not labelled, and the liner oxide is drawn faded. Not to scale.
arrow:
  title: "PTSI, step 037"
  note: "Ions are implanted through the tunnel window to place a doping peak beneath the memory channel; the resist stops them elsewhere."
panels:
  - state_after: "036"
    title: "Before: the tunnel window, cleared at TUNARCE (step 036)"
    dim_layers: [liner]
    hide_labels: [sub, dnw, fox, arc]
  - state_after: "037"
    title: "After: an implanted band below the surface of the memory channel"
    dim_layers: [liner]
    hide_labels: [sub, dnw, fox, pwell, arc]
