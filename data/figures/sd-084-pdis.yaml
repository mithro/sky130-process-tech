id: sd-084-pdis
kind: xsection
page: docs/steps/084-pdis.md
series: series-tips-sd.yaml
crop_depth: 72
alt: >-
  Two cross-sections of the wafer, one above the other. Before the step resist covers both
  active areas and leaves a window over a wide stack on the oxide-filled trench. After it the
  resist is gone and a thin oxide covers everything, as before the mask.
caption: >-
  Before, the PSDM resist after the two p-type implants; after, the resist stripped and the wafer
  cleaned. On this reference's reading the surface under the resist is the spacer oxide
  everywhere, and the clean leaves it in place (no HF step, as the page infers), so it is drawn
  unchanged; how much of it the clean takes is not public. The resist's implanted crust is not
  drawn. The colours of the gate film mark the type of its doping, not a depth profile. The
  spacers, the caps, the gate oxides, the re-oxidation oxide, the tips and the halo, and the
  field oxide (the oxide-filled trench in the middle) are drawn but not labelled, and the liner
  oxide is drawn faded; the P-well and the NCHI channel implant made earlier are not drawn. Not to
  scale.
arrow:
  title: "PDIS, step 084"
  note: "The implanted resist is ashed and the wafer cleaned, sparing the spacer oxide."
