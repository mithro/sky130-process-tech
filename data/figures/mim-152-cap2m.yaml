alt: >-
  Two enlarged cross-sections of the upper films, cut off at the bottom. Before the step a
  purple film lies on a very thin striped film over a blanket metal stack. After it a violet
  resist block stands on the purple film over the right-hand part of the width, with the film
  bare to its left.
caption: >-
  A close-up of part of the metal-4 level, at the left edge of a second capacitor that runs on
  past the right-hand edge of the view; the lower part of the slice is cut off, and the drawing
  starts inside the oxide under metal 4. Before, the blanket top-plate film on the
  dielectric; after, the resist of the second capacitor mask left where the layout draws a
  `cap2m` plate, with the film bare everywhere else. The PDK publishes no `cap2m` rules; this
  page reads the plate geometry as that of `capm`, 2 µm minimum width and 0.84 µm minimum
  space[^pdk-03] (inference). Where the plate edge falls is an illustrative choice, and neither
  the plate nor the resist is drawn to scale; the dielectric, some 20–30 nm on the estimate of
  the CAPILD2 page, and the plate film are drawn thicker in proportion than they are. The two
  oxides and the bottom film of the metal stack are drawn but not labelled, nor, in the upper panel, is the
  aluminium–copper. Not to scale.
