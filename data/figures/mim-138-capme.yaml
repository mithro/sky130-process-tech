crop_depth: -461
alt: >-
  Two enlarged cross-sections of the upper films, cut off at the bottom. Before the step a violet
  resist block stands on a purple film over the right-hand part of the width. After it the resist
  is gone and the purple film remains only where the resist was, as a raised plate with a
  vertical edge; to its left the very thin striped film is bare on the blanket metal stack.
caption: >-
  A close-up of the left edge of a capacitor top plate; the lower part of the slice is cut off,
  and the drawing starts inside the oxide under metal 3. Before, the resist block on the
  blanket plate film; after, the plate etched away outside the resist, stopping on the thin
  dielectric, which is left on the whole blanket metal-3 stack, and the resist stripped (the
  page treats the strip and clean as part of this step). Whether the etch stops on the
  dielectric or cuts through it is not public; the page reads the stop as the more plausible (inference), while the PDK's
  schematic cross-section draws the dielectric only under the plate.[^pdk-07] Any small loss
  into the dielectric is not drawn, and the plate edge is drawn vertical. The plate (of the
  order of 0.1 µm, the page's reading), the dielectric and the metal are not drawn to scale. The
  two oxides and the bottom film of the metal stack are drawn but not labelled, nor, in the upper panel, is the
  aluminium–copper. Not to scale.
