series: series-wells.yaml
crop_depth: 128
no_drawn_change: true
alt: >-
  One cross-section of the wafer. Resist covers the left-hand part of the drawing and the PMOS active
  area, with its thin hatched surface band inside the N-well, lies in a window on which arrows come
  down. The drawing is the same as the state before the step.
caption: >-
  At PCHI a light channel implant goes through the HVTPM window into the PMOS channel area; the
  drawing is the state at this step, which is the same as before it, the surface band now standing
  for both of the channel implants it has received. On the page's reading PCHI adds dopant to the
  PMOS channel, on top of the dose the page infers LVTPI gave it; its species, energy and dose are
  not public, and no public source gives the depth of either implant, so the drawing does not
  separate them. The arrows are drawn vertical because the tilt is not public. The fill oxide is drawn but not labelled; the NMOS channel implant and the liner oxide are drawn faded. Not to scale.
