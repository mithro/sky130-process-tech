id: wells-022-hvtpm
kind: xsection
page: docs/steps/022-hvtpm.md
series: series-wells.yaml
crop_depth: 128
alt: >-
  Two cross-sections of the wafer, one above the other. Before the step the oxide surface is bare over
  an N-well on the right. After it a block of photoresist covers the left-hand part of the drawing up
  to the middle of the trench, and the right-hand active area, with its implanted surface band, lies
  in an open window.
caption: >-
  Before, the bare wafer with its N-well; after, resist over the NMOS side and a window over the PMOS.
  The PDK's mask table lists "High Vt PCh*, HVTPM".[^pdk-05] The page sets out two readings of the
  opening — over the drawn `hvtp` devices only, or over most low-voltage N-well outside `lvtn` — and
  the PMOS area drawn here lies in the window on either; which matches the plate is not
  public.[^pdk-errors] The resist edge in the trench is illustrative. The LVTNI band and the liner
  oxide are drawn faded. Not to scale.
arrow:
  title: "HVTPM, step 022"
  note: "Resist is coated, exposed through the high-Vt PMOS mask and developed, opening windows over PMOS channels."
