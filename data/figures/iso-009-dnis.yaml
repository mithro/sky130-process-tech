id: iso-009-dnis
kind: xsection
page: docs/steps/009-dnis.md
series: series-isolation.yaml
alt: >-
  Two cross-sections of the wafer, one above the other. Before the step the thick implant resist still
  covers the right-hand part of the drawing. After it the resist is gone, the nitride and pad oxide
  are back in view over both active areas, the trench is open again and the buried N-type band is
  unchanged.
caption: >-
  The wafer before and after `DNIS`, the first of the many implant strip steps in this reference. The
  resist has been bombarded by MeV phosphorus ions, which carbonise its top surface into a hard crust
  that ordinary oxygen ashing removes slowly and that can pop or flake during heating;[^orvek-1985]
  the wafer beneath it has open trenches with bare, plasma-damaged sidewalls, so the clean must be
  gentle with them. Not to scale.
arrow:
  title: "DNIS, step 009"
  note: "The implanted resist is stripped and the wafer is cleaned for the liner-oxidation furnace."
panels:
  - state_after: "008"
    title: "Before: the implanted resist from DNI (step 008)"
    show_ions: false
  - state_after: "009"
    title: "After: resist removed, the open trench ready for LINOX"
