close_up_name: "the right-hand metal contact"
crop_depth: -130
alt: >-
  Two enlarged cross-sections of a flat pale oxide over a thin hatched film and a thin purple pad,
  which stands on a larger tungsten plug. Before the step a violet resist with a narrow window
  lies on the oxide. After it the resist is gone and under the window a small hole with sloping
  walls, narrower at the bottom, goes down through the oxide and the hatched film to the pad.
caption: >-
  A close-up of the right-hand metal contact, over the local-contact plug beside the gate; the
  lower part of the slice is cut off. Before, the contact resist; after, the hole etched through
  the inter-level oxide and the LI nitride cap to the titanium nitride of the local interconnect,
  and the resist stripped, which the page treats as part of this step. That the etch first stops
  on the nitride cap and then opens it is the page's reading of the stack diagram. The hole is
  drawn tapered, the bottom about half the top, as the pages read the PDK's 0.09 µm "Standard
  contact bottom CD"[^pdk-03] against the 0.170 µm drawn square (ct.1);[^pdk-periph] the wall
  angle is not public. The hole is drawn much shallower than it is: on the page's reading of the
  stack diagram it is about 0.34 µm deep,[^pdk-04] about twice its width. The left-hand hole is
  etched in the same way, outside this view. The local interconnect, the local-contact plug and
  its liner, the glass and the cap oxide below are drawn but not labelled. Not to scale.
