series: series-isolation.yaml
alt: >-
  A cross-section of the bare starting wafer: one block of p-type silicon with a flat, featureless top
  surface and no film of any kind on it. The block runs off the left, right and bottom edges of the
  drawing, because the wafer continues beyond the slice that is shown.
caption: >-
  The wafer as it enters the flow. SkyWater's platform table gives the S130 substrate as
  "Bulk"[^skw-02] and the PDK's process-stack drawing labels the bottom of the stack
  "p-substrate",[^pdk-04] so the slice is drawn as bare p-type bulk silicon. Nothing else about the
  wafer — resistivity, orientation, oxygen content — is public. Not to scale.
