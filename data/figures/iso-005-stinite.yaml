id: iso-005-stinite
kind: xsection
page: docs/steps/005-stinite.md
series: series-isolation.yaml
crop_depth: 84
alt: >-
  Two cross-sections of the wafer, one above the other. Before the step the nitride and pad oxide run
  unbroken under the two blocks of resist and across the gap between them. After it the nitride and
  pad oxide have been cut away in that gap, so the silicon in the middle of the drawing is bare while
  the sides are still covered by resist, nitride and pad oxide.
caption: >-
  Before, resist over an unbroken nitride and pad oxide; after, the two films cut away between the
  resist blocks and the silicon there left bare. The anti-reflective coating the page describes is
  not drawn. This reference keeps this etch and the silicon trench etch that follows as two steps,
  and the hand-off between them is not public. Not to scale.
arrow:
  title: "STINITE, step 005"
  note: "A plasma etch cuts through the nitride and the pad oxide in the open field, stopping on silicon."
