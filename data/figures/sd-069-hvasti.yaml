series: series-tips-sd.yaml
close_up: [0, 97]
close_up_name: "the 5 V NMOS area"
crop_depth: 50
alt: >-
  Two enlarged cross-sections of the left-hand end of the slice, one above the other: an active
  area under a thick oxide, and the edge of the oxide-filled trench on the right. Before the step
  the active area is bare and a thin resist edge stands on the trench oxide. After it steeply slanted arrows come down on it, and a doped layer
  lies in the silicon under the whole active area.
caption: >-
  A close-up of the 5 V NMOS area at the left-hand end of the slice, inside the HVNTM window; only
  the edge of the thin resist, on the field oxide at the right, is in view. Before, the open window; after, the
  high-voltage n-type tip in the silicon. The
  arrows lean at the PDK's 40° "Angle for HV tip implant"; its 23° twist, which turns the beam
  out of the plane of the drawing, is not drawn, and the number of rotations is not
  public.[^pdk-03] There is no gate in the 5 V area of this slice, so the tip covers the whole
  area and the reach under a gate edge that the tilt gives is not shown; nor is the shadow that
  the resist wall casts. The tip is drawn deeper than the 1.8 V tip, as a graded, lightly doped
  drain; its depth is not public, and the PDK's 0.1 µm "N+ or P+ S/D (XJ)"[^pdk-03] is deeper
  still. That the species is arsenic follows the PDK's "N Tip
  (As)" row.[^pdk-03] The colour marks the type of the doping, not a profile. The thick gate
  oxide in the lower panel, the re-oxidation oxide over it and the field oxide at the right are
  drawn but not labelled, nor is the silicon, whose leader would run beside the trench wall or
  across the beam; the liner oxide is drawn faded, and the P-well made earlier is not drawn. Not
  to scale.
arrow:
  title: "HVASTI, step 069"
  note: "Arsenic is implanted at a large tilt through the thin resist's window."
