close_up_name: "the middle via"
routes: {m1cap: right, m1al: right}
crop_depth: -265
alt: >-
  Two enlarged cross-sections of a hole with vertical walls going down through a flat pale oxide
  to a thin purple film on top of a metal line. Before the step the hole is open. After it a thin
  purple film of even thickness covers the whole top: the oxide surface, the walls of the hole
  and its floor, leaving a narrow opening in the middle.
caption: >-
  A close-up of the middle via; the lower part of the slice is cut off, and the drawing starts
  inside the inter-level oxide under metal 1. Before, the via hole etched to the cap of the
  metal-1 line; after, the liner over the whole wafer: across the oxide, down the walls of the
  hole and over its floor. The page describes it as ionised-metal-plasma titanium nitride; its
  thickness is not public (industry-typical: a few tens of nanometres over the oxide, much less
  on the floor of the via[^txt-05]). It is drawn with one thickness everywhere,
  which such a film does not have, and far thicker in proportion to the hole than a film of a
  few tens of nanometres in a 0.15 µm hole. The liner and the cap of the line are drawn in the one colour
  the figure conventions use for every Ti, TiN and TiW film; which film the cap is is not public
  (the overview of the metal cap sets out the readings). The hole is drawn about 1.1 times as
  deep as it is wide; on the page it is 0.15 µm wide and 0.27 µm deep,[^pdk-periph][^pdk-04]
  about 1.8:1. The right-hand via is lined in the same way, outside this view. The bottom film
  of the line and the inter-level oxide under it are drawn but not labelled, nor, in the upper
  panel, is the aluminium alloy, nor, in the lower
  panel, are the cap oxide, the inter-metal oxide and the metal-1 line. Not to scale.
arrow:
  title: "TIN3, step 120"
  note: "Titanium nitride is sputtered over the whole wafer, lining the via holes."
