id: pass-168-pdm
kind: xsection
page: docs/steps/168-pdm.md
series: series-passivation.yaml
crop_depth: -325
alt: >-
  Two cross-sections of the upper films, one above the other, cut off at the bottom. Before the
  step two thick metal shapes lie under a thin pale film and a thick green film that covers
  everything. After it a thick violet resist layer with a flat top covers the slice except for
  one window over the middle of the left-hand metal shape, where the green film is bare.
caption: >-
  Before, the metal-5 shapes under the passivation oxide and nitride; after, the resist of the
  pad mask, with one opening. The left-hand metal-5 shape stands here for a pad (an
  illustrative choice: the slice is not drawn to any pad size). The opening lies inside the
  metal, which extends beyond it on both sides; in SkyWater's GPIO cell the opening is 60 µm ×
  70 µm and the metal-5 pad extends 2.7 µm beyond it on every side,[^pdk-io-gpiov2] and the
  smallest allowed opening is 2 µm (`PDMCD`),[^pdk-03] none of which is drawn to scale. The
  resist's thickness is not public; it is drawn covering the metal-5 steps. The lower part of
  the slice is cut off: the drawing starts inside the oxide under metal 5. The metal-5 films,
  the via-4 fill, the metal-4 line, the capacitor plates and the oxides under the passivation
  oxide are drawn but not labelled, nor, in the lower panel, is the passivation oxide. Not to
  scale.
arrow:
  title: "PDM, step 168"
  note: "Resist is coated, exposed through the pad reticle and developed, opening a window over the pad."
