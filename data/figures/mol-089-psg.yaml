id: mol-089-psg
kind: xsection
page: docs/steps/089-psg.md
series: series-mol.yaml
crop_depth: 110
alt: >-
  Two cross-sections of the wafer, one above the other. Before the step a thin oxide covers two
  active areas, an oxide-filled trench between them with a wide stack on it, and a narrow capped
  gate on the right. After it a thick dotted glass buries everything; its top steps up from the
  left-hand active area to a plateau over the wide stack and stays high over the gate.
caption: >-
  Before, the slice after the source/drain anneal; after, the phosphosilicate glass over
  everything; its top copies the steps beneath it in broad terraces, lowest over the 5 V area on
  the left. The PDK's stack diagram
  labels this dielectric "PSG K=3.9".[^pdk-04] Its as-deposited thickness is not public: the
  page infers a film of the order of 0.6–0.9 µm, a typical industry figure,[^txt-05] and it is
  not drawn to scale. Its real profile, how it fills the gaps between lines and any undoped liner under it are not
  drawn. The
  colours mark the type of the doping, not a depth profile. The spacers, the caps, the gate
  oxides, the gate film, the re-oxidation oxide, the tips and the halo, and the field oxide (the
  oxide-filled trench in the middle) are drawn but not labelled, and the liner oxide is drawn faded; the P-well and the NCHI channel implant made earlier are not drawn. In the lower panel
  only the new glass and the silicon are labelled. Not to scale.
arrow:
  title: "PSG, step 089"
  note: "A thick phosphorus-doped oxide is deposited over the whole wafer."
