close_up_name: "the via-3 hole on a capacitor plate"
routes: {m3al: right, m3cap: right, capild: right, capm: right, ncap5: right}
crop_depth: -946
alt: >-
  Two enlarged cross-sections of a shallow hole with vertical walls going down through a flat
  pale oxide to a purple plate, which lies on a very thin striped film over a metal line.
  Before the step the hole is open. After it a thin purple film of even thickness covers the
  whole top: the oxide surface, the walls of the hole and its floor, leaving an opening in the
  middle.
caption: >-
  A close-up of the via-3 hole on the capacitor's top plate; the lower part of the slice is cut
  off, and the drawing starts inside the aluminium of the metal 3 under the capacitor. Before,
  the hole etched to the plate; after, the liner over the whole wafer: across the oxide, down
  the walls of the hole and over its floor. The page describes it as ionised-metal-plasma
  titanium nitride; its thickness is not public (industry-typical: a few tens of nanometres over
  the oxide, much less on the floor of the via[^txt-05]). It is drawn with one thickness
  everywhere, which such a film does not have, and far thicker in proportion to the hole than
  it is. The liner, the plate and the metal cap are drawn in the one colour the figure
  conventions use for every Ti, TiN and TiW film; the plate is TiW as the page assumes, and
  which film caps metal 3 is not public (the overview of the metal cap sets out the readings).
  The hole on the metal-3 line, outside this view, is lined in the same way down to its floor
  on the cap. Over metal 3 the PDK's via 3 is 0.20 µm wide and 0.39 µm
  deep;[^pdk-periph][^pdk-04] over a plate it is shallower by the plate and the dielectric
  (0.1–0.2 µm on the page's reading), which leaves it about as deep as it is wide, or up to
  about one and a half times deeper, on those figures; this hole is drawn a little less deep
  than it is wide. The oxides and the aluminium–copper of metal 3 are drawn but not labelled, nor, in the
  lower panel, are the plate, the dielectric and the metal cap. Not to scale.
