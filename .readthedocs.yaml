version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    pre_install:
      - pip install uv
    install:
      - uv export --no-hashes --format requirements-txt > requirements.txt
      - pip install -r requirements.txt

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
